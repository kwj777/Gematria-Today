name: Delete Merged Branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch after merge
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Don't delete protected branches
            const protectedBranches = ['main', 'master', 'preview'];
            if (protectedBranches.includes(branch)) {
              console.log(`Skipping protected branch: ${branch}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch: ${branch}`);
            } catch (e) {
              console.log(`Could not delete branch ${branch}: ${e.message}`);
            }

      - name: Delete all merged branches
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = ['main', 'master', 'preview'];
            const currentBranch = context.ref.replace('refs/heads/', '');

            // Get all merged PRs
            const mergedPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });

            const mergedBranches = new Set(
              mergedPRs
                .filter(pr => pr.merged_at !== null)
                .map(pr => pr.head.ref)
            );

            console.log(`Found ${mergedBranches.size} merged branches to delete`);

            let deleted = 0;
            let skipped = 0;
            for (const branch of mergedBranches) {
              if (protectedBranches.includes(branch) || branch === currentBranch) {
                console.log(`Skipping: ${branch}`);
                skipped++;
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                console.log(`Deleted: ${branch}`);
                deleted++;
              } catch (e) {
                console.log(`Could not delete ${branch}: ${e.message}`);
                skipped++;
              }
            }
            console.log(`Done. Deleted: ${deleted}, Skipped: ${skipped}`);
