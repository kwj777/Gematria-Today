name: Sync Netlify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-netlify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK secret is not configured; skipping Netlify deploy trigger."
            exit 0
          fi

          curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK"
