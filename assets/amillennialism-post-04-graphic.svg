<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Isaiah 11 and 65 — Peaceable Kingdom and New Creation</title>
  <desc id="desc">A cinematic theological graphic in a modern editorial style, featuring a peaceable kingdom scene, new creation city, and amillennial framing with symbolic line work.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="55%" stop-color="#13223f"/>
      <stop offset="100%" stop-color="#1b2f56"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffe8b0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffd778" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd778" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7fc6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b46a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f2d48e" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#f2d48e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4b46a" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.06"/>
      </feComponentTransfer>
    </filter>

    <style>
      .title {
        font: 700 86px 'Cinzel', 'Times New Roman', serif;
        letter-spacing: 1.4px;
        fill: #f6e9c7;
      }
      .subtitle {
        font: 600 33px 'Inter', 'Segoe UI', Arial, sans-serif;
        letter-spacing: 0.8px;
        fill: #c8dcff;
      }
      .scripture {
        font: 600 26px 'Inter', 'Segoe UI', Arial, sans-serif;
        letter-spacing: 1.2px;
        fill: #f2d48e;
      }
      .label {
        font: 500 19px 'Inter', 'Segoe UI', Arial, sans-serif;
        letter-spacing: 0.6px;
        fill: #dce9ff;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <path d="M0 610 C220 560, 440 650, 680 590 C910 530, 1180 620, 1600 565 L1600 900 L0 900 Z" fill="#0f1c35"/>
  <path d="M0 640 C240 605, 500 680, 760 630 C980 585, 1250 665, 1600 620 L1600 900 L0 900 Z" fill="#122446"/>
  <path d="M0 560 L1600 560 L1600 620 L0 620 Z" fill="url(#horizon)"/>

  <!-- New-creation city silhouette -->
  <g opacity="0.65">
    <rect x="1040" y="365" width="20" height="155" fill="#95b7ff"/>
    <rect x="1068" y="330" width="26" height="190" fill="#a8c3ff"/>
    <rect x="1104" y="385" width="18" height="135" fill="#8fb2ff"/>
    <rect x="1130" y="300" width="28" height="220" fill="#b7ccff"/>
    <rect x="1168" y="348" width="20" height="172" fill="#99bcff"/>
    <rect x="1196" y="390" width="18" height="130" fill="#88adff"/>
    <rect x="1222" y="335" width="26" height="185" fill="#a8c3ff"/>
    <rect x="1258" y="360" width="21" height="160" fill="#94b7ff"/>
    <polygon points="1144,262 1160,300 1128,300" fill="#d7e4ff"/>
    <polygon points="1234,300 1248,335 1220,335" fill="#d7e4ff"/>
  </g>

  <!-- Central tree of life -->
  <g transform="translate(765 535)">
    <rect x="-12" y="0" width="24" height="180" rx="10" fill="#3b2d1c"/>
    <path d="M0 15 C-70 -35,-120 -35,-180 10 C-115 0,-70 25,-8 58 Z" fill="#3fa56e" opacity="0.9"/>
    <path d="M0 5 C75 -35,140 -32,200 20 C130 -2,74 20,8 63 Z" fill="#49b87a" opacity="0.92"/>
    <path d="M0 55 C-90 5,-150 20,-220 70 C-145 48,-90 70,-20 100 Z" fill="#379d67" opacity="0.88"/>
    <path d="M0 52 C88 4,160 25,235 88 C150 62,95 87,20 108 Z" fill="#4bbd7f" opacity="0.9"/>
  </g>

  <!-- Peaceable kingdom symbols: wolf and lamb -->
  <g transform="translate(440 640)">
    <ellipse cx="0" cy="45" rx="82" ry="38" fill="#8fa4be"/>
    <circle cx="70" cy="28" r="23" fill="#8fa4be"/>
    <polygon points="82,8 95,-10 70,4" fill="#8fa4be"/>
    <polygon points="62,10 52,-12 48,8" fill="#8fa4be"/>
    <circle cx="76" cy="24" r="3.8" fill="#0f1c35"/>
  </g>

  <g transform="translate(620 665)">
    <ellipse cx="0" cy="38" rx="56" ry="31" fill="#f0e7d2"/>
    <circle cx="45" cy="22" r="18" fill="#f0e7d2"/>
    <ellipse cx="58" cy="16" rx="8" ry="10" fill="#f7efdc"/>
    <ellipse cx="38" cy="16" rx="8" ry="10" fill="#f7efdc"/>
    <circle cx="49" cy="20" r="2.8" fill="#1c2a4a"/>
  </g>

  <!-- Child leading motif -->
  <g transform="translate(530 625)" opacity="0.95">
    <circle cx="0" cy="0" r="15" fill="#ffdca6"/>
    <rect x="-11" y="16" width="22" height="44" rx="10" fill="#d7c0ff"/>
    <path d="M-6 44 L-28 72" stroke="#d7c0ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M8 44 L28 72" stroke="#d7c0ff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Framing linework in target style -->
  <g opacity="0.95" filter="url(#softGlow)">
    <rect x="78" y="68" width="1444" height="764" rx="18" fill="none" stroke="url(#goldLine)" stroke-width="2.8"/>
    <line x1="120" y1="146" x2="1480" y2="146" stroke="url(#goldLine)" stroke-width="2"/>
    <line x1="120" y1="778" x2="1480" y2="778" stroke="url(#goldLine)" stroke-width="2"/>
  </g>

  <!-- Text block -->
  <g transform="translate(140 176)">
    <text class="scripture" x="0" y="0">ISAIAH 11 + ISAIAH 65</text>
    <text class="title" x="0" y="102">PEACEABLE KINGDOM</text>
    <text class="subtitle" x="0" y="156">and New Creation — without a middle age</text>
    <text class="label" x="0" y="206">Amillennial reading: present reign, final renewal, one consummation.</text>
  </g>

  <!-- subtle emblem lines -->
  <g stroke="#d7bb7a" stroke-opacity="0.35" fill="none">
    <path d="M1320 200 C1380 240,1420 290,1450 360"/>
    <path d="M1290 245 C1350 280,1395 330,1424 396"/>
    <circle cx="1272" cy="178" r="10" fill="#d7bb7a" fill-opacity="0.55"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.45"/>
</svg>
