<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Full Totals, Digital Roots, and Base-Rooted Words hero image</title>
  <desc id="desc">A three-panel illustration. Each row shows one word with its actual English gematria total and digital root: rule = 336 / 3, reign = 318 / 3, crown = 438 / 6 (base-rooted), kingdom = 438 / 6 (base-rooted). Base-rooted rows are marked.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1480" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1027"/>
      <stop offset="0.55" stop-color="#141B42"/>
      <stop offset="1" stop-color="#22154F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 450) rotate(90) scale(380)">
      <stop stop-color="#8EE7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8EE7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelA" x1="80" y1="160" x2="500" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2A61" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#101736" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="panelB" x1="540" y1="160" x2="1060" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241A55" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#13103A" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="panelC" x1="1100" y1="160" x2="1520" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3E3A" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0A1F26" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="135" x2="0" y2="765" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EE7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8EE7FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8EE7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseRowHighlight" x1="80" y1="0" x2="1520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FE6CF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7FE6CF" stop-opacity="0.18"/>
      <stop offset="0.82" stop-color="#7FE6CF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7FE6CF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="380" fill="url(#halo)"/>

  <g opacity="0.18" stroke="#9CC8FF">
    <path d="M0 150H1600"/>
    <path d="M0 300H1600"/>
    <path d="M0 450H1600"/>
    <path d="M0 600H1600"/>
    <path d="M0 750H1600"/>
    <path d="M200 0V900"/>
    <path d="M400 0V900"/>
    <path d="M600 0V900"/>
    <path d="M800 0V900"/>
    <path d="M1000 0V900"/>
    <path d="M1200 0V900"/>
    <path d="M1400 0V900"/>
  </g>

  <rect x="80" y="540" width="1440" height="56" fill="url(#baseRowHighlight)"/>
  <rect x="80" y="618" width="1440" height="56" fill="url(#baseRowHighlight)"/>

  <rect x="80" y="135" width="440" height="630" rx="28" fill="url(#panelA)" stroke="#6FA9FF" stroke-opacity="0.55"/>
  <rect x="580" y="135" width="440" height="630" rx="28" fill="url(#panelB)" stroke="#B79CFF" stroke-opacity="0.55"/>
  <rect x="1080" y="135" width="440" height="630" rx="28" fill="url(#panelC)" stroke="#7FE6CF" stroke-opacity="0.55"/>

  <rect x="547" y="135" width="6" height="630" fill="url(#divider)"/>
  <rect x="1047" y="135" width="6" height="630" fill="url(#divider)"/>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="300" y="230" font-size="40" font-weight="700" fill="#C8ECFF">Full Totals</text>
    <text x="300" y="268" font-size="20" font-weight="500" fill="#9FD5FF">Exact value</text>
    <text x="800" y="230" font-size="40" font-weight="700" fill="#E0CCFF">Digital Roots</text>
    <text x="800" y="268" font-size="20" font-weight="500" fill="#BFA9FF">Compressed signature</text>
    <text x="1300" y="230" font-size="40" font-weight="700" fill="#C8FFEB">Base-Rooted</text>
    <text x="1300" y="268" font-size="20" font-weight="500" fill="#9FE6CC">Semantic anchor</text>
  </g>

  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="middle">
    <text x="300" y="395" font-size="58" font-weight="700" fill="#DDF6FF">336</text>
    <text x="300" y="475" font-size="58" font-weight="700" fill="#DDF6FF">318</text>
    <text x="300" y="575" font-size="58" font-weight="700" fill="#A8FFE0">438</text>
    <text x="300" y="655" font-size="58" font-weight="700" fill="#A8FFE0">438</text>
  </g>

  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="middle">
    <text x="800" y="395" font-size="58" font-weight="700" fill="#E9D9FF">3</text>
    <text x="800" y="475" font-size="58" font-weight="700" fill="#E9D9FF">3</text>
    <text x="800" y="575" font-size="58" font-weight="700" fill="#C8FFEB">6</text>
    <text x="800" y="655" font-size="58" font-weight="700" fill="#C8FFEB">6</text>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="1300" y="395" font-size="36" font-weight="700" fill="#DAFBEC">rule</text>
    <text x="1300" y="475" font-size="36" font-weight="700" fill="#DAFBEC">reign</text>
    <text x="1300" y="575" font-size="36" font-weight="700" fill="#A8FFE0">crown</text>
    <text x="1300" y="655" font-size="36" font-weight="700" fill="#A8FFE0">kingdom</text>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif">
    <rect x="1402" y="555" width="100" height="30" rx="15" fill="#7FE6CF"/>
    <text x="1452" y="576" text-anchor="middle" font-size="16" font-weight="700" fill="#0A1F26">BASE ✓</text>
    <rect x="1402" y="635" width="100" height="30" rx="15" fill="#7FE6CF"/>
    <text x="1452" y="656" text-anchor="middle" font-size="16" font-weight="700" fill="#0A1F26">BASE ✓</text>
  </g>

  <g stroke="#8EE7FF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8">
    <path d="M380 380 H720"/>
    <path d="M380 460 H720"/>
  </g>
  <g stroke="#7FE6CF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 8">
    <path d="M380 560 H720"/>
    <path d="M380 640 H720"/>
  </g>
  <g stroke="#7FE6CF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 8">
    <path d="M880 380 H1220"/>
    <path d="M880 460 H1220"/>
  </g>
  <g stroke="#7FE6CF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 8">
    <path d="M880 560 H1220"/>
    <path d="M880 640 H1220"/>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" fill="#9FD5FF" text-anchor="middle" opacity="0.9">
    <text x="800" y="725">English gematria (A=6, B=12 ... Z=156)  ·  base-rooted: total = 6 + 54k</text>
  </g>
</svg>
