<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Determining the Identity of the Beast - Revelation 13 hero artwork</title>
  <desc id="desc">A layered blue and gold composition featuring a luminous 666 medallion with radiating rays, flanked by a methodology flow of three steps: English gematria, digital roots, and base-root word families.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050F1F"/>
      <stop offset="0.45" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#1B5189"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 430) rotate(0) scale(520)">
      <stop stop-color="#F6CF62" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#E0992A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A1B33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medallionFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 430) scale(180)">
      <stop stop-color="#1A3A60"/>
      <stop offset="0.7" stop-color="#0A1F38"/>
      <stop offset="1" stop-color="#050F1F"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="1000" y1="250" x2="1360" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBE499"/>
      <stop offset="0.5" stop-color="#F6CF62"/>
      <stop offset="1" stop-color="#B8841C"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="80" y1="180" x2="80" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFDDFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15355A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B223A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="80" y1="400" x2="980" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2746" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#15406F" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="numGrid" width="160" height="120" patternUnits="userSpaceOnUse">
      <text x="0" y="40" fill="#6EC1FF" fill-opacity="0.05" font-family="Georgia, serif" font-size="28">666</text>
      <text x="80" y="100" fill="#F6CF62" fill-opacity="0.04" font-family="Georgia, serif" font-size="22">13</text>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#numGrid)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g opacity="0.22" stroke="#7FC4FF" fill="none" stroke-width="1.2">
    <circle cx="1180" cy="430" r="280"/>
    <circle cx="1180" cy="430" r="340"/>
    <circle cx="1180" cy="430" r="400"/>
  </g>

  <g opacity="0.35" stroke="#F6CF62" stroke-width="1" stroke-linecap="round">
    <line x1="1180" y1="430" x2="1180" y2="120"/>
    <line x1="1180" y1="430" x2="1490" y2="430"/>
    <line x1="1180" y1="430" x2="1180" y2="740"/>
    <line x1="1180" y1="430" x2="870" y2="430"/>
    <line x1="1180" y1="430" x2="1400" y2="210"/>
    <line x1="1180" y1="430" x2="1400" y2="650"/>
    <line x1="1180" y1="430" x2="960" y2="650"/>
    <line x1="1180" y1="430" x2="960" y2="210"/>
  </g>

  <g opacity="0.6">
    <path d="M0 740 C 260 700 420 760 640 740 C 880 720 1040 770 1280 740 C 1440 720 1540 740 1600 730 L 1600 900 L 0 900 Z" fill="#08182C" fill-opacity="0.85"/>
    <path d="M0 790 C 260 760 420 820 640 790 C 880 770 1040 820 1280 790 C 1440 770 1540 800 1600 780 L 1600 900 L 0 900 Z" fill="#04101F" fill-opacity="0.7"/>
  </g>

  <g transform="translate(80,90)">
    <rect width="240" height="44" rx="22" fill="none" stroke="#6EC1FF" stroke-opacity="0.6"/>
    <circle cx="22" cy="22" r="5" fill="#F6CF62"/>
    <text x="40" y="29" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">REVELATION 13  •  METHODOLOGY</text>
  </g>

  <text x="80" y="230" fill="url(#titleGrad)" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">Determining the Identity</text>
  <text x="80" y="312" fill="url(#titleGrad)" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">of the <tspan fill="#F6CF62">Beast</tspan></text>

  <g transform="translate(80,360)">
    <rect width="900" height="58" rx="10" fill="url(#ribbonGrad)" stroke="#76C9FF" stroke-opacity="0.7"/>
    <text x="28" y="38" fill="#F6CF62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">ENGLISH GEMATRIA</text>
    <text x="318" y="38" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">+</text>
    <text x="346" y="38" fill="#F6CF62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">DIGITAL ROOTS</text>
    <text x="582" y="38" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">+</text>
    <text x="610" y="38" fill="#F6CF62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">BASE-ROOT WORDS</text>
  </g>

  <text x="80" y="460" fill="#9EC3E8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" font-style="italic">A transparent framework — count with method, not speculation.</text>

  <g transform="translate(1180,430)">
    <g filter="url(#softGlow)">
      <circle r="210" fill="#F6CF62" fill-opacity="0.08"/>
    </g>
    <circle r="190" fill="url(#medallionFill)" stroke="url(#goldRim)" stroke-width="3"/>
    <circle r="172" fill="none" stroke="#F6CF62" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>

    <text text-anchor="middle" y="-10" fill="#9DBFE0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4">THE NUMBER</text>
    <text text-anchor="middle" y="55" fill="#F6CF62" font-family="Georgia, Times New Roman, serif" font-size="120" font-weight="700">666</text>
    <text text-anchor="middle" y="90" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">REVELATION 13:18</text>
  </g>

  <g transform="translate(80,560)">
    <g>
      <rect width="380" height="170" rx="14" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="36" cy="38" r="20" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="36" y="46" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="22" font-weight="700">1</text>
      <text x="72" y="46" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Count Exact Spellings</text>
      <line x1="20" y1="78" x2="360" y2="78" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="22" y="108" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Transparent English baseline</text>
      <g transform="translate(22,124)" font-family="Georgia, serif" font-size="15" fill="#9EC3E8">
        <text>A=1  B=2  C=3  …  Z=26</text>
      </g>
      <text x="22" y="160" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">STEP 01 / BASELINE</text>
    </g>

    <g transform="translate(420,0)">
      <path d="M0 85 L 30 85" stroke="#F6CF62" stroke-width="2" stroke-opacity="0.6"/>
      <path d="M22 78 L 32 85 L 22 92" stroke="#F6CF62" stroke-width="2" stroke-opacity="0.6" fill="none"/>
    </g>

    <g transform="translate(460,0)">
      <rect width="380" height="170" rx="14" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="36" cy="38" r="20" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="36" y="46" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="22" font-weight="700">2</text>
      <text x="72" y="46" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Compare Digital Roots</text>
      <line x1="20" y1="78" x2="360" y2="78" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="22" y="108" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Compressed consistency layer</text>
      <g transform="translate(22,118)" font-family="Georgia, serif" font-size="15" fill="#9EC3E8">
        <text>666 → 6+6+6 = 18 → 9</text>
      </g>
      <text x="22" y="160" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">STEP 02 / COMPRESSION</text>
    </g>

    <g transform="translate(880,0)">
      <path d="M0 85 L 30 85" stroke="#F6CF62" stroke-width="2" stroke-opacity="0.6"/>
      <path d="M22 78 L 32 85 L 22 92" stroke="#F6CF62" stroke-width="2" stroke-opacity="0.6" fill="none"/>
    </g>

    <g transform="translate(920,0)">
      <rect width="380" height="170" rx="14" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="36" cy="38" r="20" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="36" y="46" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="22" font-weight="700">3</text>
      <text x="72" y="46" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Validate Root Families</text>
      <line x1="20" y1="78" x2="360" y2="78" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="22" y="108" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">Semantic control against bias</text>
      <g transform="translate(22,118)" font-family="Georgia, serif" font-size="15" fill="#9EC3E8">
        <text>rule · ruler · ruling · ruled</text>
      </g>
      <text x="22" y="160" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">STEP 03 / CONTEXT</text>
    </g>
  </g>

  <g transform="translate(80,810)">
    <circle cx="6" cy="14" r="4" fill="#F6CF62"/>
    <text x="22" y="20" fill="#BFDFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1">gematria.today/blog</text>
  </g>
  <text x="1520" y="830" text-anchor="end" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">A METHOD, NOT A GUESS</text>
</svg>
