<svg width="2100" height="900" viewBox="0 0 2100 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured blog slider image for Determining the Identity of the Beast - Rev. 13</title>
  <desc id="desc">Wide banner with a luminous 666 medallion, methodology ribbon, and a connected three-step flow: baseline, compression, and context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2100" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050F1F"/>
      <stop offset="0.5" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#1B5189"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1780 290) scale(560)">
      <stop stop-color="#F6CF62" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#E0992A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0A1B33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medallionFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1780 290) scale(160)">
      <stop stop-color="#1A3A60"/>
      <stop offset="0.7" stop-color="#0A1F38"/>
      <stop offset="1" stop-color="#050F1F"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="1640" y1="150" x2="1920" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBE499"/>
      <stop offset="0.5" stop-color="#F6CF62"/>
      <stop offset="1" stop-color="#B8841C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15355A" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0B223A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFDDFF"/>
    </linearGradient>
    <pattern id="numGrid" width="180" height="140" patternUnits="userSpaceOnUse">
      <text x="0" y="40" fill="#6EC1FF" fill-opacity="0.05" font-family="Georgia, serif" font-size="28">666</text>
      <text x="90" y="110" fill="#F6CF62" fill-opacity="0.04" font-family="Georgia, serif" font-size="22">13</text>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="2100" height="900" fill="url(#bg)"/>
  <rect width="2100" height="900" fill="url(#numGrid)"/>
  <rect width="2100" height="900" fill="url(#halo)"/>

  <g opacity="0.22" stroke="#7FC4FF" fill="none" stroke-width="1.2">
    <circle cx="1780" cy="290" r="240"/>
    <circle cx="1780" cy="290" r="310"/>
    <circle cx="1780" cy="290" r="380"/>
  </g>

  <g transform="translate(180,110)">
    <rect width="200" height="44" rx="22" fill="none" stroke="#6EC1FF" stroke-opacity="0.6"/>
    <circle cx="22" cy="22" r="5" fill="#F6CF62"/>
    <text x="40" y="29" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">FEATURED POST</text>
  </g>

  <text x="180" y="240" fill="url(#titleGrad)" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">Determining the Identity</text>
  <text x="180" y="318" fill="url(#titleGrad)" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">of the <tspan fill="#F6CF62">Beast</tspan></text>
  <text x="180" y="368" fill="#BFDDFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">Revelation 13 Counting Framework</text>

  <g transform="translate(180,400)">
    <rect width="1180" height="64" rx="12" fill="#0E2746" fill-opacity="0.92" stroke="#76C9FF" stroke-opacity="0.7"/>
    <text x="28" y="42" fill="#F6CF62" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2">ENGLISH GEMATRIA  •  DIGITAL ROOTS  •  BASE-ROOT WORDS</text>
  </g>

  <g transform="translate(180,520)">
    <g>
      <rect width="500" height="220" rx="16" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="44" cy="46" r="24" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="44" y="56" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="26" font-weight="700">1</text>
      <text x="86" y="58" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Baseline</text>
      <line x1="24" y1="92" x2="476" y2="92" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="26" y="128" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="22">Calculate exact English values</text>
      <text x="26" y="170" fill="#9EC3E8" font-family="Georgia, serif" font-size="20">A=1  B=2  C=3  …  Z=26</text>
      <text x="26" y="200" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">STEP 01</text>
    </g>

    <g transform="translate(540,110)">
      <path d="M0 0 L 40 0" stroke="#F6CF62" stroke-width="2.5" stroke-opacity="0.6"/>
      <path d="M30 -8 L 42 0 L 30 8" stroke="#F6CF62" stroke-width="2.5" stroke-opacity="0.6" fill="none"/>
    </g>

    <g transform="translate(600,0)">
      <rect width="500" height="220" rx="16" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="44" cy="46" r="24" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="44" y="56" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="26" font-weight="700">2</text>
      <text x="86" y="58" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Compression</text>
      <line x1="24" y1="92" x2="476" y2="92" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="26" y="128" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="22">Check repeating digital roots</text>
      <text x="26" y="170" fill="#9EC3E8" font-family="Georgia, serif" font-size="20">666 → 6+6+6 = 18 → 9</text>
      <text x="26" y="200" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">STEP 02</text>
    </g>

    <g transform="translate(1140,110)">
      <path d="M0 0 L 40 0" stroke="#F6CF62" stroke-width="2.5" stroke-opacity="0.6"/>
      <path d="M30 -8 L 42 0 L 30 8" stroke="#F6CF62" stroke-width="2.5" stroke-opacity="0.6" fill="none"/>
    </g>

    <g transform="translate(1200,0)">
      <rect width="560" height="220" rx="16" fill="url(#cardGrad)" stroke="#6EC1FF" stroke-opacity="0.55"/>
      <circle cx="44" cy="46" r="24" fill="#F6CF62" fill-opacity="0.15" stroke="#F6CF62" stroke-width="1.5"/>
      <text x="44" y="56" text-anchor="middle" fill="#F6CF62" font-family="Georgia, serif" font-size="26" font-weight="700">3</text>
      <text x="86" y="58" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Context</text>
      <line x1="24" y1="92" x2="536" y2="92" stroke="#6EC1FF" stroke-opacity="0.25"/>
      <text x="26" y="128" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="22">Validate base-root word families</text>
      <text x="26" y="170" fill="#9EC3E8" font-family="Georgia, serif" font-size="20">rule · ruler · ruling · ruled</text>
      <text x="26" y="200" fill="#7FA9D2" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="3">STEP 03</text>
    </g>
  </g>

  <g transform="translate(1780,290)">
    <g filter="url(#softGlow)">
      <circle r="190" fill="#F6CF62" fill-opacity="0.08"/>
    </g>
    <circle r="170" fill="url(#medallionFill)" stroke="url(#goldRim)" stroke-width="3"/>
    <circle r="154" fill="none" stroke="#F6CF62" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>
    <text text-anchor="middle" y="-18" fill="#9DBFE0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4">THE NUMBER</text>
    <text text-anchor="middle" y="42" fill="#F6CF62" font-family="Georgia, Times New Roman, serif" font-size="108" font-weight="700">666</text>
    <text text-anchor="middle" y="78" fill="#CDE6FF" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="3">REVELATION 13:18</text>
  </g>
</svg>
