<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Comparing Four Main Views of Eschatology hero artwork</title>
  <desc id="desc">A visual comparison chart for Premillennialism, Historic Premillennialism, Amillennialism, and Postmillennialism with glowing timeline markers and summary descriptors.</desc>
  <defs>
    <linearGradient id="bg" x1="100" y1="40" x2="1500" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1329"/>
      <stop offset="0.55" stop-color="#1E2E58"/>
      <stop offset="1" stop-color="#334B7A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 170) rotate(134) scale(560 380)">
      <stop stop-color="#C7A95A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C7A95A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g opacity="0.22" stroke="#9FC1FF" stroke-width="2">
    <path d="M90 680H1510"/>
    <path d="M90 620H1510"/>
    <path d="M90 560H1510"/>
  </g>

  <text x="110" y="160" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Eschatology at a Glance</text>
  <text x="110" y="232" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">Comparing Four Main Views</text>

  <rect x="110" y="348" width="1360" height="92" rx="14" fill="#101D39" fill-opacity="0.74" stroke="#7CA8FF"/>
  <text x="150" y="404" fill="#F6D58E" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Track timeline assumptions, kingdom expectations, and interpretation method</text>

  <g font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#EEF4FF">
    <rect x="110" y="500" width="315" height="190" rx="14" fill="#122248" fill-opacity="0.8" stroke="#7CA8FF"/>
    <text x="128" y="552">Premillennialism</text>
    <text x="138" y="592" fill="#C4D9FF" font-size="23" font-weight="500">Christ returns before</text>
    <text x="138" y="624" fill="#C4D9FF" font-size="23" font-weight="500">the millennium</text>

    <rect x="445" y="500" width="315" height="190" rx="14" fill="#122248" fill-opacity="0.8" stroke="#7CA8FF"/>
    <text x="463" y="552">Historic Premill.</text>
    <text x="473" y="592" fill="#C4D9FF" font-size="23" font-weight="500">Church endures tribulation</text>
    <text x="473" y="624" fill="#C4D9FF" font-size="23" font-weight="500">before Christ's return</text>

    <rect x="780" y="500" width="315" height="190" rx="14" fill="#122248" fill-opacity="0.8" stroke="#7CA8FF"/>
    <text x="798" y="552">Amillennialism</text>
    <text x="808" y="592" fill="#C4D9FF" font-size="23" font-weight="500">Millennium fulfilled now</text>
    <text x="808" y="624" fill="#C4D9FF" font-size="23" font-weight="500">in Christ's reign</text>

    <rect x="1115" y="500" width="355" height="190" rx="14" fill="#122248" fill-opacity="0.8" stroke="#7CA8FF"/>
    <text x="1128" y="552">Postmillennialism</text>
    <text x="1143" y="592" fill="#C4D9FF" font-size="23" font-weight="500">Gospel success precedes</text>
    <text x="1143" y="624" fill="#C4D9FF" font-size="23" font-weight="500">Christ's return</text>
  </g>

  <text x="110" y="792" fill="#BFD5FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">endtimes.today/blog</text>
</svg>
