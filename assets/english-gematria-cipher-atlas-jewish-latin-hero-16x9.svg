<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="caJlTitle caJlDesc">
  <title id="caJlTitle">Cipher Atlas — Jewish / Latin Cipher hero</title>
  <desc id="caJlDesc">A three-band table showing the Agrippan structure of ones, tens, and hundreds mapped onto A-I, J-R, and S-Z respectively.</desc>
  <defs>
    <linearGradient id="caJlBg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B22"/>
      <stop offset="0.55" stop-color="#101742"/>
      <stop offset="1" stop-color="#1B0E45"/>
    </linearGradient>
    <radialGradient id="caJlGlow" cx="800" cy="500" r="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caJlCell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#243067"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>
    <linearGradient id="caJlBand1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="caJlDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7AB8FF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#caJlBg)"/>
  <rect width="1600" height="900" fill="url(#caJlDots)"/>
  <rect width="1600" height="900" fill="url(#caJlGlow)"/>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="582" y="58" width="436" height="38" rx="19" fill="#FBBF24" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="800" y="84" font-size="18" font-weight="700" fill="#FBBF24" letter-spacing="3">CIPHER ATLAS · POST 6 OF 8</text>
    <text x="800" y="158" font-size="58" font-weight="800" fill="#F4F8FF">Jewish / Latin Cipher</text>
    <text x="800" y="200" font-size="22" font-weight="500" fill="#9CC8FF">A–I: 1–9 · J–R: 10–90 · S–Z: 100–800 — the Agrippan ladder</text>
  </g>

  <g font-family="'JetBrains Mono', 'Menlo', monospace" text-anchor="middle">
    <!-- Band 1: ones (A-I) -->
    <g transform="translate(248,290)">
      <rect x="-20" y="-20" width="1144" height="120" rx="14" fill="url(#caJlBand1)" stroke="#FBBF24" stroke-opacity="0.45"/>
      <text x="-80" y="55" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">ones</text>
      <g><rect x="0" y="0" width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">A</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">1</text></g>
      <g transform="translate(112,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">B</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">2</text></g>
      <g transform="translate(224,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">C</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">3</text></g>
      <g transform="translate(336,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">D</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">4</text></g>
      <g transform="translate(448,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">E</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">5</text></g>
      <g transform="translate(560,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">F</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">6</text></g>
      <g transform="translate(672,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">G</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">7</text></g>
      <g transform="translate(784,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">H</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">8</text></g>
      <g transform="translate(896,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">I</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">9</text></g>
    </g>
    <!-- Band 2: tens (J-R) -->
    <g transform="translate(248,440)">
      <rect x="-20" y="-20" width="1144" height="120" rx="14" fill="url(#caJlBand1)" stroke="#FBBF24" stroke-opacity="0.55"/>
      <text x="-80" y="55" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">tens</text>
      <g><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">J</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">10</text></g>
      <g transform="translate(112,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">K</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">20</text></g>
      <g transform="translate(224,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">L</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">30</text></g>
      <g transform="translate(336,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">M</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">40</text></g>
      <g transform="translate(448,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">N</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">50</text></g>
      <g transform="translate(560,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">O</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">60</text></g>
      <g transform="translate(672,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">P</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">70</text></g>
      <g transform="translate(784,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">Q</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">80</text></g>
      <g transform="translate(896,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">R</text><text x="50" y="66" font-size="22" font-weight="800" fill="#FBBF24">90</text></g>
    </g>
    <!-- Band 3: hundreds (S-Z) -->
    <g transform="translate(304,590)">
      <rect x="-20" y="-20" width="1032" height="120" rx="14" fill="url(#caJlBand1)" stroke="#FBBF24" stroke-opacity="0.65"/>
      <text x="-80" y="55" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="end">hundreds</text>
      <g><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">S</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">100</text></g>
      <g transform="translate(112,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">T</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">200</text></g>
      <g transform="translate(224,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">U</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">300</text></g>
      <g transform="translate(336,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">V</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">400</text></g>
      <g transform="translate(448,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">W</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">500</text></g>
      <g transform="translate(560,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">X</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">600</text></g>
      <g transform="translate(672,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">Y</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">700</text></g>
      <g transform="translate(784,0)"><rect width="100" height="80" rx="8" fill="url(#caJlCell)"/><text x="50" y="34" font-size="22" font-weight="700" fill="#E6F2FF">Z</text><text x="50" y="66" font-size="20" font-weight="800" fill="#FBBF24">800</text></g>
    </g>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="780" font-size="22" fill="#F4F8FF" font-weight="600">ENGLISH = 5 + 50 + 7 + 30 + 9 + 100 + 8 = 209</text>
    <text x="800" y="852" font-size="20" fill="#9CC8FF" fill-opacity="0.9">The Hebrew-style ladder ported onto English — a reconstruction, not a transmission.</text>
  </g>
</svg>
