<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="caRfrTitle caRfrDesc">
  <title id="caRfrTitle">Cipher Atlas — Reverse Full Reduction hero</title>
  <desc id="caRfrDesc">A mirrored Pythagorean reduction running from Z=1 back to A=8, showing how reverse ordinal values reduce into the 1 to 9 buckets.</desc>
  <defs>
    <linearGradient id="caRfrBg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B22"/>
      <stop offset="0.55" stop-color="#101742"/>
      <stop offset="1" stop-color="#1B0E45"/>
    </linearGradient>
    <radialGradient id="caRfrGlow" cx="800" cy="500" r="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caRfrCell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#243067"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>
    <linearGradient id="caRfrHot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="caRfrDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7AB8FF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#caRfrBg)"/>
  <rect width="1600" height="900" fill="url(#caRfrDots)"/>
  <rect width="1600" height="900" fill="url(#caRfrGlow)"/>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="582" y="58" width="436" height="38" rx="19" fill="#34D399" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="800" y="84" font-size="18" font-weight="700" fill="#6EE7B7" letter-spacing="3">CIPHER ATLAS · POST 4 OF 8</text>
    <text x="800" y="158" font-size="58" font-weight="800" fill="#F4F8FF">Reverse Full Reduction</text>
    <text x="800" y="200" font-size="22" font-weight="500" fill="#9CC8FF">Reduce the reverse ordinal — the fourth corner of the base-four matrix</text>
  </g>

  <!-- 2x2 matrix conceptual diagram -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(360,280)">
      <rect x="0" y="0" width="880" height="440" rx="18" fill="#0B1230" stroke="#243067" stroke-width="1.5"/>
      <line x1="440" y1="40" x2="440" y2="400" stroke="#243067" stroke-width="1.5"/>
      <line x1="40" y1="220" x2="840" y2="220" stroke="#243067" stroke-width="1.5"/>

      <text x="220" y="80" font-size="18" font-weight="700" fill="#9CC8FF" letter-spacing="2">FORWARD</text>
      <text x="660" y="80" font-size="18" font-weight="700" fill="#9CC8FF" letter-spacing="2">REVERSE</text>

      <g transform="translate(220,150)">
        <text x="0" y="0" font-size="26" font-weight="700" fill="#F4F8FF">Simple Ordinal</text>
        <text x="0" y="34" font-size="18" fill="#9CC8FF">A = 1 … Z = 26</text>
      </g>
      <g transform="translate(660,150)">
        <text x="0" y="0" font-size="26" font-weight="700" fill="#F4F8FF">Reverse Ordinal</text>
        <text x="0" y="34" font-size="18" fill="#9CC8FF">A = 26 … Z = 1</text>
      </g>
      <g transform="translate(220,290)">
        <text x="0" y="0" font-size="26" font-weight="700" fill="#F4F8FF">Full Reduction</text>
        <text x="0" y="34" font-size="18" fill="#9CC8FF">A = 1 … I = 9 (wrap)</text>
      </g>
      <g transform="translate(660,290)">
        <text x="0" y="0" font-size="26" font-weight="700" fill="#6EE7B7">Reverse Reduction</text>
        <text x="0" y="34" font-size="18" fill="#6EE7B7">A = 8 … Z = 1 (wrap)</text>
        <rect x="-150" y="-40" width="300" height="90" rx="10" fill="none" stroke="url(#caRfrHot)" stroke-width="2.5"/>
      </g>
      <text x="440" y="430" font-size="14" fill="#9CC8FF" fill-opacity="0.8">Direction × Compression — the base-four matrix</text>
    </g>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="780" font-size="22" fill="#F4F8FF" font-weight="600">ENGLISH = 4 + 4 + 2 + 6 + 9 + 8 + 1 = 34</text>
    <text x="800" y="852" font-size="20" fill="#9CC8FF" fill-opacity="0.9">The completing view — a four-cipher base requires both directions and both compressions.</text>
  </g>
</svg>
