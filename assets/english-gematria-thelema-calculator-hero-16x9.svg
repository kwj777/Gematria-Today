<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thTitle thDesc">
  <title id="thTitle">Thelema and the Calculator Era — English Qaballa to modern ciphers</title>
  <desc id="thDesc">A reordered ALW-style English alphabet on the left and a side-by-side cipher comparison panel on the right showing how ENGLISH totals differently across ordinal, reduction, Chaldean, and Sumerian.</desc>

  <defs>
    <linearGradient id="thBg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B22"/>
      <stop offset="0.55" stop-color="#101742"/>
      <stop offset="1" stop-color="#1B0E45"/>
    </linearGradient>
    <radialGradient id="thGlow" cx="800" cy="540" r="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#F97316" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1A2452"/>
      <stop offset="1" stop-color="#0A1130"/>
    </linearGradient>
    <linearGradient id="thHot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="thDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7AB8FF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#thBg)"/>
  <rect width="1600" height="900" fill="url(#thDots)"/>
  <rect width="1600" height="900" fill="url(#thGlow)"/>

  <!-- Header -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="620" y="58" width="360" height="38" rx="19" fill="#F97316" fill-opacity="0.18" stroke="#F97316" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="800" y="84" font-size="18" font-weight="700" fill="#FFB779" letter-spacing="3">SERIES · POST 5 OF 6</text>
    <text x="800" y="158" font-size="54" font-weight="800" fill="#F4F8FF">Thelema &amp; the Calculator Era</text>
    <text x="800" y="200" font-size="22" font-weight="500" fill="#9CC8FF">Permuted alphabets and modular cipher menus</text>
  </g>

  <!-- Left panel: ALW permuted alphabet -->
  <g>
    <rect x="100" y="260" width="640" height="560" rx="22" fill="url(#thPanel)" stroke="#7ED9FF" stroke-opacity="0.35" stroke-width="1.4"/>
    <g font-family="'Inter', 'Segoe UI', sans-serif">
      <text x="130" y="302" font-size="16" font-weight="700" fill="#FBBF24" letter-spacing="3">ENGLISH QABALLA · ALW (THE NEW EQUINOX, 1979)</text>
      <text x="130" y="338" font-size="22" font-weight="700" fill="#E6F2FF">The sequence assumption breaks</text>
    </g>

    <!-- Two rows comparing A-Z order vs. ALW order -->
    <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="middle">
      <text x="420" y="392" font-size="16" font-weight="700" fill="#9BE0FF" letter-spacing="3">ORDINARY A → Z</text>
      <g>
        <!-- 13 cells row 1 -->
        <g transform="translate(120 412)">
          <g><rect x="0" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="19" y="26" font-size="18" font-weight="700" fill="#E6F2FF">A</text></g>
          <g><rect x="46" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="65" y="26" font-size="18" font-weight="700" fill="#E6F2FF">B</text></g>
          <g><rect x="92" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="111" y="26" font-size="18" font-weight="700" fill="#E6F2FF">C</text></g>
          <g><rect x="138" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="157" y="26" font-size="18" font-weight="700" fill="#E6F2FF">D</text></g>
          <g><rect x="184" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="203" y="26" font-size="18" font-weight="700" fill="#E6F2FF">E</text></g>
          <g><rect x="230" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="249" y="26" font-size="18" font-weight="700" fill="#E6F2FF">F</text></g>
          <g><rect x="276" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="295" y="26" font-size="18" font-weight="700" fill="#E6F2FF">G</text></g>
          <g><rect x="322" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="341" y="26" font-size="18" font-weight="700" fill="#E6F2FF">H</text></g>
          <g><rect x="368" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="387" y="26" font-size="18" font-weight="700" fill="#E6F2FF">I</text></g>
          <g><rect x="414" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="433" y="26" font-size="18" font-weight="700" fill="#E6F2FF">J</text></g>
          <g><rect x="460" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="479" y="26" font-size="18" font-weight="700" fill="#E6F2FF">K</text></g>
          <g><rect x="506" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="525" y="26" font-size="18" font-weight="700" fill="#E6F2FF">L</text></g>
          <g><rect x="552" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="571" y="26" font-size="18" font-weight="700" fill="#E6F2FF">…</text></g>
        </g>
      </g>

      <!-- Numeric row beneath ordinary -->
      <g transform="translate(120 458)" font-family="'JetBrains Mono', 'Consolas', monospace">
        <text x="19" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">1</text>
        <text x="65" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">2</text>
        <text x="111" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">3</text>
        <text x="157" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">4</text>
        <text x="203" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">5</text>
        <text x="249" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">6</text>
        <text x="295" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">7</text>
        <text x="341" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">8</text>
        <text x="387" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">9</text>
        <text x="433" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">10</text>
        <text x="479" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">11</text>
        <text x="525" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">12</text>
        <text x="571" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">…</text>
      </g>

      <!-- ALW permutation -->
      <text x="420" y="556" font-size="16" font-weight="700" fill="#FBBF24" letter-spacing="3">ALW PERMUTATION</text>
      <g transform="translate(120 576)">
        <g><rect x="0" y="0" width="38" height="38" rx="6" fill="url(#thHot)"/><text x="19" y="26" font-size="18" font-weight="700" fill="#1B0E45">A</text></g>
        <g><rect x="46" y="0" width="38" height="38" rx="6" fill="url(#thHot)"/><text x="65" y="26" font-size="18" font-weight="700" fill="#1B0E45">L</text></g>
        <g><rect x="92" y="0" width="38" height="38" rx="6" fill="url(#thHot)"/><text x="111" y="26" font-size="18" font-weight="700" fill="#1B0E45">W</text></g>
        <g><rect x="138" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="157" y="26" font-size="18" font-weight="700" fill="#E6F2FF">H</text></g>
        <g><rect x="184" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="203" y="26" font-size="18" font-weight="700" fill="#E6F2FF">S</text></g>
        <g><rect x="230" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="249" y="26" font-size="18" font-weight="700" fill="#E6F2FF">D</text></g>
        <g><rect x="276" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="295" y="26" font-size="18" font-weight="700" fill="#E6F2FF">O</text></g>
        <g><rect x="322" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="341" y="26" font-size="18" font-weight="700" fill="#E6F2FF">Z</text></g>
        <g><rect x="368" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="387" y="26" font-size="18" font-weight="700" fill="#E6F2FF">K</text></g>
        <g><rect x="414" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="433" y="26" font-size="18" font-weight="700" fill="#E6F2FF">V</text></g>
        <g><rect x="460" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="479" y="26" font-size="18" font-weight="700" fill="#E6F2FF">G</text></g>
        <g><rect x="506" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="525" y="26" font-size="18" font-weight="700" fill="#E6F2FF">R</text></g>
        <g><rect x="552" y="0" width="38" height="38" rx="6" fill="#243067" stroke="#7ED9FF" stroke-opacity="0.45"/><text x="571" y="26" font-size="18" font-weight="700" fill="#E6F2FF">…</text></g>
      </g>
      <g transform="translate(120 622)" font-family="'JetBrains Mono', 'Consolas', monospace">
        <text x="19" y="14" font-size="13" fill="#FBBF24" text-anchor="middle">1</text>
        <text x="65" y="14" font-size="13" fill="#FBBF24" text-anchor="middle">2</text>
        <text x="111" y="14" font-size="13" fill="#FBBF24" text-anchor="middle">3</text>
        <text x="157" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">4</text>
        <text x="203" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">5</text>
        <text x="249" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">6</text>
        <text x="295" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">7</text>
        <text x="341" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">8</text>
        <text x="387" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">9</text>
        <text x="433" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">10</text>
        <text x="479" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">11</text>
        <text x="525" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">12</text>
        <text x="571" y="14" font-size="13" fill="#9BE0FF" text-anchor="middle">…</text>
      </g>
    </g>

    <g font-family="'Inter', 'Segoe UI', sans-serif">
      <text x="130" y="710" font-size="16" fill="#9BE0FF">Sequence is no longer authoritative. The order comes</text>
      <text x="130" y="734" font-size="16" fill="#9BE0FF">from a text (Liber AL) and an act of reception.</text>
    </g>
  </g>

  <!-- Right panel: cipher comparison -->
  <g>
    <rect x="860" y="260" width="640" height="560" rx="22" fill="url(#thPanel)" stroke="#7ED9FF" stroke-opacity="0.35" stroke-width="1.4"/>
    <g font-family="'Inter', 'Segoe UI', sans-serif">
      <text x="890" y="302" font-size="16" font-weight="700" fill="#FBBF24" letter-spacing="3">CALCULATOR ERA · ONE PHRASE, MANY CIPHERS</text>
      <text x="890" y="338" font-size="22" font-weight="700" fill="#E6F2FF">ENGLISH — how the totals diverge</text>
    </g>

    <!-- Rows -->
    <g font-family="'JetBrains Mono', 'Consolas', monospace">
      <g>
        <text x="890" y="404" font-size="20" fill="#9BE0FF" font-family="'Inter', 'Segoe UI', sans-serif">English ordinal</text>
        <text x="1470" y="404" font-size="32" font-weight="700" fill="#F4F8FF" text-anchor="end">74</text>
        <line x1="890" y1="420" x2="1470" y2="420" stroke="#7ED9FF" stroke-opacity="0.2"/>
      </g>
      <g>
        <text x="890" y="468" font-size="20" fill="#9BE0FF" font-family="'Inter', 'Segoe UI', sans-serif">Full reduction</text>
        <text x="1470" y="468" font-size="32" font-weight="700" fill="#F4F8FF" text-anchor="end">38</text>
        <line x1="890" y1="484" x2="1470" y2="484" stroke="#7ED9FF" stroke-opacity="0.2"/>
      </g>
      <g>
        <text x="890" y="532" font-size="20" fill="#9BE0FF" font-family="'Inter', 'Segoe UI', sans-serif">Cheiro-style Chaldean</text>
        <text x="1470" y="532" font-size="32" font-weight="700" fill="#F4F8FF" text-anchor="end">25</text>
        <line x1="890" y1="548" x2="1470" y2="548" stroke="#7ED9FF" stroke-opacity="0.2"/>
      </g>
      <g>
        <text x="890" y="596" font-size="20" fill="#FBBF24" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700">English Sumerian</text>
        <text x="1470" y="596" font-size="40" font-weight="700" fill="#FBBF24" text-anchor="end">444</text>
      </g>
      <g>
        <text x="890" y="624" font-size="14" fill="#9BE0FF" font-style="italic" font-family="'Inter', 'Segoe UI', sans-serif">(ordinal × 6 — a calculator-era brand)</text>
      </g>
    </g>

    <!-- JESUS comparison -->
    <g>
      <line x1="890" y1="664" x2="1470" y2="664" stroke="#7ED9FF" stroke-opacity="0.3" stroke-width="1"/>
      <g font-family="'Inter', 'Segoe UI', sans-serif">
        <text x="890" y="696" font-size="16" font-weight="700" fill="#FBBF24" letter-spacing="2">JESUS — AND THE OLDER GREEK ROUTE</text>
        <text x="890" y="730" font-size="18" fill="#9BE0FF">Ordinal 74 · Reduction 11 · Chaldean 18 · Sumerian 444</text>
        <text x="890" y="762" font-size="22" font-weight="700" fill="#F4F8FF">Greek isopsephy: Ιησους = 888</text>
        <text x="890" y="788" font-size="15" fill="#9BE0FF" font-style="italic">English gematria often rides on older sacred-language practices.</text>
      </g>
    </g>
  </g>

  <!-- Footer caption -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="868" font-size="20" fill="#9CC8FF" fill-opacity="0.9">From books and lodges to calculators and online communities.</text>
  </g>
</svg>
