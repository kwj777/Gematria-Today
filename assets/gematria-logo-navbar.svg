<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 84" role="img" aria-labelledby="title desc">
  <title id="title">Gematria.Today logo</title>
  <desc id="desc">A radiant celestial seal beside the Gematria.Today wordmark.</desc>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="55%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="todayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Celestial emblem -->
  <g transform="translate(8,8)">
    <!-- 8-point sunburst rays -->
    <g stroke="url(#ringGrad)" stroke-linecap="round" fill="none">
      <line x1="34" y1="1" x2="34" y2="9" stroke-width="2.4"/>
      <line x1="34" y1="59" x2="34" y2="67" stroke-width="2.4"/>
      <line x1="1" y1="34" x2="9" y2="34" stroke-width="2.4"/>
      <line x1="59" y1="34" x2="67" y2="34" stroke-width="2.4"/>
      <line x1="11.5" y1="11.5" x2="16.5" y2="16.5" stroke-width="1.8" opacity="0.75"/>
      <line x1="51.5" y1="51.5" x2="56.5" y2="56.5" stroke-width="1.8" opacity="0.75"/>
      <line x1="56.5" y1="11.5" x2="51.5" y2="16.5" stroke-width="1.8" opacity="0.75"/>
      <line x1="11.5" y1="56.5" x2="16.5" y2="51.5" stroke-width="1.8" opacity="0.75"/>
    </g>

    <!-- Outer faint ring -->
    <circle cx="34" cy="34" r="26" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.45"/>

    <!-- Main ring -->
    <circle cx="34" cy="34" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>

    <!-- Radiant inner orb -->
    <circle cx="34" cy="34" r="15" fill="url(#coreGrad)" filter="url(#softGlow)"/>

    <!-- Subtle inscribed cross -->
    <g stroke="#7c2d12" stroke-linecap="round" opacity="0.55">
      <line x1="34" y1="25" x2="34" y2="43" stroke-width="1.6"/>
      <line x1="25" y1="34" x2="43" y2="34" stroke-width="1.6"/>
    </g>

    <!-- Highlight glint on the orb -->
    <circle cx="30" cy="29" r="3" fill="#fff7d6" opacity="0.8"/>

    <!-- Field stars -->
    <circle cx="63" cy="9" r="1.3" fill="#fff7d6"/>
    <circle cx="5" cy="58" r="1.3" fill="#fff7d6"/>
    <circle cx="65" cy="56" r="0.9" fill="#fde68a" opacity="0.85"/>
    <circle cx="3" cy="14" r="0.9" fill="#fde68a" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="86" y="40" font-family="'Inter','Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="url(#wordGrad)">Gematria</text>
  <text x="220" y="40" font-family="'Inter','Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="url(#todayGrad)">.Today</text>

  <!-- Gilt separator -->
  <line x1="86" y1="51" x2="316" y2="51" stroke="url(#ruleGrad)" stroke-width="0.75"/>

  <!-- Tagline -->
  <text x="86" y="65" font-family="'Inter','Segoe UI',Roboto,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#94a3b8">RESEARCH &#183; CALCULATE &#183; DISCOVER</text>
</svg>
