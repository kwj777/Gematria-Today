<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Origen to Augustine — Why the West Moved Away from Chiliasm</title>
  <desc id="desc">A theological timeline hero image highlighting the 4th–5th century move from chiliasm to amillennial thought in the Western church.</desc>
  <defs>
    <linearGradient id="bg" x1="180" y1="90" x2="1420" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220" />
      <stop offset="0.55" stop-color="#1f2a44" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 445) rotate(90) scale(380 620)">
      <stop stop-color="#fcd34d" stop-opacity="0.28" />
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="220" y1="0" x2="1380" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" />
      <stop offset="1" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#halo)" />
  <g opacity="0.18" stroke="#93c5fd" stroke-width="1.25">
    <path d="M0 170H1600" />
    <path d="M0 290H1600" />
    <path d="M0 410H1600" />
    <path d="M0 530H1600" />
    <path d="M0 650H1600" />
    <path d="M0 770H1600" />
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="110" width="1360" height="680" rx="28" fill="#0f172a" fill-opacity="0.58" stroke="#f8fafc" stroke-opacity="0.22" />
  </g>

  <text x="178" y="210" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700">Origen to Augustine</text>
  <text x="178" y="276" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="600">Why the West Moved Away from Chiliasm (4th–5th Centuries)</text>

  <line x1="220" y1="500" x2="1380" y2="500" stroke="url(#line)" stroke-width="8" stroke-linecap="round" />

  <g>
    <circle cx="355" cy="500" r="24" fill="#f59e0b" />
    <circle cx="355" cy="500" r="44" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="4" />
    <text x="280" y="560" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Origen</text>
    <text x="230" y="602" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">3rd century trajectory</text>
  </g>

  <g>
    <circle cx="820" cy="500" r="24" fill="#fcd34d" />
    <circle cx="820" cy="500" r="44" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="4" />
    <text x="708" y="560" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">4th century shift</text>
    <text x="692" y="602" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">Allegorical readings rise</text>
  </g>

  <g>
    <circle cx="1245" cy="500" r="24" fill="#fde68a" />
    <circle cx="1245" cy="500" r="44" stroke="#fde68a" stroke-opacity="0.35" stroke-width="4" />
    <text x="1136" y="560" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Augustine</text>
    <text x="1046" y="602" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">5th century consolidation</text>
  </g>

  <rect x="178" y="666" width="1244" height="78" rx="14" fill="#111827" fill-opacity="0.72" stroke="#f8fafc" stroke-opacity="0.2" />
  <text x="214" y="716" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="31">From a literal millennium expectation to a spiritualized kingdom framework in the Latin West.</text>
</svg>
