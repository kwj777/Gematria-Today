<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Gematria (Base-6)</title>
    <style>
      body {
        font-family: Helvetica, Arial, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      form {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }

      input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>English Gematria Calculator (Base-6)</h1>

    <form id="gematria-form">
      <label for="word-input">Enter a word:</label>
      <input id="word-input" name="word" type="text" required />
      <button type="submit">Calculate</button>
    </form>

    <p id="gematria-result"></p>

    <script>
      const form = document.querySelector('#gematria-form');
      const wordInput = document.querySelector('#word-input');
      const result = document.querySelector('#gematria-result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const word = wordInput.value.trim();

        if (!word) {
          result.textContent = 'Please enter a word.';
          return;
        }

        result.textContent = 'Searching...';

        try {
          const response = await fetch(`https://endtimes.today/.netlify/functions/englishGematria?word=${encodeURIComponent(word)}`);
          const payload = await response.json();

          if (!response.ok) {
            result.textContent = payload.error || 'Unable to calculate gematria.';
            return;
          }

          result.textContent = `Base-6 English Gematria for "${payload.word}": ${payload.gematria.total} (Digital Root: ${payload.gematria.digitalRoot}) | Searches: ${payload.searchCount}`;
        } catch (error) {
          result.textContent = 'Network error while calculating gematria.';
        }
      });
    </script>
  </body>
</html>
