<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Gematria (Base-6)</title>
    <style>
      body {
        font-family: Helvetica, Arial, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
        line-height: 1.5;
      }

      h2 {
        margin-top: 2rem;
      }

      form {
        display: grid;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      .field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .field {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.35rem;
        min-width: 200px;
      }

      input,
      button {
        font: inherit;
        padding: 0.55rem 0.7rem;
      }

      button {
        width: fit-content;
        cursor: pointer;
      }

      .panel {
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 1rem;
        margin-top: 1.25rem;
        background: #fafbfc;
      }

      .status {
        min-height: 1.5rem;
        margin: 0.5rem 0 0;
      }

      .muted {
        color: #57606a;
      }

      ul {
        padding-left: 1.25rem;
      }

      .result-meta {
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>English Gematria Calculator (Base-6)</h1>

    <section class="panel">
      <h2>Gematria Lookup</h2>
      <form id="gematria-form">
        <div class="field-row">
          <label class="field" for="word-input">
            <span>Enter a word</span>
            <input id="word-input" name="word" type="text" pattern="[A-Za-z]+" required />
          </label>
        </div>
        <button type="submit">Calculate</button>
      </form>

      <p id="gematria-result" class="status"></p>
    </section>

    <section class="panel">
      <h2>Related Words</h2>
      <form id="related-words-form">
        <div class="field-row">
          <label class="field" for="related-word-input">
            <span>Enter a word or phrase</span>
            <input id="related-word-input" name="phrase" type="text" required />
          </label>

          <label class="field" for="related-limit-input">
            <span>Synonym limit</span>
            <input id="related-limit-input" name="limit" type="number" min="1" step="1" value="10" required />
          </label>
        </div>
        <button type="submit">Find Related Words</button>
      </form>

      <p id="related-words-status" class="status muted"></p>
      <div id="related-words-result"></div>
    </section>

    <script>
      const gematriaForm = document.querySelector('#gematria-form');
      const gematriaWordInput = document.querySelector('#word-input');
      const gematriaResult = document.querySelector('#gematria-result');
      const relatedWordsForm = document.querySelector('#related-words-form');
      const relatedWordInput = document.querySelector('#related-word-input');
      const relatedLimitInput = document.querySelector('#related-limit-input');
      const relatedWordsStatus = document.querySelector('#related-words-status');
      const relatedWordsResult = document.querySelector('#related-words-result');
      const lettersOnlyRegex = /^[A-Za-z]+$/;

      gematriaWordInput.addEventListener('input', () => {
        gematriaWordInput.value = gematriaWordInput.value.replace(/[^A-Za-z]/g, '');
      });

      async function requestJson(endpoint, searchParams) {
        const response = await fetch(`${endpoint}?${searchParams.toString()}`);
        const rawBody = await response.text();

        let payload = null;
        try {
          payload = JSON.parse(rawBody);
        } catch {
          payload = { error: rawBody || 'Non-JSON response from server.' };
        }

        if (!response.ok) {
          const message = payload.error || payload.message || payload.errorMessage || `HTTP ${response.status}`;
          throw new Error(message);
        }

        return payload;
      }

      async function requestGematria(word) {
        const searchParams = new URLSearchParams({ word });
        return requestJson('/.netlify/functions/englishGematria', searchParams);
      }

      async function requestRelatedWords(term, limit) {
        const searchParams = new URLSearchParams({ word: term, limit: String(limit) });
        return requestJson('/.netlify/functions/wordnikRelatedWords', searchParams);
      }

      function renderRelatedWords(payload) {
        const relationships = Array.isArray(payload.data) ? payload.data : [];

        if (relationships.length === 0) {
          relatedWordsResult.innerHTML = '<p>No related words were returned.</p>';
          return;
        }

        const sections = relationships
          .map((relationship) => {
            const words = Array.isArray(relationship.words) ? relationship.words : [];
            const items = words.map((word) => `<li>${word}</li>`).join('');

            return `
              <section>
                <h3>${relationship.relationshipType || 'Related words'}</h3>
                ${items ? `<ul>${items}</ul>` : '<p>No words returned for this relationship.</p>'}
              </section>
            `;
          })
          .join('');

        relatedWordsResult.innerHTML = `
          <div class="result-meta">
            <strong>Results for:</strong> ${payload.query}<br />
            <strong>Limit used:</strong> ${payload.limit}
          </div>
          ${sections}
        `;
      }

      gematriaForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const word = gematriaWordInput.value.trim();

        if (!word) {
          gematriaResult.textContent = 'Please enter a word.';
          return;
        }

        if (!lettersOnlyRegex.test(word)) {
          gematriaResult.textContent = 'Please enter letters only.';
          return;
        }

        gematriaResult.textContent = 'Searching...';

        try {
          const payload = await requestGematria(word);
          gematriaResult.textContent = `Base-6 English Gematria for "${payload.word}": ${payload.gematria.total} (Digital Root: ${payload.gematria.digitalRoot}) | Base Root: ${payload.isBaseRoot} | Searches: ${payload.searchCount}`;
        } catch (error) {
          gematriaResult.textContent = error.message || 'Unable to calculate gematria.';
        }
      });

      relatedWordsForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const term = relatedWordInput.value.trim();
        const limit = relatedLimitInput.value.trim();

        if (!term) {
          relatedWordsStatus.textContent = 'Please enter a word or phrase.';
          relatedWordsResult.innerHTML = '';
          return;
        }

        if (!limit || Number(limit) <= 0 || !Number.isInteger(Number(limit))) {
          relatedWordsStatus.textContent = 'Please enter a positive whole number for the limit.';
          relatedWordsResult.innerHTML = '';
          return;
        }

        relatedWordsStatus.textContent = 'Searching for related words...';
        relatedWordsResult.innerHTML = '';

        try {
          const payload = await requestRelatedWords(term, limit);
          relatedWordsStatus.textContent = '';
          renderRelatedWords(payload);
        } catch (error) {
          relatedWordsStatus.textContent = error.message || 'Unable to load related words.';
          relatedWordsResult.innerHTML = '';
        }
      });
    </script>
  </body>
</html>
