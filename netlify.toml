[build]
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots-txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap-xml"
  status = 200

[[redirects]]
  from = "/nameCalculator.html"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/namecalculator"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/architect-site-adaptation-guide.md"
  to = "/architect-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/:guide-site-adaptation-guide.md"
  to = "/:guide-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/definition"
  to = "/.netlify/functions/wordnikDefinition"
  status = 200

[[redirects]]
  from = "/blog.xml"
  to = "/.netlify/functions/blog-rss"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-post-share/:slug"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/.netlify/functions/pwa-icon?size=180&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-192.png"
  to = "/.netlify/functions/pwa-icon?size=192&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-maskable-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=maskable"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://api.follow.it https://follow.it; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://bootswatch.com https://www.google-analytics.com https://region1.google-analytics.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/blog.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/ai-agent-share"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=120"

[[headers]]
  for = "/api/ai-agent-share-image"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/public-button-report"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/public-*"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=60"

[[headers]]
  for = "/api/wordnikDefinition"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/wordnikRelatedWords"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions."admin-click-tracking"]
  included_files = ["public/*.html"]

[functions."member-prune-unverified"]
  schedule = "0 0 * * *"


[functions."security-retention"]
  schedule = "0 * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
