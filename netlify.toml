[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots-txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap-xml"
  status = 200

[[redirects]]
  from = "/nameCalculator.html"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/namecalculator"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/architect-site-adaptation-guide.md"
  to = "/architect-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.md"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/secure/site-adaptation-guides/*-site-adaptation-guide.html"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.html.html"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.html.html*"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.html"
  to = "/.netlify/functions/super-admin-static-page"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/definition"
  to = "/.netlify/functions/wordnikDefinition"
  status = 200

[[redirects]]
  from = "/blog.xml"
  to = "/.netlify/functions/blog-rss"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-post-share/:slug"
  status = 200

[[redirects]]
  from = "/b/:username"
  to = "/.netlify/functions/badge-share?user=:username"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 301

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/.netlify/functions/pwa-icon?size=180&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-192.png"
  to = "/.netlify/functions/pwa-icon?size=192&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-maskable-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=maskable"
  status = 200

# Security headers — see notes below the CSP for two known trade-offs:
#   1. style-src keeps 'unsafe-inline' (audit S1 — budget item).
#   2. Cross-Origin-Embedder-Policy is intentionally omitted (audit S2).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    # NOTE: Cross-Origin-Embedder-Policy is deliberately NOT set. Enabling
    # COEP would block cross-origin sub-resources that lack CORP/CORS
    # (e.g. Follow.It embeds, jsdelivr fonts/styles) and unlock
    # crossOriginIsolated APIs (SharedArrayBuffer, high-res timers) we
    # don't currently need. Revisit if GemaBot or another client adds
    # heavy in-browser compute.
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(self), xr-spatial-tracking=()"
    # NOTE: style-src retains 'unsafe-inline' (audit S1). Every public
    # page still ships per-page <style> blocks; tightening to a
    # hash/nonce policy requires first externalizing them into
    # theme.css or page-scripts/<page>.css bundles. script-src is
    # already free of 'unsafe-inline' and enforced by
    # scripts/check-no-inline-scripts.mjs — keep it that way.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://api.follow.it https://follow.it; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://bootswatch.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/blog.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/ai-agent-share"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=120"

[[headers]]
  for = "/api/ai-agent-share-image"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/public-button-report"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/public-*"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=60"

[[headers]]
  for = "/api/wordnikDefinition"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/wordnikRelatedWords"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions."admin-hub"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

[functions."admin-click-tracking"]
  included_files = ["*.html"]

[functions."super-admin-static-page"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

[functions."super-admin-guide-index"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

[functions."member-prune-unverified"]
  schedule = "0 0 * * *"


[functions."security-retention"]
  schedule = "0 * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
