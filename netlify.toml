[build]
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/definition"
  to = "/.netlify/functions/wordnikDefinition"
  status = 200

[[redirects]]
  from = "/blog.xml"
  to = "/.netlify/functions/blog-rss"
  status = 200


[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/.netlify/functions/pwa-icon?size=180&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-192.png"
  to = "/.netlify/functions/pwa-icon?size=192&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=default"
  status = 200

[[redirects]]
  from = "/assets/icons/icon-maskable-512.png"
  to = "/.netlify/functions/pwa-icon?size=512&variant=maskable"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://api.follow.it https://follow.it; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/blog.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions."member-prune-unverified"]
  schedule = "*/15 * * * *"


[functions."security-retention"]
  schedule = "0 * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
