# Security headers — see notes below the CSP for two known trade-offs:
#   1. style-src keeps 'unsafe-inline' (audit S1 — budget item).
#   2. Cross-Origin-Embedder-Policy is intentionally omitted (audit S2).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    # NOTE: Cross-Origin-Embedder-Policy is deliberately NOT set. Enabling
    # COEP would block cross-origin sub-resources that lack CORP/CORS
    # (e.g. Follow.It embeds, jsdelivr Bootswatch styles) and unlock
    # crossOriginIsolated APIs (SharedArrayBuffer, high-res timers) we
    # don't currently need. Revisit if GemaBot or another client adds
    # heavy in-browser compute.
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(self), xr-spatial-tracking=()"
    # NOTE: style-src retains 'unsafe-inline' (audit S1). Every public
    # page still ships per-page <style> blocks; tightening to a
    # hash/nonce policy requires first externalizing them into
    # theme.css or page-scripts/<page>.css bundles. script-src is
    # already free of 'unsafe-inline' and enforced by
    # scripts/check-no-inline-scripts.mjs — keep it that way.
    # NOTE: cdn.jsdelivr.net is allowed in style-src ONLY. admin-theme.js
    # loads Bootswatch theme stylesheets from it on admin pages; the
    # public theme endpoint strips those @imports (see
    # netlify/functions/public-theme-css.mjs and its tests). It is
    # deliberately absent from script-src: marked.js is vendored at
    # /assets/vendor/marked/, so no third-party origin can execute
    # script on any page. Do not re-add it to script-src — vendor the
    # library instead, the way Bootstrap and marked already are.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://api.follow.it https://follow.it; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://bootswatch.com https://www.google-analytics.com https://region1.google-analytics.com https://ingesteer.services-prod.nsvcs.net; frame-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

# Explicit Content-Type for HTML responses so Lighthouse's "Properly defines
# charset" Best Practices audit passes on the deploy-preview CDN even when
# Netlify's auto-detected Content-Type omits the charset parameter. Covers
# the root, *.html files, and the function-served super-admin guides which
# all return text/html.
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/blog.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    X-Robots-Tag = "all"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/ai-agent-share"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=120"

[[headers]]
  for = "/api/ai-agent-share-image"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/name-chart-image"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/api/public-button-report"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/public-*"
  [headers.values]
    Cache-Control = "public, max-age=120, stale-while-revalidate=60"

[[headers]]
  for = "/api/wordnikDefinition"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/wordnikRelatedWords"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=120"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Shared helpers live alongside the endpoints as netlify/functions/_*.mjs. They
# are imported with plain relative specifiers ('./_badges.mjs'), so whether they
# reach the deployed bundle depends entirely on how the build packages a
# function -- and that is not something this repo controls.
#
# When the packager inlines dependencies, the import disappears and the helper
# travels inside the entry file. When it copies sources verbatim instead, the
# entry file keeps a live `import ... from './_badges.mjs'` and the helper has to
# exist next to it at runtime. In that second mode the helpers were being left
# out, and every endpoint importing one crashed on cold start with
#   Cannot find module '/var/task/netlify/functions/_badges.mjs'
#     imported from /var/task/netlify/functions/englishGematria.mjs
# which took out the calculator, the search endpoint and the badge routes.
#
# included_files is an explicit copy that runs regardless of packaging mode, and
# it preserves repository-relative paths -- so the helpers land at exactly the
# /var/task/netlify/functions/_*.mjs paths the resolver looks for. If the
# packager also inlines them, the extra copies are inert and cost a few KB.
#
# This is deliberately a global [functions] rule rather than a per-endpoint one:
# 70 of the 75 endpoints import at least one helper. Globs listed here are merged
# with, not replaced by, the per-function included_files below.
[functions]
  included_files = ["netlify/functions/_*.mjs"]

# word-page renders inside the real site chrome, so it needs the nav and footer
# partials at runtime.
[functions."word-page"]
  included_files = ["src/_includes/*.html"]

[functions."admin-hub"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

[functions."admin-click-tracking"]
  # Public page sources live in src/ since the Eleventy migration; the root glob
  # still covers admin pages and the standalone fallbacks.
  included_files = ["src/*.html", "*.html"]

[functions."super-admin-static-page"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

[functions."super-admin-guide-index"]
  included_files = ["secure/site-adaptation-guides/*-site-adaptation-guide.html"]

# resvg cannot read the woff2 cuts the site serves to browsers, and Lambda has
# no system fonts at all -- without these TTF cuts both PNG renderers drop every
# <text> node. tests/resvg-fonts.test.mjs fails if a glob here stops matching.
[functions."name-chart-image"]
  included_files = ["assets/fonts/*.ttf"]

[functions."ai-agent-share-image"]
  included_files = ["assets/fonts/*.ttf"]

[functions."member-prune-unverified"]
  schedule = "0 0 * * *"


[functions."security-retention"]
  schedule = "0 * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
