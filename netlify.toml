[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "_site"

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots-txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap-xml"
  status = 200

[[redirects]]
  from = "/nameCalculator.html"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/namecalculator"
  to = "/name-calculator.html"
  status = 301

[[redirects]]
  from = "/architect-site-adaptation-guide.md"
  to = "/architect-site-adaptation-guide.html"
  status = 301

# Forced for the same reason as the /secure/ rule below: the markdown sources of
# the guides are tracked at the repository root, so if they are ever published a
# direct request would be answered by the file and skip super-admin-static-page.
# The Eleventy config no longer copies them into _site; this is the second lock.
[[redirects]]
  from = "/*-site-adaptation-guide.md"
  to = "/:splat-site-adaptation-guide.html"
  status = 301
  force = true

# force = true is load-bearing, not cosmetic. The guide HTML files physically
# exist under secure/site-adaptation-guides/ and are passed through to _site, so
# without force a request for this path is answered by the static
# file and never reaches super-admin-static-page -- the only thing that checks
# authentication. Forcing the redirect sends every request through the root guide
# URL, which is itself force-redirected to the auth-checking function.
[[redirects]]
  from = "/secure/site-adaptation-guides/*-site-adaptation-guide.html"
  to = "/:splat-site-adaptation-guide.html"
  status = 301
  force = true

[[redirects]]
  from = "/*-site-adaptation-guide.html.html"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.html.html*"
  to = "/:splat-site-adaptation-guide.html"
  status = 301

[[redirects]]
  from = "/*-site-adaptation-guide.html"
  to = "/.netlify/functions/super-admin-static-page"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/definition"
  to = "/.netlify/functions/wordnikDefinition"
  status = 200

[[redirects]]
  from = "/blog.xml"
  to = "/.netlify/functions/blog-rss"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-post-share/:slug"
  status = 200

# Indexable pages for the words table. /w/:word and /v/:value give every word
# and every gematria value a real URL; they cross-link, so the whole set is
# crawlable once any one page is reached.
# The query string here is a fallback only. Netlify v2 functions receive the
# ORIGINAL request URL, not this rewrite target, so word-page parses /w/ and /v/
# out of the path itself. Keep both routes distinct regardless.
[[redirects]]
  from = "/w/:word"
  to = "/.netlify/functions/word-page?kind=word&key=:word"
  status = 200

[[redirects]]
  from = "/v/:value"
  to = "/.netlify/functions/word-page?kind=value&key=:value"
  status = 200

# Sitemap index plus fixed-size chunks. A single sitemap over 30k+ words meant
# one request sorting every row and writing a multi-megabyte cache entry, which
# is what returned 502.
[[redirects]]
  from = "/sitemap-words.xml"
  to = "/.netlify/functions/sitemap-words-xml?index=1"
  status = 200

# Full-segment placeholder, like /blog/:slug and /b/:username. A placeholder in
# the middle of a filename (sitemap-words-:page.xml) is not a pattern this repo
# has ever proven works.
[[redirects]]
  from = "/sitemap-words/:page"
  to = "/.netlify/functions/sitemap-words-xml?page=:page"
  status = 200

[[redirects]]
  from = "/b/:username"
  to = "/.netlify/functions/badge-share?user=:username"
  status = 200

# A `/:page` -> `/:page.html` wildcard used to live here. It matched any single
# path segment -- including one that already had a dot -- and was terminated
# only by a file existing at the target, so every path with no file behind it
# looped: /favicon.ico -> /favicon.ico.html -> /favicon.ico.html.html -> ...
# The rules below are generated per published page and cannot loop.
# BEGIN generated page redirects -- run `npm run sync:redirects`
