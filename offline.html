<!doctype html>
<html lang="en">
  <head>
<!-- Google Analytics bootstrap moved to deferred module -->
<script defer src="/analytics-bootstrap.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var hasPromise = typeof window.Promise === 'function';
        var hasFetch = typeof window.fetch === 'function';
        var userAgent = ((window.navigator && window.navigator.userAgent) || '').toLowerCase();
        var isBot = /bot|crawl|spider|slurp|bingpreview|google web preview|facebookexternalhit|whatsapp|telegrambot|linkedinbot|twitterbot/.test(userAgent);
        if ((hasPromise && hasFetch) || isBot) {
          return;
        }

        var pathname = (window.location && window.location.pathname) || '';
        if (pathname === '/unsupported-browser.html') {
          return;
        }

        var redirectUrl = '/unsupported-browser.html?from=' + encodeURIComponent(pathname || '/');
        window.location.replace(redirectUrl);
      })();
    </script>
    <title>Offline | Gematria.Today</title>
    <link rel="preload" as="style" href="/api/public-theme-css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/api/public-theme-css" /></noscript>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="preload" as="style" href="/theme-deferred.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/theme-deferred.css" /></noscript>
    <style>
      :root { color-scheme: dark; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 1rem; margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .offline-card { max-width: 40rem; background: rgba(23, 30, 41, 0.92); color: #e2e8f0; border-radius: var(--radius-xl); padding: 2rem; border: 1px solid rgba(148, 177, 215, 0.22); box-shadow: 0 1rem 2.5rem rgba(3, 7, 12, 0.45); }
      .offline-card .btn-primary { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.375rem; background: #2563eb; color: #fff; text-decoration: none; font-weight: 500; border: 1px solid #2563eb; }
      .offline-card .btn-primary:hover, .offline-card .btn-primary:focus-visible { background: #1d4ed8; border-color: #1d4ed8; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <main id="mainContent" class="offline-card" role="main">
      <h1 class="h3 mb-3">You are offline</h1>
      <p class="mb-4">Gematria.Today can’t reach the network right now. Try again once your connection returns.</p>
      <p class="mb-0"><a class="btn btn-primary" href="/">Go to home</a></p>
    </main>
  </body>
</html>
