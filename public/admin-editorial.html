<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Editorial Queue | EndTimes.Today Admin</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></noscript>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <main class="py-5">
      <div class="container" style="max-width: 980px;">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
          <div>
            <p class="section-kicker mb-2">Editorial Queue</p>
            <h1 class="h3 mb-1">Review proposed blog posts</h1>
            <p class="text-muted small mb-0">Load a proposal into the post editor, then publish from the Create blog posts section.</p>
          </div>
          <a class="btn btn-outline-secondary" href="/admin.html">Back to dashboard</a>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
        <div id="saveMessage" class="alert alert-success d-none" role="status"></div>

        <section class="content-panel p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="section-kicker mb-0">Proposed posts report</span>
            <span id="proposalPendingBadge" class="badge text-bg-danger">0 pending</span>
          </div>
          <div id="proposalList" class="admin-list"></div>
        </section>
      </div>
    </main>

    <script>
      const state = { proposals: [] };
      const saveMessage = document.getElementById('saveMessage');
      const errorMessage = document.getElementById('errorMessage');

      function showMessage(el, message) {
        if (!el) return;
        el.textContent = message;
        el.classList.remove('d-none');
      }

      function clearMessage(el) {
        if (!el) return;
        el.textContent = '';
        el.classList.add('d-none');
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Request failed');
        }
        return payload;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderBlogProposals() {
        const pendingCount = state.proposals.filter((proposal) => proposal.status === 'pending').length;
        document.getElementById('proposalPendingBadge').textContent = `${pendingCount} pending`;
        const list = document.getElementById('proposalList');
        list.innerHTML = state.proposals.length ? state.proposals.map((proposal) => `
          <article class="admin-item-card mb-3 p-3">
            <div class="d-flex justify-content-between gap-3">
              <div>
                <div class="d-flex flex-wrap gap-2 mb-2">
                  <span class="badge ${proposal.status === 'pending' ? 'text-bg-danger' : 'text-bg-secondary'}">${escapeHtml(proposal.status || 'pending')}</span>
                  <span class="badge text-bg-light">${escapeHtml(new Date(proposal.createdAt).toLocaleString())}</span>
                  ${proposal.attributionUsername ? `<span class="badge text-bg-info">@${escapeHtml(proposal.attributionUsername)}</span>` : ''}
                </div>
                <h2 class="h5 mb-2">${escapeHtml(proposal.title || 'Untitled proposal')}</h2>
                <p class="small mb-2">${escapeHtml(proposal.summary || '')}</p>
                <p class="small text-muted mb-2">Suggested tags: ${escapeHtml(proposal.suggestedTags || 'none')}</p>
                ${proposal.proposedImageUrl ? `<p class="small text-muted mb-2">Suggested image URL: <span class="text-break">${escapeHtml(proposal.proposedImageUrl)}</span></p>` : ''}
                <details>
                  <summary class="small">View draft content</summary>
                  <pre class="small mt-2 mb-0 text-wrap" style="white-space: pre-wrap;">${escapeHtml(proposal.body || '')}</pre>
                </details>
              </div>
              <div class="d-flex flex-column gap-2" style="min-width: 220px;">
                <a class="btn btn-sm btn-outline-primary" href="/admin.html?loadProposal=${encodeURIComponent(proposal.id)}">Load into post editor</a>
                <button class="btn btn-sm btn-outline-success" type="button" data-mark-proposal-reviewed="${escapeHtml(proposal.id)}">Mark reviewed</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-mark-proposal-pending="${escapeHtml(proposal.id)}">Set pending</button>
              </div>
            </div>
          </article>`).join('') : '<p class="text-muted small mb-0">No proposals yet.</p>';
      }

      async function refreshProposals() {
        const proposals = await request('/api/admin-blog-proposals');
        state.proposals = proposals.items || [];
        renderBlogProposals();
      }

      async function init() {
        try {
          await request('/api/admin-session');
          await refreshProposals();
        } catch (error) {
          window.location.href = '/admin.html';
        }
      }

      document.addEventListener('click', async (event) => {
        const proposalId = event.target.dataset.markProposalReviewed || event.target.dataset.markProposalPending;
        if (!proposalId) return;
        const nextStatus = event.target.dataset.markProposalReviewed ? 'reviewed' : 'pending';
        clearMessage(errorMessage);
        try {
          await request('/api/admin-blog-proposals', {
            method: 'POST',
            body: JSON.stringify({ id: proposalId, status: nextStatus })
          });
          showMessage(saveMessage, `Proposal status updated to ${nextStatus}.`);
          await refreshProposals();
        } catch (error) {
          showMessage(errorMessage, error.message);
        }
      });

      init();
    </script>
  </body>
</html>
