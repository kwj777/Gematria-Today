<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Forum Admin | EndTimes.Today</title>
    <meta name="description" content="Admin moderation and category management for the member forum." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></noscript>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/index.html"><img src="/assets/endtimes-logo-navbar.svg" alt="EndTimes.Today" class="site-logo" width="220" height="52" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="siteNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/admin.html">Admin Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin-forum.html">Forum Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin-reports.html">Reports</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <header class="content-panel p-4 p-lg-5 mb-4">
        <p class="section-kicker mb-2">Moderation</p>
        <h1 class="h3 mb-2">Forum admin area</h1>
        <p class="text-muted mb-0">Review reported content and manage forum categories.</p>
      </header>

      <section id="alert" class="alert d-none" role="alert"></section>

      <section class="content-panel p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
          <h2 class="h4 mb-0">Reported posts and threads</h2>
          <button id="refreshButton" class="btn btn-outline-primary btn-sm" type="button">Refresh</button>
        </div>
        <div id="reportsList"></div>
      </section>

      <section class="content-panel p-4 mb-4">
        <h2 class="h4 mb-3">Create category</h2>
        <form id="createCategoryForm" class="row g-3">
          <div class="col-md-4"><label class="form-label" for="createName">Name</label><input id="createName" class="form-control" maxlength="80" required /></div>
          <div class="col-md-3"><label class="form-label" for="createSlug">Slug</label><input id="createSlug" class="form-control" maxlength="80" placeholder="optional-auto-from-name" /></div>
          <div class="col-md-2"><label class="form-label" for="createTier">Access</label><select id="createTier" class="form-select"><option value="free">Free</option><option value="premium">Premium</option></select></div>
          <div class="col-md-3"><label class="form-label" for="createSort">Sort order</label><input id="createSort" class="form-control" type="number" value="0" /></div>
          <div class="col-12"><label class="form-label" for="createDescription">Description</label><textarea id="createDescription" class="form-control" rows="2" maxlength="240"></textarea></div>
          <div class="col-12 d-grid d-md-flex justify-content-md-end"><button class="btn btn-primary" type="submit">Create category</button></div>
        </form>
      </section>

      <section class="content-panel p-4">
        <h2 class="h4 mb-3">Categories</h2>
        <div id="categoriesList"></div>
      </section>
    </main>

    <script>
      const alertEl = document.getElementById('alert');
      const reportsListEl = document.getElementById('reportsList');
      const categoriesListEl = document.getElementById('categoriesList');

      function showAlert(message, type = 'danger') {
        alertEl.className = `alert alert-${type}`;
        alertEl.textContent = message;
        alertEl.classList.remove('d-none');
      }

      function hideAlert() {
        alertEl.classList.add('d-none');
      }

      async function request(url, options = {}) {
        const response = await fetch(url, { credentials: 'include', headers: { 'content-type': 'application/json' }, ...options });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Request failed');
        return payload;
      }

      function formatDate(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleString();
      }

      function renderReports(reports) {
        if (!reports.length) {
          reportsListEl.innerHTML = '<p class="text-muted mb-0">No open reports.</p>';
          return;
        }

        reportsListEl.innerHTML = reports.map((report) => `
          <article class="border rounded p-3 mb-3">
            <div class="d-flex justify-content-between align-items-start gap-3">
              <div>
                <p class="mb-1"><strong>${report.reason}</strong> · by ${report.reporterUsername} · ${formatDate(report.createdAt)}</p>
                <p class="small text-muted mb-1">Category: ${report.categoryName || 'Unknown'} · Thread: ${report.threadTitle || report.threadId || 'Unknown'} · Reply: ${report.postId || 'n/a'}</p>
                <p class="mb-0">${(report.details || report.reportedBodyPreview || 'No details').slice(0, 240)}</p>
              </div>
              <button class="btn btn-outline-success btn-sm" type="button" data-resolve-report="${report.id}">Resolve</button>
            </div>
          </article>
        `).join('');

        reportsListEl.querySelectorAll('[data-resolve-report]').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              hideAlert();
              await request('/api/admin-forum', { method: 'PUT', body: JSON.stringify({ id: button.dataset.resolveReport }) });
              await load();
              showAlert('Report marked as resolved.', 'success');
            } catch (error) {
              showAlert(error.message);
            }
          });
        });
      }

      function renderCategories(categories) {
        if (!categories.length) {
          categoriesListEl.innerHTML = '<p class="text-muted mb-0">No categories found.</p>';
          return;
        }

        categoriesListEl.innerHTML = categories.map((category) => `
          <form class="border rounded p-3 mb-3" data-category-form="${category.id}">
            <input type="hidden" name="id" value="${category.id}" />
            <div class="row g-2 align-items-end">
              <div class="col-md-3"><label class="form-label small" for="name-${category.id}">Name</label><input id="name-${category.id}" class="form-control" name="name" value="${category.name}" required /></div>
              <div class="col-md-2"><label class="form-label small" for="slug-${category.id}">Slug</label><input id="slug-${category.id}" class="form-control" name="slug" value="${category.slug}" required /></div>
              <div class="col-md-2"><label class="form-label small" for="tier-${category.id}">Access</label><select id="tier-${category.id}" class="form-select" name="accessTier"><option value="free" ${category.accessTier === 'free' ? 'selected' : ''}>Free</option><option value="premium" ${category.accessTier === 'premium' ? 'selected' : ''}>Premium</option></select></div>
              <div class="col-md-2"><label class="form-label small" for="sort-${category.id}">Sort</label><input id="sort-${category.id}" class="form-control" name="sortOrder" type="number" value="${category.sortOrder}" /></div>
              <div class="col-md-3"><label class="form-label small" for="description-${category.id}">Description</label><input id="description-${category.id}" class="form-control" name="description" value="${category.description || ''}" /></div>
              <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                <button class="btn btn-outline-primary btn-sm" type="submit">Save</button>
                <button class="btn btn-outline-danger btn-sm" type="button" data-delete-category="${category.id}">Delete</button>
              </div>
            </div>
          </form>
        `).join('');

        categoriesListEl.querySelectorAll('[data-category-form]').forEach((form) => {
          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());
            try {
              hideAlert();
              await request('/api/admin-forum', { method: 'PATCH', body: JSON.stringify(payload) });
              await load();
              showAlert('Category updated.', 'success');
            } catch (error) {
              showAlert(error.message);
            }
          });
        });

        categoriesListEl.querySelectorAll('[data-delete-category]').forEach((button) => {
          button.addEventListener('click', async () => {
            if (!confirm('Delete this category? This only works when no active threads exist in it.')) return;
            try {
              hideAlert();
              await request(`/api/admin-forum?id=${encodeURIComponent(button.dataset.deleteCategory)}`, { method: 'DELETE' });
              await load();
              showAlert('Category deleted.', 'success');
            } catch (error) {
              showAlert(error.message);
            }
          });
        });
      }

      async function load() {
        const payload = await request('/api/admin-forum');
        renderReports(payload.reports || []);
        renderCategories(payload.categories || []);
      }

      document.getElementById('refreshButton').addEventListener('click', () => load().catch((error) => showAlert(error.message)));

      document.getElementById('createCategoryForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          hideAlert();
          await request('/api/admin-forum', {
            method: 'POST',
            body: JSON.stringify({
              name: document.getElementById('createName').value,
              slug: document.getElementById('createSlug').value,
              accessTier: document.getElementById('createTier').value,
              sortOrder: document.getElementById('createSort').value,
              description: document.getElementById('createDescription').value,
            }),
          });
          event.target.reset();
          await load();
          showAlert('Category created.', 'success');
        } catch (error) {
          showAlert(error.message);
        }
      });

      load().catch((error) => {
        if (error.message.toLowerCase().includes('unauthorized')) {
          showAlert('Sign in to the admin dashboard first.', 'warning');
          return;
        }
        showAlert(error.message);
      });
    </script>
  </body>
</html>
