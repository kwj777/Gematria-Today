<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<title>Manage Blog Posts | EndTimes.Today</title>
    <meta name="description" content="Manage all published blog posts from the admin dashboard." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://endtimes.today/admin-posts.html" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/theme.css" />
    <script src="/ui-feedback.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/index.html"><img src="/assets/endtimes-logo-navbar.svg" alt="EndTimes.Today" class="site-logo" width="220" height="52" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="siteNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/news.html">News</a></li>
            <li class="nav-item"><a class="nav-link" href="/blog.html">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="/faq.html">FAQ</a></li>
            <li class="nav-item"><a class="nav-link" href="/member.html">Membership</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin.html">Admin</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <section class="hero-panel p-4 p-lg-5 mb-4">
          <p class="section-kicker mb-2">Publishing</p>
          <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <div>
              <h1 class="h2 mb-2">Manage all blog posts</h1>
              <p id="sessionMeta" class="text-muted mb-0">Checking admin session…</p>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-primary" href="/admin.html">Back to Admin</a>
              <a class="btn btn-outline-primary" href="/blog.html">View Blog page</a>
            </div>
          </div>
        </section>

        <div id="saveMessage" class="alert alert-success d-none" role="status"></div>
        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <section class="content-panel p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Posts</h2>
            <span id="postCount" class="badge text-bg-secondary">0</span>
          </div>
          <div id="postList" class="d-grid gap-3"></div>
        </section>
      </div>
    </main>

    <script>
      const postList = document.getElementById('postList');
      const postCount = document.getElementById('postCount');
      const sessionMeta = document.getElementById('sessionMeta');
      const saveMessage = document.getElementById('saveMessage');
      const errorMessage = document.getElementById('errorMessage');
      const state = { posts: [], editingPostId: null };

      const escapeHtml = (value = '') => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      function formatCreatedOnLabel(value) {
        if (!value) return 'Created on: —';
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return 'Created on: —';
        return `Created on: ${parsed.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}`;
      }

      function showMessage(target, message) {
        target.textContent = message;
        target.classList.remove('d-none');
      }

      function clearMessage(target) {
        target.textContent = '';
        target.classList.add('d-none');
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json', ...(options.headers || {}) },
          ...options
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Request failed');
        }
        return payload;
      }

      function renderPosts() {
        postCount.textContent = String(state.posts.length);
        postList.innerHTML = state.posts.length ? state.posts.map((post) => {
          const isEditing = state.editingPostId === post.id;
          return `
            <details class="admin-post-details admin-item-card p-3" ${isEditing ? 'open' : ''}>
              <summary class="admin-post-summary">
                <span class="fw-semibold admin-post-summary-title">${escapeHtml(post.title)}</span>
                <span class="small text-muted admin-post-summary-meta">${escapeHtml(formatCreatedOnLabel(post.createdAt || post.publishedAt))}</span>
              </summary>
              <div class="pt-3">
                <p class="small text-muted mb-2">${escapeHtml(post.summary || '')}</p>
                <article class="small mb-3">${post.body || ''}</article>
                <div class="d-flex flex-wrap gap-2 mb-3">
                  <button class="btn btn-sm btn-outline-primary" type="button" data-edit-post="${post.id}">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" type="button" data-delete-post="${post.id}">Delete</button>
                </div>
                <form class="row g-2 ${isEditing ? '' : 'd-none'}" data-edit-form="${post.id}">
                  <div class="col-12"><label class="form-label" for="editTitle-${post.id}">Title</label><input id="editTitle-${post.id}" class="form-control" value="${escapeHtml(post.title || '')}" required /></div>
                  <div class="col-12"><label class="form-label" for="editTag-${post.id}">Tags</label><input id="editTag-${post.id}" class="form-control" value="${escapeHtml(post.tag || '')}" /></div>
                  <div class="col-12"><label class="form-label" for="editReadTime-${post.id}">Read time</label><input id="editReadTime-${post.id}" class="form-control" value="${escapeHtml(post.readTime || '')}" /></div>
                  <div class="col-12"><label class="form-label" for="editImageUrl-${post.id}">Post image URL</label><input id="editImageUrl-${post.id}" class="form-control" value="${escapeHtml(post.imageUrl || '')}" /></div>
                  <div class="col-12"><label class="form-label" for="editSliderImageUrl-${post.id}">Home slider image URL</label><input id="editSliderImageUrl-${post.id}" class="form-control" value="${escapeHtml(post.sliderImageUrl || '')}" /><div class="form-text">Optional: only used on the home slider.</div></div>
                  <div class="col-12"><label class="form-label" for="editSummary-${post.id}">Summary</label><textarea id="editSummary-${post.id}" class="form-control" rows="2" required>${escapeHtml(post.summary || '')}</textarea></div>
                  <div class="col-12"><label class="form-label" for="editBody-${post.id}">Body</label><textarea id="editBody-${post.id}" class="form-control" rows="6" required>${escapeHtml(post.body || '')}</textarea></div>
                  <div class="col-12">
                    <div class="form-check">
                      <input id="editHomepage-${post.id}" class="form-check-input" type="checkbox" ${post.showOnHomepage ? 'checked' : ''} />
                      <label class="form-check-label" for="editHomepage-${post.id}">Show this post in the home page slider</label>
                    </div>
                  </div>
                  <div class="col-12 d-flex gap-2">
                    <button class="btn btn-sm btn-primary" type="submit">Save changes</button>
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-cancel-edit="${post.id}">Cancel</button>
                  </div>
                </form>
              </div>
            </details>`;
        }).join('') : '<p class="text-muted small mb-0">No blog posts found.</p>';
      }

      async function loadSession() {
        try {
          const session = await request('/api/admin-session');
          sessionMeta.textContent = `Signed in as ${session.user?.username || 'admin'}.`;
        } catch (error) {
          window.location.href = '/admin.html';
        }
      }

      async function loadPosts() {
        const payload = await request('/api/admin-posts');
        state.posts = payload.items || payload.posts || [];
        renderPosts();
      }

      document.addEventListener('click', async (event) => {
        const { editPost, deletePost, cancelEdit } = event.target.dataset;
        if (!editPost && !deletePost && !cancelEdit) {
          return;
        }
        clearMessage(errorMessage);
        try {
          if (editPost) {
            state.editingPostId = editPost;
            renderPosts();
            return;
          }
          if (cancelEdit) {
            state.editingPostId = null;
            renderPosts();
            return;
          }
          if (deletePost) {
            await request(`/api/admin-posts?id=${encodeURIComponent(deletePost)}`, { method: 'DELETE' });
            showMessage(saveMessage, 'Blog post removed.');
            state.editingPostId = null;
            await loadPosts();
          }
        } catch (error) {
          showMessage(errorMessage, error.message);
        }
      });

      document.addEventListener('submit', async (event) => {
        const form = event.target.closest('[data-edit-form]');
        if (!form) {
          return;
        }
        event.preventDefault();
        clearMessage(errorMessage);
        const postId = form.dataset.editForm;
        try {
          await request('/api/admin-posts', {
            method: 'PUT',
            body: JSON.stringify({
              id: postId,
              title: document.getElementById(`editTitle-${postId}`).value,
              tag: document.getElementById(`editTag-${postId}`).value,
              readTime: document.getElementById(`editReadTime-${postId}`).value,
              imageUrl: document.getElementById(`editImageUrl-${postId}`).value,
              sliderImageUrl: document.getElementById(`editSliderImageUrl-${postId}`).value,
              showOnHomepage: document.getElementById(`editHomepage-${postId}`).checked,
              summary: document.getElementById(`editSummary-${postId}`).value,
              body: document.getElementById(`editBody-${postId}`).value,
              status: 'published'
            })
          });
          state.editingPostId = null;
          showMessage(saveMessage, 'Blog post updated.');
          await loadPosts();
        } catch (error) {
          showMessage(errorMessage, error.message);
        }
      });

      loadSession().then(loadPosts).catch((error) => showMessage(errorMessage, error.message));
    </script>
  </body>
</html>
