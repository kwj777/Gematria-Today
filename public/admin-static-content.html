<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#355f8c" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Static Content Workspace | EndTimes.Today</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></noscript>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/admin.html">Admin</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/admin-posts.html">Posts</a>
          <a class="nav-link active" href="/admin-static-content.html">Static Content</a>
          <a class="nav-link" href="/admin-editorial.html">Editorial</a>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
          <div>
            <p class="section-kicker mb-2">Content Management</p>
            <h1 class="h3 mb-1">Static pages and reusable elements</h1>
            <p id="sessionMeta" class="text-muted mb-0 small"></p>
          </div>
          <a class="btn btn-outline-secondary align-self-start" href="/admin.html">Back to dashboard</a>
        </div>

        <div id="saveMessage" class="alert alert-success d-none" role="status"></div>
        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <section class="content-panel p-4 mb-4">
          <div class="row g-3 align-items-end">
            <div class="col-lg-4">
              <label class="form-label" for="targetType">Content type</label>
              <select id="targetType" class="form-select">
                <option value="page">Static page</option>
                <option value="element">Static element</option>
              </select>
            </div>
            <div class="col-lg-8">
              <label class="form-label" for="targetId">Target</label>
              <select id="targetId" class="form-select"></select>
            </div>
          </div>
        </section>

        <section class="content-panel p-4">
          <h2 id="editorTitle" class="h5 mb-3">Editor</h2>
          <form id="editorForm" class="row g-3">
            <div class="col-md-6" data-field="seoTitle">
              <label class="form-label" for="fieldSeoTitle">SEO title</label>
              <input id="fieldSeoTitle" class="form-control" maxlength="160" />
            </div>
            <div class="col-md-6" data-field="metaDescription">
              <label class="form-label" for="fieldMetaDescription">Meta description</label>
              <input id="fieldMetaDescription" class="form-control" maxlength="300" />
            </div>
            <div class="col-md-6" data-field="heroHeadline">
              <label class="form-label" for="fieldHeroHeadline">Primary hero headline</label>
              <input id="fieldHeroHeadline" class="form-control" maxlength="180" />
            </div>
            <div class="col-md-6" data-field="heroHeadlineSecondary">
              <label class="form-label" for="fieldHeroHeadlineSecondary">Secondary hero headline</label>
              <input id="fieldHeroHeadlineSecondary" class="form-control" maxlength="180" />
            </div>
            <div class="col-md-6" data-field="heading">
              <label class="form-label" for="fieldHeading">Element heading</label>
              <input id="fieldHeading" class="form-control" maxlength="180" />
            </div>
            <div class="col-12" data-field="heroBody">
              <label class="form-label" for="fieldHeroBody">Primary hero body copy</label>
              <textarea id="fieldHeroBody" class="form-control" rows="4" maxlength="2000"></textarea>
            </div>
            <div class="col-12" data-field="heroBodySecondary">
              <label class="form-label" for="fieldHeroBodySecondary">Secondary hero body copy</label>
              <textarea id="fieldHeroBodySecondary" class="form-control" rows="4" maxlength="2000"></textarea>
            </div>
            <div class="col-12" data-field="body">
              <label class="form-label" for="fieldBody">Element body copy</label>
              <textarea id="fieldBody" class="form-control" rows="4" maxlength="2000"></textarea>
            </div>
            <div class="col-md-6" data-field="ctaLabel">
              <label class="form-label" for="fieldCtaLabel">CTA label</label>
              <input id="fieldCtaLabel" class="form-control" maxlength="80" />
            </div>
            <div class="col-md-6" data-field="ctaUrl">
              <label class="form-label" for="fieldCtaUrl">CTA URL</label>
              <input id="fieldCtaUrl" class="form-control" maxlength="500" />
            </div>
            <div class="col-12" data-field="allStaticContent">
              <label class="form-label" for="fieldAllStaticContent">All static page content</label>
              <textarea id="fieldAllStaticContent" class="form-control" rows="10" maxlength="20000"></textarea>
            </div>
            <div class="col-md-6" data-field="buttonLabel">
              <label class="form-label" for="fieldButtonLabel">Element button label</label>
              <input id="fieldButtonLabel" class="form-control" maxlength="80" />
            </div>
            <div class="col-md-6" data-field="buttonUrl">
              <label class="form-label" for="fieldButtonUrl">Element button URL</label>
              <input id="fieldButtonUrl" class="form-control" maxlength="500" />
            </div>
            <div class="col-12 d-flex flex-wrap gap-2">
              <button class="btn btn-primary" type="submit">Save content block</button>
              <button id="copyJsonButton" class="btn btn-outline-secondary" type="button">Copy JSON for implementation</button>
            </div>
            <div class="col-12">
              <div class="small text-muted" id="lastUpdatedMeta">Not saved yet.</div>
            </div>
          </form>
        </section>

        <section id="pagePreviewPanel" class="content-panel p-4 mt-4 d-none">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 mb-0">Current page snapshot</h2>
            <a id="pagePreviewLink" class="btn btn-sm btn-outline-secondary d-none" href="#" target="_blank" rel="noopener">Open live page</a>
          </div>
          <p id="pagePreviewMeta" class="small text-muted mb-3">
            Select a static page to load its latest screenshot-style preview.
          </p>
          <div class="ratio ratio-16x9 border rounded overflow-hidden bg-light">
            <iframe
              id="pagePreviewFrame"
              title="Selected static page preview"
              class="w-100 h-100 border-0"
              loading="lazy"
              referrerpolicy="same-origin"
            ></iframe>
          </div>
        </section>
      </div>
    </main>

    <script>
      const targetType = document.getElementById('targetType');
      const targetId = document.getElementById('targetId');
      const editorForm = document.getElementById('editorForm');
      const editorTitle = document.getElementById('editorTitle');
      const saveMessage = document.getElementById('saveMessage');
      const errorMessage = document.getElementById('errorMessage');
      const sessionMeta = document.getElementById('sessionMeta');
      const lastUpdatedMeta = document.getElementById('lastUpdatedMeta');
      const copyJsonButton = document.getElementById('copyJsonButton');
      const pagePreviewPanel = document.getElementById('pagePreviewPanel');
      const pagePreviewMeta = document.getElementById('pagePreviewMeta');
      const pagePreviewFrame = document.getElementById('pagePreviewFrame');
      const pagePreviewLink = document.getElementById('pagePreviewLink');

      const fields = {
        seoTitle: document.getElementById('fieldSeoTitle'),
        metaDescription: document.getElementById('fieldMetaDescription'),
        heroHeadline: document.getElementById('fieldHeroHeadline'),
        heroBody: document.getElementById('fieldHeroBody'),
        heroHeadlineSecondary: document.getElementById('fieldHeroHeadlineSecondary'),
        heroBodySecondary: document.getElementById('fieldHeroBodySecondary'),
        ctaLabel: document.getElementById('fieldCtaLabel'),
        ctaUrl: document.getElementById('fieldCtaUrl'),
        allStaticContent: document.getElementById('fieldAllStaticContent'),
        heading: document.getElementById('fieldHeading'),
        body: document.getElementById('fieldBody'),
        buttonLabel: document.getElementById('fieldButtonLabel'),
        buttonUrl: document.getElementById('fieldButtonUrl'),
      };

      const state = {
        pageDefinitions: [],
        elementDefinitions: [],
        workspace: null,
        pageSourceContent: {},
        elementSourceContent: {},
      };

      function updatePagePreview() {
        if (targetType.value !== 'page') {
          pagePreviewPanel.classList.add('d-none');
          pagePreviewFrame.src = 'about:blank';
          pagePreviewLink.classList.add('d-none');
          return;
        }

        const selected = state.pageDefinitions.find((item) => item.id === targetId.value);
        const pagePath = selected?.path || '';
        if (!pagePath) {
          pagePreviewPanel.classList.remove('d-none');
          pagePreviewFrame.src = 'about:blank';
          pagePreviewMeta.textContent = 'No page path is available for this target.';
          pagePreviewLink.classList.add('d-none');
          return;
        }

        pagePreviewPanel.classList.remove('d-none');
        pagePreviewMeta.textContent = `Previewing ${selected.label} (${pagePath}).`;
        pagePreviewFrame.src = pagePath;
        pagePreviewLink.href = pagePath;
        pagePreviewLink.classList.remove('d-none');
      }

      function showMessage(node, message) {
        node.textContent = message;
        node.classList.remove('d-none');
      }

      function clearMessage(node) {
        node.textContent = '';
        node.classList.add('d-none');
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          credentials: 'include',
          ...options,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Request failed (${response.status})`);
        }
        return data;
      }

      function updateFieldVisibility() {
        const isPage = targetType.value === 'page';
        document.querySelectorAll('[data-field]').forEach((node) => {
          const key = node.getAttribute('data-field');
          const pageFields = ['seoTitle', 'metaDescription', 'heroHeadline', 'heroBody', 'heroHeadlineSecondary', 'heroBodySecondary', 'ctaLabel', 'ctaUrl', 'allStaticContent'];
          const elementFields = ['heading', 'body', 'buttonLabel', 'buttonUrl'];
          const show = isPage ? pageFields.includes(key) : elementFields.includes(key);
          node.classList.toggle('d-none', !show);
        });
      }

      function setTargetOptions() {
        const isPage = targetType.value === 'page';
        const items = isPage ? state.pageDefinitions : state.elementDefinitions;
        targetId.innerHTML = items
          .map((item) => `<option value="${item.id}">${item.label}${item.path ? ` (${item.path})` : ''}</option>`)
          .join('');
        updateFieldVisibility();
        void fillForm();
      }

      function hasPageContent(content = {}) {
        return ['seoTitle', 'metaDescription', 'heroHeadline', 'heroBody', 'heroHeadlineSecondary', 'heroBodySecondary', 'ctaLabel', 'ctaUrl', 'allStaticContent']
          .some((field) => String(content[field] || '').trim().length > 0);
      }

      function hasElementContent(content = {}) {
        return ['heading', 'body', 'buttonLabel', 'buttonUrl']
          .some((field) => String(content[field] || '').trim().length > 0);
      }

      function extractPageSourceContent(html = '') {
        if (!html) return {};
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = doc.querySelector('title')?.textContent?.trim() || '';
        const metaDescription = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim() || '';

        const heroContainer = doc.querySelector('main section') || doc.querySelector('main') || doc.body;
        const homeHeroSlides = Array.from(doc.querySelectorAll('#homeHeroCarousel .carousel-item'));
        const slideHeadlines = homeHeroSlides
          .map((slide) => String(slide.querySelector('h1, h2')?.textContent || '').trim());
        const slideBodies = homeHeroSlides
          .map((slide) => {
            const paragraphs = Array.from(slide.querySelectorAll('p'));
            return (paragraphs.find((node) => String(node.textContent || '').trim())?.textContent || '').trim();
          });

        let heroHeadline = slideHeadlines[0] || '';
        let heroBody = slideBodies[0] || '';
        let heroHeadlineSecondary = slideHeadlines[1] || '';
        let heroBodySecondary = slideBodies[1] || '';

        if (!heroHeadline) {
          heroHeadline = heroContainer?.querySelector('h1, h2')?.textContent?.trim() || '';
        }

        if (!heroBody && heroContainer) {
          const heroParagraphs = Array.from(heroContainer.querySelectorAll('p'));
          heroBody = (heroParagraphs.find((node) => String(node.textContent || '').trim())?.textContent || '').trim();
        }

        if (!heroHeadlineSecondary) {
          heroHeadlineSecondary = '';
        }

        if (!heroBodySecondary) {
          heroBodySecondary = '';
        }

        const ctaNode = heroContainer?.querySelector('a[href]');
        const ctaLabel = ctaNode?.textContent?.trim() || '';
        const ctaUrl = ctaNode?.getAttribute('href')?.trim() || '';
        const staticTextNodes = Array.from((doc.querySelector('main') || doc.body).querySelectorAll('h1, h2, h3, p, li, a.btn, button'))
          .map((node) => String(node.textContent || '').replace(/\s+/g, ' ').trim())
          .filter((text) => text.length > 0);
        const dedupedStaticText = [...new Set(staticTextNodes)];

        return {
          seoTitle: title,
          metaDescription,
          heroHeadline,
          heroBody,
          heroHeadlineSecondary,
          heroBodySecondary,
          ctaLabel,
          ctaUrl,
          allStaticContent: dedupedStaticText.join('\n\n'),
        };
      }

      function extractElementSourceContent(definition, html = '') {
        if (!definition?.id || !html) {
          return {};
        }
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        if (definition.id === 'footer_note') {
          const footerNotes = Array.from(doc.querySelectorAll('.site-footer .container > .d-flex > span'))
            .map((node) => String(node.textContent || '').trim())
            .filter((text) => text.length > 0);
          return {
            heading: footerNotes[0] || '',
            body: footerNotes[1] || '',
            buttonLabel: '',
            buttonUrl: '',
          };
        }

        if (definition.id === 'homepage_hero_cta') {
          const heroButton = doc.querySelector('#homeHeroCarousel .carousel-item.active a.btn, #homeHeroCarousel .carousel-item a.btn, main section a.btn');
          return {
            heading: String(heroButton?.textContent || '').trim(),
            body: '',
            buttonLabel: String(heroButton?.textContent || '').trim(),
            buttonUrl: String(heroButton?.getAttribute('href') || '').trim(),
          };
        }

        if (definition.id === 'support_cta') {
          const supportLink = doc.querySelector('a[href*="contact"], a[href*="support"], a[href*="donate"]');
          return {
            heading: supportLink ? 'Support' : '',
            body: '',
            buttonLabel: String(supportLink?.textContent || '').trim(),
            buttonUrl: String(supportLink?.getAttribute('href') || '').trim(),
          };
        }

        if (definition.id === 'site_announcement') {
          const firstNotice = doc.querySelector('.alert, [role="status"], [data-announcement], main p');
          return {
            heading: 'Announcement',
            body: String(firstNotice?.textContent || '').trim(),
            buttonLabel: '',
            buttonUrl: '',
          };
        }

        return {};
      }

      async function loadPageSourceContent(definition) {
        if (!definition?.id || !definition?.path || state.pageSourceContent[definition.id]) {
          return;
        }

        try {
          const response = await fetch(definition.path, { credentials: 'same-origin' });
          if (!response.ok) {
            return;
          }
          const html = await response.text();
          state.pageSourceContent[definition.id] = extractPageSourceContent(html);
        } catch {
          state.pageSourceContent[definition.id] = {};
        }
      }

      async function loadCurrentTargetSourceContent() {
        if (targetType.value === 'page') {
          const selected = state.pageDefinitions.find((item) => item.id === targetId.value);
          await loadPageSourceContent(selected);
          return;
        }

        const selected = state.elementDefinitions.find((item) => item.id === targetId.value);
        if (!selected?.id || state.elementSourceContent[selected.id]) {
          return;
        }

        try {
          const response = await fetch('/index.html', { credentials: 'same-origin' });
          if (!response.ok) {
            state.elementSourceContent[selected.id] = {};
            return;
          }
          const html = await response.text();
          state.elementSourceContent[selected.id] = extractElementSourceContent(selected, html);
        } catch {
          state.elementSourceContent[selected.id] = {};
        }
      }

      function getCurrentContent() {
        const isPage = targetType.value === 'page';
        if (!state.workspace) return {};
        const workspaceContent = isPage ? (state.workspace.pages[targetId.value] || {}) : (state.workspace.elements[targetId.value] || {});
        if (isPage) {
          const sourceContent = state.pageSourceContent[targetId.value] || {};
          if (!hasPageContent(workspaceContent)) {
            return sourceContent;
          }
          return Object.fromEntries(
            ['seoTitle', 'metaDescription', 'heroHeadline', 'heroBody', 'heroHeadlineSecondary', 'heroBodySecondary', 'ctaLabel', 'ctaUrl', 'allStaticContent']
              .map((field) => [field, workspaceContent[field] || sourceContent[field] || '']),
          );
        }
        const sourceContent = state.elementSourceContent[targetId.value] || {};
        if (!hasElementContent(workspaceContent)) {
          return sourceContent;
        }
        return Object.fromEntries(
          ['heading', 'body', 'buttonLabel', 'buttonUrl']
            .map((field) => [field, workspaceContent[field] || sourceContent[field] || '']),
        );
      }

      async function fillForm() {
        await loadCurrentTargetSourceContent();
        const content = getCurrentContent();
        Object.entries(fields).forEach(([key, node]) => {
          node.value = content[key] || '';
        });

        const isPage = targetType.value === 'page';
        const source = isPage ? state.pageDefinitions : state.elementDefinitions;
        const selected = source.find((item) => item.id === targetId.value);
        editorTitle.textContent = selected ? `Editing: ${selected.label}` : 'Editor';
        updatePagePreview();

        if (state.workspace?.updatedAt) {
          const by = state.workspace.updatedBy ? ` by ${state.workspace.updatedBy}` : '';
          lastUpdatedMeta.textContent = `Last saved ${new Date(state.workspace.updatedAt).toLocaleString()}${by}.`;
        }
      }

      async function loadSession() {
        try {
          const session = await request('/api/admin-session');
          sessionMeta.textContent = `Signed in as ${session.user?.username || 'admin'}.`;
        } catch (error) {
          window.location.href = '/admin.html';
        }
      }

      async function loadWorkspace() {
        const payload = await request('/api/admin-static-content');
        state.pageDefinitions = payload.pageDefinitions || [];
        state.elementDefinitions = payload.elementDefinitions || [];
        state.workspace = payload.workspace || { pages: {}, elements: {} };
        setTargetOptions();
      }

      editorForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessage(saveMessage);
        clearMessage(errorMessage);
        try {
          const isPage = targetType.value === 'page';
          const content = isPage
            ? {
                seoTitle: fields.seoTitle.value,
                metaDescription: fields.metaDescription.value,
                heroHeadline: fields.heroHeadline.value,
                heroBody: fields.heroBody.value,
                heroHeadlineSecondary: fields.heroHeadlineSecondary.value,
                heroBodySecondary: fields.heroBodySecondary.value,
                ctaLabel: fields.ctaLabel.value,
                ctaUrl: fields.ctaUrl.value,
                allStaticContent: fields.allStaticContent.value,
              }
            : {
                heading: fields.heading.value,
                body: fields.body.value,
                buttonLabel: fields.buttonLabel.value,
                buttonUrl: fields.buttonUrl.value,
              };

          const payload = await request('/api/admin-static-content', {
            method: 'PUT',
            body: JSON.stringify({
              targetType: isPage ? 'page' : 'element',
              targetId: targetId.value,
              content,
            }),
          });

          state.workspace = payload.workspace;
          void fillForm();
          showMessage(saveMessage, 'Static content saved.');
        } catch (error) {
          showMessage(errorMessage, error.message);
        }
      });

      copyJsonButton.addEventListener('click', async () => {
        try {
          const content = getCurrentContent();
          await navigator.clipboard.writeText(JSON.stringify(content, null, 2));
          showMessage(saveMessage, 'Copied JSON payload to clipboard.');
          clearMessage(errorMessage);
        } catch (error) {
          showMessage(errorMessage, 'Could not copy to clipboard in this browser.');
        }
      });

      targetType.addEventListener('change', setTargetOptions);
      targetId.addEventListener('change', () => {
        void fillForm();
      });

      Promise.all([loadSession(), loadWorkspace()]).catch((error) => {
        showMessage(errorMessage, error.message || 'Failed to load workspace.');
      });
    </script>
  </body>
</html>
