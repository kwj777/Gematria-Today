<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amillennialism Article 1 Graphic</title>
  <desc id="desc">A 16 by 9 header graphic for the article What Is Amillennialism? featuring a crown, timeline, and calm theological design.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g opacity="0.08">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- top label -->
  <g transform="translate(110 92)" filter="url(#cardShadow)">
    <rect x="0" y="0" rx="28" ry="28" width="245" height="62" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="30" cy="31" r="7" fill="#c084fc"/>
    <text x="52" y="39" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.5">PART 1</text>
  </g>

  <!-- main title -->
  <g transform="translate(108 220)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800">What Is</text>
    <text x="0" y="108" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800">Amillennialism?</text>
    <text x="4" y="180" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">Christ’s present reign and the symbolic millennium</text>
  </g>

  <!-- timeline -->
  <g transform="translate(112 640)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
    <g>
      <circle cx="80" cy="0" r="14" fill="#93c5fd"/>
      <circle cx="80" cy="0" r="28" fill="#93c5fd" fill-opacity="0.12"/>
      <text x="22" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">First Coming</text>
    </g>
    <g>
      <circle cx="390" cy="0" r="14" fill="#c4b5fd"/>
      <circle cx="390" cy="0" r="32" fill="#c4b5fd" fill-opacity="0.14"/>
      <text x="322" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Church Age</text>
      <text x="306" y="88" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">“1000 years”</text>
    </g>
    <g>
      <circle cx="720" cy="0" r="14" fill="#fbbf24"/>
      <circle cx="720" cy="0" r="32" fill="#fbbf24" fill-opacity="0.14"/>
      <text x="657" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Second Coming</text>
    </g>
  </g>

  <!-- right-side visual -->
  <g transform="translate(1090 210)">
    <circle cx="165" cy="155" r="180" fill="#ffffff" fill-opacity="0.03"/>
    <circle cx="165" cy="155" r="132" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- crown -->
    <g transform="translate(76 34)" filter="url(#softGlow)">
      <path d="M24 184H230L210 92L158 138L126 58L94 138L42 92Z" fill="url(#gold)" stroke="#fde68a" stroke-width="4" stroke-linejoin="round"/>
      <rect x="34" y="184" width="186" height="36" rx="12" fill="url(#gold)" stroke="#fde68a" stroke-width="4"/>
      <circle cx="126" cy="95" r="10" fill="#fff7cc"/>
      <circle cx="64" cy="116" r="8" fill="#fff7cc"/>
      <circle cx="188" cy="116" r="8" fill="#fff7cc"/>
    </g>

    <!-- open book -->
    <g transform="translate(45 250)" filter="url(#cardShadow)">
      <path d="M0 56C0 22 22 0 56 0H152C187 0 208 15 218 33V174C206 159 186 150 152 150H56C22 150 0 172 0 206Z" fill="#f8fafc" fill-opacity="0.94"/>
      <path d="M436 56C436 22 414 0 380 0H284C249 0 228 15 218 33V174C230 159 250 150 284 150H380C414 150 436 172 436 206Z" fill="#f8fafc" fill-opacity="0.94"/>
      <path d="M218 33V206" stroke="#cbd5e1" stroke-width="4"/>
      <path d="M52 46H174M52 74H184M52 102H168M262 46H384M252 74H374M266 102H380" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- bottom-right badge -->
  <g transform="translate(1195 770)" filter="url(#cardShadow)">
    <rect x="0" y="0" rx="18" ry="18" width="270" height="58" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="28" y="38" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Amillennialism Series</text>
  </g>
</svg>
