<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amillennialism: What It Is and Isn’t — Hero Image</title>
  <desc id="desc">A 16 by 9 blog hero image matching the series style, highlighting what amillennialism is and is not.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#f8fafc" stroke-width="2" fill="none">
    <path d="M90 690 C360 620, 640 630, 900 600 C1120 575, 1320 495, 1520 410"/>
    <path d="M90 735 C370 670, 640 680, 910 650 C1130 625, 1335 550, 1520 460"/>
  </g>

  <g transform="translate(0,38)">
    <text x="84" y="94" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.8">AMILLENNIALISM SERIES</text>
    <text x="84" y="178" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Amillennialism:</text>
    <text x="84" y="252" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">What It Is and Isn’t</text>
    <text x="84" y="318" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="500">A clear guide to core claims and common misunderstandings</text>
  </g>

  <g transform="translate(84 560)" font-family="Inter, Arial, sans-serif" fill="#e2e8f0">
    <circle cx="20" cy="0" r="12" fill="#86efac"/>
    <text x="50" y="10" font-size="34" font-weight="700">Christ reigns now from heaven</text>
    <circle cx="20" cy="80" r="12" fill="#86efac"/>
    <text x="50" y="90" font-size="34" font-weight="700">The millennium is symbolic of this present age</text>
  </g>

  <g opacity="0.4" filter="url(#soft)">
    <rect x="1020" y="120" width="500" height="610" rx="22" fill="#f8fafc"/>
  </g>

  <g transform="translate(1045 145)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="450" height="270" rx="18" fill="#f8fafc" fill-opacity="0.94"/>
    <text x="34" y="66" fill="#166534" font-size="34" font-weight="800">WHAT IT IS</text>
    <line x1="34" y1="84" x2="416" y2="84" stroke="#86efac" stroke-width="5"/>
    <text x="34" y="138" fill="#334155" font-size="28" font-weight="600">• One return of Christ</text>
    <text x="34" y="186" fill="#334155" font-size="28" font-weight="600">• Resurrection and judgment</text>
    <text x="34" y="234" fill="#334155" font-size="28" font-weight="600">• Gospel hope for all nations</text>

    <rect x="0" y="305" width="450" height="270" rx="18" fill="#f8fafc" fill-opacity="0.9"/>
    <text x="34" y="371" fill="#991b1b" font-size="34" font-weight="800">WHAT IT ISN’T</text>
    <line x1="34" y1="389" x2="416" y2="389" stroke="#fca5a5" stroke-width="5"/>
    <text x="34" y="443" fill="#334155" font-size="28" font-weight="600">• No earthly utopia promised</text>
    <text x="34" y="491" fill="#334155" font-size="28" font-weight="600">• No denial of Christ’s return</text>
    <text x="34" y="539" fill="#334155" font-size="28" font-weight="600">• No loss of future resurrection</text>
  </g>
</svg>
