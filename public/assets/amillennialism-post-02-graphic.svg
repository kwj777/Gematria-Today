<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How It Became Mainstream</title>
  <desc id="desc">A 16 by 9 header graphic for article 2 in the Amillennialism series.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#93c5fd" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.08">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <g transform="translate(110 92)" filter="url(#cardShadow)">
    <rect x="0" y="0" rx="28" ry="28" width="245" height="62" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="30" cy="31" r="7" fill="#34d399"/>
    <text x="52" y="39" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.5">PART 2</text>
  </g>

  <g transform="translate(108 220)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800">How It Became</text>
    <text x="0" y="108" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800">Mainstream</text>
    <text x="4" y="180" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500">From Justin to Augustine to the Reformation</text>
  </g>

  <g transform="translate(112 640)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
    <g>
      <circle cx="80" cy="0" r="14" fill="#93c5fd"/>
      <circle cx="80" cy="0" r="28" fill="#93c5fd" fill-opacity="0.12"/>
      <text x="34" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Article</text>
    </g>
    <g>
      <circle cx="390" cy="0" r="14" fill="#34d399"/>
      <circle cx="390" cy="0" r="32" fill="#34d399" fill-opacity="0.14"/>
      <text x="335" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Series</text>
      <text x="308" y="88" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Theology and Scripture</text>
    </g>
    <g>
      <circle cx="720" cy="0" r="14" fill="#34d399"/>
      <circle cx="720" cy="0" r="32" fill="#34d399" fill-opacity="0.14"/>
      <text x="677" y="56" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Hope</text>
    </g>
  </g>

  
        <g transform="translate(1125 220)">
          <circle cx="160" cy="160" r="180" fill="#ffffff" fill-opacity="0.03"/>
          <circle cx="160" cy="160" r="132" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
          <g transform="translate(18 46)">
            <line x1="22" y1="226" x2="286" y2="38" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
            <circle cx="38" cy="214" r="24" fill="#34d399" fill-opacity="0.95"/>
            <circle cx="148" cy="138" r="22" fill="#93c5fd" fill-opacity="0.95"/>
            <circle cx="272" cy="50" r="20" fill="#34d399" fill-opacity="0.95"/>
            <path d="M258 50h50" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
            <path d="M286 22l28 28-28 28" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g transform="translate(38 322)">
            <rect x="0" y="0" rx="18" width="250" height="72" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
            <text x="26" y="45" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Church History</text>
          </g>
        </g>
        

  <g transform="translate(1195 770)" filter="url(#cardShadow)">
    <rect x="0" y="0" rx="18" ry="18" width="270" height="58" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="28" y="38" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Amillennialism Series</text>
  </g>
</svg>