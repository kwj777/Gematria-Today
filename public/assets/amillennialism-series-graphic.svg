<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amillennialism Series Graphic</title>
  <desc id="desc">A 16 by 9 title graphic for an Amillennialism blog series featuring a radiant horizon, crown, cross, and timeline motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#18233f"/>
      <stop offset="100%" stop-color="#2d1f38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#f8cf70" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#f8cf70" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f8cf70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2bd"/>
      <stop offset="45%" stop-color="#f1c96a"/>
      <stop offset="100%" stop-color="#c38a2f"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1c96a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f1c96a" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#f1c96a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f1c96a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="220" height="220" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="28" r="1.2" fill="#ffffff" opacity="0.5"/>
      <circle cx="120" cy="65" r="1.4" fill="#ffffff" opacity="0.55"/>
      <circle cx="190" cy="30" r="1" fill="#ffffff" opacity="0.35"/>
      <circle cx="80" cy="150" r="1.3" fill="#ffffff" opacity="0.4"/>
      <circle cx="165" cy="180" r="1.1" fill="#ffffff" opacity="0.45"/>
      <circle cx="25" cy="195" r="0.9" fill="#ffffff" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#stars)" opacity="0.6"/>

  <!-- Atmosphere glow -->
  <ellipse cx="800" cy="500" rx="500" ry="260" fill="url(#glow)"/>

  <!-- Radiant rays -->
  <g opacity="0.16" transform="translate(800 500)">
    <rect x="-4" y="-420" width="8" height="420" fill="#ffe7a8" transform="rotate(-58)"/>
    <rect x="-3" y="-420" width="6" height="420" fill="#ffe7a8" transform="rotate(-40)"/>
    <rect x="-3" y="-440" width="6" height="440" fill="#ffe7a8" transform="rotate(-22)"/>
    <rect x="-3" y="-460" width="6" height="460" fill="#ffe7a8" transform="rotate(0)"/>
    <rect x="-3" y="-440" width="6" height="440" fill="#ffe7a8" transform="rotate(22)"/>
    <rect x="-3" y="-420" width="6" height="420" fill="#ffe7a8" transform="rotate(40)"/>
    <rect x="-4" y="-420" width="8" height="420" fill="#ffe7a8" transform="rotate(58)"/>
  </g>

  <!-- Horizon -->
  <path d="M0 610 C280 565, 470 555, 800 575 C1120 594, 1320 580, 1600 535 L1600 900 L0 900 Z" fill="#101726"/>
  <path d="M0 655 C310 620, 535 628, 800 640 C1120 653, 1355 628, 1600 602 L1600 900 L0 900 Z" fill="#151d30" opacity="0.95"/>

  <!-- Timeline motif -->
  <g transform="translate(210 760)">
    <line x1="0" y1="0" x2="1180" y2="0" stroke="url(#lineGrad)" stroke-width="4"/>
    <circle cx="160" cy="0" r="8" fill="#f1c96a"/>
    <circle cx="590" cy="0" r="10" fill="#f1c96a"/>
    <circle cx="1020" cy="0" r="8" fill="#f1c96a"/>
    <g fill="#d6d8df" font-family="Georgia, 'Times New Roman', serif" font-size="24" opacity="0.95">
      <text x="106" y="42">First Coming</text>
      <text x="502" y="42">Church Age</text>
      <text x="958" y="42">Return of Christ</text>
    </g>
  </g>

  <!-- Crown and cross emblem -->
  <g transform="translate(800 350)" filter="url(#softGlow)">
    <path d="M-118 82 L-84 -8 L-25 38 L0 -42 L25 38 L84 -8 L118 82" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-128" y="82" width="256" height="36" rx="18" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <rect x="-10" y="-104" width="20" height="122" fill="url(#gold)" rx="8"/>
    <rect x="-54" y="-62" width="108" height="20" fill="url(#gold)" rx="8"/>
  </g>

  <!-- Main title -->
  <g text-anchor="middle">
    <text x="800" y="220" fill="#f8f2df" font-family="Georgia, 'Times New Roman', serif" font-size="32" letter-spacing="6">THEOLOGY SERIES</text>
    <text x="800" y="500" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700">Amillennialism</text>
    <text x="800" y="578" fill="#eed7a2" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-style="italic">Christ Reigns Now · Hope Awaits Fulfillment</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="460" y="618" width="680" height="3" rx="2" fill="#f1c96a" opacity="0.75"/>

  <!-- Corner framing -->
  <g stroke="#e8c777" stroke-opacity="0.35" fill="none" stroke-width="3">
    <path d="M54 54 H180 M54 54 V144"/>
    <path d="M1546 54 H1420 M1546 54 V144"/>
    <path d="M54 846 H180 M54 846 V756"/>
    <path d="M1546 846 H1420 M1546 846 V756"/>
  </g>
</svg>
