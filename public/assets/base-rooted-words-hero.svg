<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Base-Rooted Words hero image</title>
  <desc id="desc">Hero illustration for a post about base-rooted words. The word HEAVEN is shown reducing to a digital root that matches the active base across three English gematria ciphers: base 6 total 330 reduces to 6, base 2 total 110 reduces to 2, and base 1 total 55 reduces to 1.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1500" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A1C"/>
      <stop offset="0.5" stop-color="#181E4A"/>
      <stop offset="1" stop-color="#2B1156"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 380) rotate(118) scale(540 620)">
      <stop stop-color="#7EE7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7EE7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 740) rotate(28) scale(460 320)">
      <stop stop-color="#B77DFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 450) scale(140)">
      <stop stop-color="#A8FFE0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#A8FFE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7FE6CF"/>
      <stop offset="1" stop-color="#4FBFB0"/>
    </linearGradient>
    <linearGradient id="rowGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7FE6CF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7FE6CF" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#7FE6CF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7FE6CF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .ring { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 2; }
      .ringHot { fill: none; stroke: rgba(168,255,224,.38); stroke-width: 2.5; stroke-dasharray: 4 6; }
      .axis { stroke: rgba(180,206,255,.18); }
      .label { fill: rgba(221,231,255,.9); font: 700 24px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing: .18em; }
      .formula { fill: #DDEBFF; font: 600 26px 'JetBrains Mono','Menlo',monospace; }
      .formulaDim { fill: rgba(188,232,255,.55); font: 600 22px 'JetBrains Mono','Menlo',monospace; }
      .callout { fill: #9BF2FF; font: 800 48px 'Inter','Segoe UI',Arial,sans-serif; }
      .calloutMint { fill: #A8FFE0; font: 800 48px 'Inter','Segoe UI',Arial,sans-serif; }
      .arcDigit { fill: rgba(213,230,255,.45); font: 600 18px 'JetBrains Mono','Menlo',monospace; letter-spacing: .3em; }
      .headline { fill: #FFFFFF; font: 800 78px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing: -.02em; }
      .sub { fill: rgba(235,241,255,.92); font: 500 28px 'Inter','Segoe UI',Arial,sans-serif; }
      .chip { fill: rgba(22,27,62,.72); stroke: rgba(168,200,255,.35); stroke-width: 1.5; }
      .chipText { fill: #EAF4FF; font: 600 22px 'Inter','Segoe UI',Arial,sans-serif; }
      .stampText { fill: #07221A; font: 800 20px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing: .16em; }
      .stampSub { fill: rgba(235,241,255,.78); font: 600 20px 'Inter','Segoe UI',Arial,sans-serif; }
      .equals { fill: rgba(168,255,224,.55); font: 600 22px 'JetBrains Mono','Menlo',monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#cyanGlow)"/>
  <rect width="1600" height="900" fill="url(#violetGlow)"/>

  <!-- Right-side decorative rings, centered at (1240, 450) -->
  <g opacity=".9">
    <circle class="ring" cx="1240" cy="450" r="320"/>
    <circle class="ring" cx="1240" cy="450" r="240"/>
    <circle class="ringHot" cx="1240" cy="450" r="160"/>
    <circle class="ring" cx="1240" cy="450" r="84"/>
    <line class="axis" x1="920" y1="450" x2="1560" y2="450"/>
    <line class="axis" x1="1240" y1="130" x2="1240" y2="770"/>
  </g>

  <circle cx="1240" cy="450" r="14" fill="url(#centerGlow)"/>
  <circle cx="1240" cy="450" r="5" fill="#A8FFE0"/>

  <!-- Decorative digits along inner ring arcs (placed to avoid the calc rows) -->
  <g>
    <text class="arcDigit" x="1175" y="158" text-anchor="middle">6 · 3 · 9 · 6 · 3 · 9</text>
    <text class="arcDigit" x="1300" y="158" text-anchor="middle"></text>
    <text class="arcDigit" x="1240" y="772" text-anchor="middle">2 · 4 · 8 · 7 · 5 · 1</text>
  </g>

  <!-- Subtle row glow behind each calculation row -->
  <rect x="820" y="232" width="780" height="64" rx="32" fill="url(#rowGlow)"/>
  <rect x="820" y="432" width="780" height="64" rx="32" fill="url(#rowGlow)"/>
  <rect x="820" y="632" width="780" height="64" rx="32" fill="url(#rowGlow)"/>

  <!-- BASE 6 row -->
  <g>
    <text class="label" x="840" y="220">BASE 6</text>
    <text class="formula" x="840" y="278">HEAVEN = 330</text>
    <text class="equals" x="1112" y="278">→</text>
    <text class="formulaDim" x="1140" y="278">3 + 3 + 0 =</text>
    <text class="callout" x="1326" y="284">6</text>
  </g>

  <!-- BASE 2 row -->
  <g>
    <text class="label" x="840" y="420">BASE 2</text>
    <text class="formula" x="840" y="478">HEAVEN = 110</text>
    <text class="equals" x="1112" y="478">→</text>
    <text class="formulaDim" x="1140" y="478">1 + 1 + 0 =</text>
    <text class="callout" x="1326" y="484">2</text>
  </g>

  <!-- BASE 1 row -->
  <g>
    <text class="label" x="840" y="620">BASE 1</text>
    <text class="formula" x="840" y="678">HEAVEN = 55</text>
    <text class="equals" x="1080" y="678">→</text>
    <text class="formulaDim" x="1108" y="678">5 + 5 = 10 →</text>
    <text class="callout" x="1326" y="684">1</text>
  </g>

  <!-- Left-side headline + chips -->
  <g>
    <text class="headline" x="90" y="260">Base-Rooted</text>
    <text class="headline" x="90" y="338">Words</text>
    <text class="sub" x="90" y="394">A word whose digital root tracks the</text>
    <text class="sub" x="90" y="430">active base — stable across every cipher.</text>
  </g>

  <g>
    <rect class="chip" x="90" y="490" width="360" height="58" rx="29"/>
    <circle cx="122" cy="519" r="6" fill="#7EE7FF"/>
    <text class="chipText" x="144" y="528">Cross-base root stability</text>

    <rect class="chip" x="90" y="564" width="430" height="58" rx="29"/>
    <circle cx="122" cy="593" r="6" fill="#B77DFF"/>
    <text class="chipText" x="144" y="602">Structural anchor, not coincidence</text>

    <rect class="chip" x="90" y="638" width="340" height="58" rx="29"/>
    <circle cx="122" cy="667" r="6" fill="#A8FFE0"/>
    <text class="chipText" x="144" y="676">Gematria beyond totals</text>
  </g>

  <!-- BASE-ROOTED stamp -->
  <g transform="translate(90 758)">
    <rect width="230" height="52" rx="26" fill="url(#stamp)"/>
    <text class="stampText" x="115" y="33" text-anchor="middle">BASE-ROOTED ✓</text>
    <text class="stampSub" x="246" y="33">HEAVEN · 330 = 6 + 54·6</text>
  </g>

  <!-- Decorative soft blobs -->
  <circle cx="1280" cy="92" r="56" fill="rgba(126,231,255,.2)" filter="url(#soft)"/>
  <circle cx="360" cy="810" r="74" fill="rgba(183,125,255,.2)" filter="url(#soft)"/>
</svg>
