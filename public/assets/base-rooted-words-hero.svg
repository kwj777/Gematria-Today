<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Base-Rooted Words hero image</title>
  <desc id="desc">Abstract gematria-themed hero with concentric number rings and highlighted digital roots for a post about base-rooted words.</desc>

  <defs>
    <linearGradient id="bg" x1="180" y1="120" x2="1460" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B1A"/>
      <stop offset="0.5" stop-color="#1A1F46"/>
      <stop offset="1" stop-color="#2A1152"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 250) rotate(124) scale(520 610)">
      <stop stop-color="#7EE7FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7EE7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 640) rotate(24) scale(410 300)">
      <stop stop-color="#B77DFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B77DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .ring { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 2; }
      .label { fill: rgba(221,231,255,.84); font: 700 30px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: .09em; }
      .digit { fill: rgba(213,230,255,.8); font: 600 26px 'JetBrains Mono', 'Menlo', monospace; }
      .callout { fill: #9BF2FF; font: 700 40px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: .1em; }
      .headline { fill: #FFFFFF; font: 800 88px 'Inter', 'Segoe UI', Arial, sans-serif; letter-spacing: -.02em; }
      .sub { fill: rgba(235,241,255,.92); font: 500 34px 'Inter', 'Segoe UI', Arial, sans-serif; }
      .chip { fill: rgba(22,27,62,.75); stroke: rgba(168,200,255,.35); stroke-width: 1.5; }
      .chipText { fill: #EAF4FF; font: 600 24px 'Inter', 'Segoe UI', Arial, sans-serif; }
      .formula { fill: #BCE8FF; font: 600 28px 'JetBrains Mono', 'Menlo', monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#violet)"/>

  <g opacity=".85">
    <circle class="ring" cx="1180" cy="448" r="292"/>
    <circle class="ring" cx="1180" cy="448" r="222"/>
    <circle class="ring" cx="1180" cy="448" r="152"/>
    <circle class="ring" cx="1180" cy="448" r="82"/>
    <line x1="888" y1="448" x2="1472" y2="448" stroke="rgba(180,206,255,.22)"/>
    <line x1="1180" y1="156" x2="1180" y2="740" stroke="rgba(180,206,255,.22)"/>
  </g>

  <g>
    <text class="label" x="1035" y="216">BASE 6</text>
    <text class="formula" x="970" y="258">ELON = 276 → 2+7+6 = 15 → 1+5 = </text>
    <text class="callout" x="1482" y="258">6</text>

    <text class="label" x="1035" y="410">BASE 1</text>
    <text class="formula" x="970" y="452">ELON = 46 → 4+6 = 10 → 1+0 = </text>
    <text class="callout" x="1465" y="452">1</text>

    <text class="label" x="1035" y="606">BASE 2</text>
    <text class="formula" x="970" y="648">ELON → digital root = </text>
    <text class="callout" x="1320" y="648">2</text>
  </g>

  <g opacity=".7">
    <text class="digit" x="950" y="360">6 3 9 6 3 9</text>
    <text class="digit" x="1210" y="360">1 1 1 1 1 1</text>
    <text class="digit" x="1060" y="540">2 4 8 7 5 1</text>
  </g>

  <g>
    <text class="headline" x="90" y="280">Base-Rooted Words</text>
    <text class="sub" x="90" y="342">A word whose digital root matches the active base</text>
    <text class="sub" x="90" y="386">revealing stable alignment across gematria systems</text>
  </g>

  <g>
    <rect class="chip" x="90" y="470" width="420" height="66" rx="33"/>
    <text class="chipText" x="132" y="513">Dynamic pattern analysis</text>

    <rect class="chip" x="90" y="554" width="520" height="66" rx="33"/>
    <text class="chipText" x="132" y="597">Cross-base digital-root stability</text>

    <rect class="chip" x="90" y="638" width="400" height="66" rx="33"/>
    <text class="chipText" x="132" y="681">Gematria beyond totals</text>
  </g>

  <circle cx="1220" cy="92" r="56" fill="rgba(126,231,255,.2)" filter="url(#soft)"/>
  <circle cx="430" cy="780" r="74" fill="rgba(183,125,255,.2)" filter="url(#soft)"/>
</svg>
