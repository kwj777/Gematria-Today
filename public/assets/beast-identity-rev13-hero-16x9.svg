<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Determining the Identity of the Beast - Revelation 13 hero artwork</title>
  <desc id="desc">A dramatic blue and gold abstract background with the number 666, linked words, and methodological callouts for English gematria, digital roots, and base-root words.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1B33"/>
      <stop offset="0.55" stop-color="#173E66"/>
      <stop offset="1" stop-color="#1F6AA4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 190) rotate(132) scale(520 360)">
      <stop stop-color="#F6CF62" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F6CF62" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#A7D7FF">
    <path d="M40 760C250 620 400 630 560 700C740 780 880 790 1050 700C1210 620 1350 620 1560 760" stroke-width="2"/>
    <path d="M40 620C250 480 400 490 560 560C740 640 880 650 1050 560C1210 480 1350 480 1560 620" stroke-width="2"/>
    <path d="M40 480C250 340 400 350 560 420C740 500 880 510 1050 420C1210 340 1350 340 1560 480" stroke-width="2"/>
  </g>

  <text x="120" y="180" fill="#F3FAFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Revelation 13 Methodology</text>
  <text x="120" y="240" fill="#D2E9FF" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Determining the Identity</text>
  <text x="120" y="320" fill="#D2E9FF" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">of the Beast</text>

  <rect x="120" y="390" width="860" height="72" rx="14" fill="#0F2947" fill-opacity="0.72" stroke="#6EC1FF"/>
  <text x="150" y="436" fill="#F6CF62" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">English Gematria + Digital Roots + Base-Root Words</text>

  <g>
    <circle cx="1240" cy="450" r="178" fill="#0A233B" fill-opacity="0.74" stroke="#F6CF62" stroke-width="3"/>
    <text x="1150" y="430" fill="#F6CF62" font-family="Georgia, Times New Roman, serif" font-size="56" font-weight="700">666</text>
    <text x="1110" y="470" fill="#DCEEFF" font-family="Inter, Arial, sans-serif" font-size="22">Count with method</text>
    <text x="1130" y="500" fill="#DCEEFF" font-family="Inter, Arial, sans-serif" font-size="22">not speculation</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#E7F4FF" font-weight="600">
    <rect x="120" y="520" width="390" height="86" rx="12" fill="#112D4C" fill-opacity="0.72" stroke="#6EC1FF"/>
    <text x="145" y="555">1) Count exact spellings</text>
    <text x="145" y="585" fill="#B5D9FF" font-size="18" font-weight="500">Transparent English baseline</text>

    <rect x="540" y="520" width="390" height="86" rx="12" fill="#112D4C" fill-opacity="0.72" stroke="#6EC1FF"/>
    <text x="565" y="555">2) Compare digital roots</text>
    <text x="565" y="585" fill="#B5D9FF" font-size="18" font-weight="500">Compressed consistency layer</text>

    <rect x="960" y="520" width="420" height="86" rx="12" fill="#112D4C" fill-opacity="0.72" stroke="#6EC1FF"/>
    <text x="985" y="555">3) Validate root-word families</text>
    <text x="985" y="585" fill="#B5D9FF" font-size="18" font-weight="500">Semantic control against bias</text>
  </g>

  <text x="120" y="760" fill="#BFDFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">endtimes.today/blog</text>
</svg>
