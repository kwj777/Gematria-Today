<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Beginner Gematria Checklist Hero</title>
  <desc id="desc">A glowing checklist beside numerical symbols over a cosmic gradient for a beginner gematria study guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#1b2752"/>
      <stop offset="100%" stop-color="#331a4d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffd56f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd56f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="100%" stop-color="#f5e6bf"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="280" r="340" fill="url(#halo)"/>

  <g opacity="0.28" fill="#bcd0ff" font-family="'Segoe UI', Arial, sans-serif" font-weight="600">
    <text x="180" y="170" font-size="64">3 • 7 • 12 • 40</text>
    <text x="1010" y="210" font-size="54">VALUE</text>
    <text x="1070" y="290" font-size="46">PATTERN</text>
    <text x="250" y="760" font-size="58">CONTEXT</text>
  </g>

  <g transform="translate(360 180)">
    <rect x="0" y="0" width="880" height="560" rx="34" fill="#11182f" opacity="0.45"/>
    <rect x="44" y="48" width="792" height="464" rx="24" fill="url(#panel)"/>

    <text x="92" y="122" fill="#2c2240" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700">Beginner Research Checklist</text>

    <g fill="#2c2240" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600">
      <text x="160" y="194">Define one research question</text>
      <text x="160" y="254">Lock spelling and variants</text>
      <text x="160" y="314">Build a themed word set</text>
      <text x="160" y="374">Record matches and non-matches</text>
      <text x="160" y="434">Test alternate explanations</text>
    </g>

    <g fill="none" stroke="#4c3b70" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="92" y="164" width="38" height="38" rx="8"/>
      <path d="M101 184l9 10 14-18"/>
      <rect x="92" y="224" width="38" height="38" rx="8"/>
      <path d="M101 244l9 10 14-18"/>
      <rect x="92" y="284" width="38" height="38" rx="8"/>
      <path d="M101 304l9 10 14-18"/>
      <rect x="92" y="344" width="38" height="38" rx="8"/>
      <path d="M101 364l9 10 14-18"/>
      <rect x="92" y="404" width="38" height="38" rx="8"/>
      <path d="M101 424l9 10 14-18"/>
    </g>
  </g>
</svg>
