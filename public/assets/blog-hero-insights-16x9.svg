<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gematria blog insights hero image</title>
  <desc id="desc">A modern, inviting blog hero illustration with glowing pathways, cards, and symbolic numbers that suggest discovery, learning, and deeper reading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="45%" stop-color="#1d2d5a"/>
      <stop offset="100%" stop-color="#3f235b"/>
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffd989" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f5a74e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5a74e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ed4ff"/>
      <stop offset="100%" stop-color="#ffd268"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g opacity="0.65" fill="#d8e9ff">
    <circle cx="120" cy="105" r="2"/><circle cx="188" cy="78" r="2"/><circle cx="301" cy="128" r="2"/>
    <circle cx="460" cy="83" r="2"/><circle cx="620" cy="146" r="2"/><circle cx="790" cy="89" r="2"/>
    <circle cx="955" cy="121" r="2"/><circle cx="1110" cy="70" r="2"/><circle cx="1274" cy="136" r="2"/>
    <circle cx="1430" cy="91" r="2"/><circle cx="1510" cy="148" r="2"/><circle cx="270" cy="815" r="2"/>
    <circle cx="438" cy="765" r="2"/><circle cx="1180" cy="790" r="2"/><circle cx="1480" cy="735" r="2"/>
  </g>

  <path d="M120 705 C340 560, 520 620, 700 520 C900 410, 1140 500, 1470 335"
        fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round" opacity="0.8" filter="url(#soft)"/>
  <path d="M145 748 C365 600, 548 664, 742 564 C930 468, 1152 548, 1442 390"
        fill="none" stroke="#9fe3ff" stroke-opacity="0.42" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(260 300)">
    <rect x="0" y="0" width="370" height="260" rx="22" fill="#f8fbff" opacity="0.92"/>
    <rect x="26" y="32" width="185" height="18" rx="9" fill="#2c4675" opacity="0.8"/>
    <rect x="26" y="68" width="305" height="10" rx="5" fill="#8ea3c9"/>
    <rect x="26" y="91" width="275" height="10" rx="5" fill="#9aaed1"/>
    <rect x="26" y="114" width="252" height="10" rx="5" fill="#9aaed1"/>
    <circle cx="300" cy="182" r="44" fill="#1f3b66"/>
    <text x="300" y="194" text-anchor="middle" fill="#ffd773" font-size="42" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="700">7</text>
  </g>

  <g transform="translate(720 228)" filter="url(#soft)">
    <rect x="0" y="0" width="520" height="320" rx="26" fill="#111d3d" stroke="#4a72a7" stroke-width="2" opacity="0.92"/>
    <g fill="#86d1ff" font-family="'Courier New', monospace" font-size="30" opacity="0.88">
      <text x="34" y="72">A=1   B=2   C=3</text>
      <text x="34" y="122">WORD   →   VALUE</text>
      <text x="34" y="172">LIGHT  →   444</text>
      <text x="34" y="222">TRUTH  →   777</text>
      <text x="34" y="272">HOPE   →   369</text>
    </g>
    <circle cx="440" cy="80" r="16" fill="#ffd277"/>
    <circle cx="472" cy="80" r="16" fill="#95e5ff"/>
  </g>

  <g transform="translate(1140 595)">
    <rect x="0" y="0" width="310" height="192" rx="18" fill="#fff2d9" opacity="0.95"/>
    <text x="30" y="62" fill="#71481f" font-size="34" font-family="Georgia, serif" font-weight="700">Read More</text>
    <rect x="30" y="90" width="248" height="11" rx="6" fill="#d39b57" opacity="0.8"/>
    <rect x="30" y="114" width="230" height="11" rx="6" fill="#deb274" opacity="0.8"/>
    <rect x="30" y="138" width="198" height="11" rx="6" fill="#deb274" opacity="0.8"/>
    <path d="M232 156 L272 156 L252 176 Z" fill="#a86e31"/>
  </g>

  <g fill="#ffd57f" font-family="Georgia, serif" font-size="72" font-weight="700" opacity="0.8" filter="url(#soft)">
    <text x="130" y="210">3</text>
    <text x="1340" y="246">9</text>
    <text x="990" y="700">12</text>
  </g>
</svg>
