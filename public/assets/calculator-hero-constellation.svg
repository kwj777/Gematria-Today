<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Word and phrase calculator hero artwork</title>
  <desc id="desc">Abstract celestial interface with letters, numbers, and connected nodes representing gematria analysis.</desc>
  <defs>
