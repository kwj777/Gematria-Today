<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drTitle drDesc">
  <title id="drTitle">Digital Roots and Gematria hero image</title>
  <desc id="drDesc">A nine-node digital root wheel surrounded by example totals that each reduce to a single-digit root.</desc>

  <defs>
    <linearGradient id="drBg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B22"/>
      <stop offset="0.55" stop-color="#101742"/>
      <stop offset="1" stop-color="#1B0E45"/>
    </linearGradient>

    <radialGradient id="drCenterGlow" cx="800" cy="490" r="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#F97316" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="drNode" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#243067"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>

    <linearGradient id="drNodeHot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="drAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <pattern id="drDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7AB8FF" fill-opacity="0.08"/>
    </pattern>

    <filter id="drGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#drBg)"/>
  <rect width="1600" height="900" fill="url(#drDots)"/>
  <circle cx="800" cy="490" r="320" fill="url(#drCenterGlow)"/>

  <!-- Title -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="688" y="62" width="224" height="38" rx="19" fill="#F97316" fill-opacity="0.18" stroke="#F97316" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="800" y="88" font-size="18" font-weight="700" fill="#FFB779" letter-spacing="3">NUMBER PATTERNS</text>
    <text x="800" y="158" font-size="62" font-weight="800" fill="#F4F8FF">Digital Roots</text>
    <text x="800" y="200" font-size="24" font-weight="500" fill="#9CC8FF">Pattern lens for gematria study</text>
  </g>

  <!-- Spokes -->
  <g stroke="#7ED9FF" stroke-opacity="0.18" stroke-width="1">
    <line x1="800" y1="490" x2="800" y2="290"/>
    <line x1="800" y1="490" x2="928.6" y2="336.8"/>
    <line x1="800" y1="490" x2="997.0" y2="455.3"/>
    <line x1="800" y1="490" x2="973.2" y2="590.0"/>
    <line x1="800" y1="490" x2="868.4" y2="677.9"/>
    <line x1="800" y1="490" x2="731.6" y2="677.9"/>
    <line x1="800" y1="490" x2="626.8" y2="590.0"/>
    <line x1="800" y1="490" x2="603.0" y2="455.3"/>
    <line x1="800" y1="490" x2="671.4" y2="336.8"/>
  </g>

  <!-- Outer dashed ring -->
  <circle cx="800" cy="490" r="200" stroke="#7ED9FF" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 9" fill="none"/>
  <circle cx="800" cy="490" r="118" stroke="#7ED9FF" stroke-opacity="0.28" stroke-width="1" fill="none"/>

  <!-- Nine numbered nodes (1–9 clockwise from top) -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-weight="700" text-anchor="middle">
    <g>
      <circle cx="800" cy="290" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="800" y="306" font-size="36" fill="#E6F2FF">1</text>
    </g>
    <g>
      <circle cx="928.6" cy="336.8" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="928.6" y="352.8" font-size="36" fill="#E6F2FF">2</text>
    </g>
    <g>
      <circle cx="997.0" cy="455.3" r="44" fill="url(#drNodeHot)" stroke="#FFE6A8" stroke-opacity="0.9" stroke-width="1.5" filter="url(#drGlow)"/>
      <text x="997.0" y="471.3" font-size="36" fill="#1B0E45">3</text>
    </g>
    <g>
      <circle cx="973.2" cy="590.0" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="973.2" y="606.0" font-size="36" fill="#E6F2FF">4</text>
    </g>
    <g>
      <circle cx="868.4" cy="677.9" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="868.4" y="693.9" font-size="36" fill="#E6F2FF">5</text>
    </g>
    <g>
      <circle cx="731.6" cy="677.9" r="44" fill="url(#drNodeHot)" stroke="#FFE6A8" stroke-opacity="0.9" stroke-width="1.5" filter="url(#drGlow)"/>
      <text x="731.6" y="693.9" font-size="36" fill="#1B0E45">6</text>
    </g>
    <g>
      <circle cx="626.8" cy="590.0" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="626.8" y="606.0" font-size="36" fill="#E6F2FF">7</text>
    </g>
    <g>
      <circle cx="603.0" cy="455.3" r="44" fill="url(#drNode)" stroke="#7ED9FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="603.0" y="471.3" font-size="36" fill="#E6F2FF">8</text>
    </g>
    <g>
      <circle cx="671.4" cy="336.8" r="44" fill="url(#drNodeHot)" stroke="#FFE6A8" stroke-opacity="0.9" stroke-width="1.5" filter="url(#drGlow)"/>
      <text x="671.4" y="352.8" font-size="36" fill="#1B0E45">9</text>
    </g>
  </g>

  <!-- Center hub -->
  <g>
    <circle cx="800" cy="490" r="74" fill="#0B1230" stroke="url(#drAccent)" stroke-width="2"/>
    <circle cx="800" cy="490" r="58" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="700">
      <text x="800" y="481" font-size="15" fill="#FBBF24" letter-spacing="2">DIGITAL</text>
      <text x="800" y="508" font-size="15" fill="#FBBF24" letter-spacing="3">ROOT</text>
    </g>
  </g>

  <!-- Left examples -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="start">
    <g transform="translate(110 410)">
      <text x="0" y="0" font-size="50" font-weight="700" fill="#FBBF24">147</text>
      <text x="0" y="36" font-size="20" fill="#9BE0FF">1 + 4 + 7 = 12</text>
      <text x="0" y="62" font-size="20" fill="#9BE0FF">1 + 2 = <tspan fill="#F97316" font-weight="700">3</tspan></text>
    </g>
    <g transform="translate(110 590)">
      <text x="0" y="0" font-size="50" font-weight="700" fill="#FBBF24">528</text>
      <text x="0" y="36" font-size="20" fill="#9BE0FF">5 + 2 + 8 = 15</text>
      <text x="0" y="62" font-size="20" fill="#9BE0FF">1 + 5 = <tspan fill="#F97316" font-weight="700">6</tspan></text>
    </g>
  </g>

  <!-- Right examples -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="end">
    <g transform="translate(1490 410)">
      <text x="0" y="0" font-size="50" font-weight="700" fill="#FBBF24">396</text>
      <text x="0" y="36" font-size="20" fill="#9BE0FF">3 + 9 + 6 = 18</text>
      <text x="0" y="62" font-size="20" fill="#9BE0FF">1 + 8 = <tspan fill="#F97316" font-weight="700">9</tspan></text>
    </g>
    <g transform="translate(1490 590)">
      <text x="0" y="0" font-size="50" font-weight="700" fill="#FBBF24">282</text>
      <text x="0" y="36" font-size="20" fill="#9BE0FF">2 + 8 + 2 = 12</text>
      <text x="0" y="62" font-size="20" fill="#9BE0FF">1 + 2 = <tspan fill="#F97316" font-weight="700">3</tspan></text>
    </g>
  </g>

  <!-- Connector curves from examples to their root nodes -->
  <g stroke="#F97316" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="4 6" fill="none">
    <path d="M 250 430 C 450 380, 750 320, 957 440"/>
    <path d="M 250 610 C 430 660, 600 700, 691 668"/>
    <path d="M 1350 430 C 1150 380, 850 300, 695 318"/>
    <path d="M 1350 610 C 1180 650, 1080 540, 967 450"/>
  </g>

  <!-- Footer caption -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="830" font-size="22" fill="#9CC8FF" fill-opacity="0.9">Every total collapses to one of nine roots — a structural signature for pattern study.</text>
  </g>
</svg>
