<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">EndTimes website feature overview</title>
  <desc id="desc">A simplified promotional graphic highlighting five EndTimes.Today features: unified research workspace, gematria tools, name comparison, integrated news monitoring, and guided learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#214f86"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd36b"/>
      <stop offset="100%" stop-color="#ff9a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07101f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1045" cy="110" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="160" cy="780" r="180" fill="#ffd36b" opacity="0.08"/>

  <rect x="74" y="64" width="1052" height="772" rx="34" fill="#102240" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>

  <g transform="translate(116 146)">
    <rect x="0" y="0" width="968" height="96" rx="24" fill="#163156" stroke="#5f82b1" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="54" cy="48" r="22" fill="#ffd36b"/>
    <text x="54" y="56" text-anchor="middle" fill="#102240" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">01</text>
    <text x="100" y="40" fill="#ffffff" font-size="31" font-family="Georgia, serif" font-weight="700">Unified research workspace</text>
    <text x="100" y="69" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Explore words, names, patterns, blog content, and news from one organized hub.</text>
  </g>

  <g transform="translate(116 264)">
    <rect x="0" y="0" width="968" height="96" rx="24" fill="#163156" stroke="#5f82b1" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="54" cy="48" r="22" fill="#ffd36b"/>
    <text x="54" y="56" text-anchor="middle" fill="#102240" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">02</text>
    <text x="100" y="40" fill="#ffffff" font-size="31" font-family="Georgia, serif" font-weight="700">Practical gematria tools</text>
    <text x="100" y="69" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Calculate values quickly and continue into roots, related words, and interpretation paths.</text>
  </g>

  <g transform="translate(116 382)">
    <rect x="0" y="0" width="968" height="96" rx="24" fill="#163156" stroke="#5f82b1" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="54" cy="48" r="22" fill="#ffd36b"/>
    <text x="54" y="56" text-anchor="middle" fill="#102240" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">03</text>
    <text x="100" y="40" fill="#ffffff" font-size="31" font-family="Georgia, serif" font-weight="700">Fast side-by-side name comparison</text>
    <text x="100" y="69" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Compare up to three names, inspect shared totals, and jump to related result pages.</text>
  </g>

  <g transform="translate(116 500)">
    <rect x="0" y="0" width="968" height="96" rx="24" fill="#163156" stroke="#5f82b1" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="54" cy="48" r="22" fill="#ffd36b"/>
    <text x="54" y="56" text-anchor="middle" fill="#102240" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">04</text>
    <text x="100" y="40" fill="#ffffff" font-size="31" font-family="Georgia, serif" font-weight="700">Integrated news monitoring</text>
    <text x="100" y="69" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Track featured stories and configured feeds without leaving the same workspace.</text>
  </g>

  <g transform="translate(116 618)">
    <rect x="0" y="0" width="968" height="96" rx="24" fill="#163156" stroke="#5f82b1" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="54" cy="48" r="22" fill="#ffd36b"/>
    <text x="54" y="56" text-anchor="middle" fill="#102240" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">05</text>
    <text x="100" y="40" fill="#ffffff" font-size="31" font-family="Georgia, serif" font-weight="700">Guided learning through blog + FAQ</text>
    <text x="100" y="69" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Learn a clearer workflow for grouping ideas, comparing themes, and interpreting results.</text>
  </g>
</svg>
