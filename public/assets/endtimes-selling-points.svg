<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">EndTimes website top selling points</title>
  <desc id="desc">A 1200 by 900 promotional graphic highlighting the EndTimes website's five strongest selling points: unified research workspace, gematria tools, name comparison, integrated news monitoring, and guided learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081122"/>
      <stop offset="52%" stop-color="#17376a"/>
      <stop offset="100%" stop-color="#f3a43b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d39" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1b3564" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd36b"/>
      <stop offset="100%" stop-color="#ff9a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#07101f" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity="0.28">
    <circle cx="140" cy="120" r="3" fill="#fff4c8"/>
    <circle cx="220" cy="80" r="2.5" fill="#9fd4ff"/>
    <circle cx="320" cy="145" r="2.5" fill="#fff4c8"/>
    <circle cx="465" cy="96" r="2.5" fill="#9fd4ff"/>
    <circle cx="585" cy="72" r="2.5" fill="#ffd470"/>
    <circle cx="760" cy="104" r="3" fill="#fff4c8"/>
    <circle cx="910" cy="78" r="2.5" fill="#9fd4ff"/>
    <circle cx="1080" cy="126" r="2.5" fill="#ffd470"/>
    <circle cx="152" cy="814" r="2.5" fill="#ffd470"/>
    <circle cx="1000" cy="820" r="2.5" fill="#fff4c8"/>
    <circle cx="1115" cy="755" r="2.5" fill="#9fd4ff"/>
  </g>

  <g opacity="0.24" stroke="#84bfff" stroke-width="2" fill="none">
    <path d="M40 220 C220 150, 350 165, 530 240"/>
    <path d="M510 170 C670 110, 870 118, 1135 230"/>
    <path d="M0 675 C260 605, 500 605, 760 695"/>
  </g>

  <rect x="68" y="58" width="1064" height="784" rx="36" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18" filter="url(#shadow)"/>

  <g transform="translate(108 106)">
    <text x="0" y="0" fill="#ffcf6e" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="4">ENDTIMES.TODAY</text>
    <text x="0" y="62" fill="#ffffff" font-size="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Top 5 selling points</text>
    <text x="0" y="104" fill="#d6e5ff" font-size="26" font-family="Arial, Helvetica, sans-serif">A unified workspace for research, comparison, interpretation, and current-event tracking.</text>
  </g>

  <g transform="translate(95 190)">
    <rect x="0" y="0" width="470" height="180" rx="28" fill="#112449" stroke="#355f98" filter="url(#shadow)"/>
    <circle cx="72" cy="64" r="34" fill="#15315d" stroke="#ffd36b" stroke-width="4"/>
    <rect x="50" y="46" width="18" height="44" rx="9" fill="#ffd36b"/>
    <rect x="77" y="34" width="18" height="67" rx="9" fill="#9fd4ff"/>
    <rect x="104" y="54" width="18" height="47" rx="9" fill="#ffad46"/>
    <text x="146" y="56" fill="#ffcf6e" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">01</text>
    <text x="146" y="94" fill="#ffffff" font-size="30" font-family="Georgia, serif" font-weight="700">Unified research workspace</text>
    <text x="146" y="132" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Explore words, names, patterns, blog content, and news</text>
    <text x="146" y="158" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">from one organized hub instead of juggling separate tools.</text>
  </g>

  <g transform="translate(635 190)">
    <rect x="0" y="0" width="470" height="180" rx="28" fill="#112449" stroke="#355f98" filter="url(#shadow)"/>
    <circle cx="72" cy="64" r="34" fill="#15315d" stroke="#ffd36b" stroke-width="4"/>
    <text x="52" y="74" fill="#ffd36b" font-size="34" font-family="Georgia, serif" font-weight="700">333</text>
    <text x="146" y="56" fill="#ffcf6e" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">02</text>
    <text x="146" y="94" fill="#ffffff" font-size="30" font-family="Georgia, serif" font-weight="700">Practical gematria tools</text>
    <text x="146" y="132" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Calculate values quickly, then continue into related words,</text>
    <text x="146" y="158" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">base-root context, and deeper interpretation paths.</text>
  </g>

  <g transform="translate(95 402)">
    <rect x="0" y="0" width="470" height="180" rx="28" fill="#112449" stroke="#355f98" filter="url(#shadow)"/>
    <circle cx="72" cy="64" r="34" fill="#15315d" stroke="#ffd36b" stroke-width="4"/>
    <text x="49" y="74" fill="#9fd4ff" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">A | B</text>
    <text x="146" y="56" fill="#ffcf6e" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">03</text>
    <text x="146" y="94" fill="#ffffff" font-size="30" font-family="Georgia, serif" font-weight="700">Fast side-by-side name comparison</text>
    <text x="146" y="132" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Compare up to three names, inspect matching totals,</text>
    <text x="146" y="158" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">and jump directly into related result pages.</text>
  </g>

  <g transform="translate(635 402)">
    <rect x="0" y="0" width="470" height="180" rx="28" fill="#112449" stroke="#355f98" filter="url(#shadow)"/>
    <circle cx="72" cy="64" r="34" fill="#15315d" stroke="#ffd36b" stroke-width="4"/>
    <circle cx="72" cy="64" r="16" fill="#9fd4ff"/>
    <ellipse cx="72" cy="64" rx="28" ry="12" fill="none" stroke="#ffd36b" stroke-width="3"/>
    <ellipse cx="72" cy="64" rx="12" ry="28" fill="none" stroke="#ffd36b" stroke-width="3"/>
    <text x="146" y="56" fill="#ffcf6e" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">04</text>
    <text x="146" y="94" fill="#ffffff" font-size="30" font-family="Georgia, serif" font-weight="700">Integrated news monitoring</text>
    <text x="146" y="132" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Track featured stories and configured RSS feeds without</text>
    <text x="146" y="158" fill="#d7e5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">leaving the same research environment.</text>
  </g>

  <g transform="translate(95 614)">
    <rect x="0" y="0" width="1010" height="156" rx="28" fill="#112449" stroke="#355f98" filter="url(#shadow)"/>
    <circle cx="72" cy="58" r="34" fill="#15315d" stroke="#ffd36b" stroke-width="4"/>
    <path d="M54 78h36l-4-48H58z" fill="#ffd36b"/>
    <line x1="63" y1="44" x2="82" y2="44" stroke="#112449" stroke-width="4"/>
    <line x1="63" y1="54" x2="86" y2="54" stroke="#112449" stroke-width="4"/>
    <text x="124" y="48" fill="#ffcf6e" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">05</text>
    <text x="124" y="86" fill="#ffffff" font-size="32" font-family="Georgia, serif" font-weight="700">Guided learning through blog + FAQ</text>
    <text x="124" y="120" fill="#d7e5ff" font-size="22" font-family="Arial, Helvetica, sans-serif">The site teaches a workflow — grouping related ideas, comparing themes, and learning how to interpret results with more context.</text>
  </g>

  <g transform="translate(740 92)" filter="url(#glow)">
    <circle cx="240" cy="86" r="64" fill="url(#gold)" opacity="0.28"/>
    <path d="M240 38l18 38 42 6-31 30 8 42-37-20-37 20 8-42-31-30 42-6z" fill="url(#gold)"/>
  </g>

  <g transform="translate(108 804)">
    <rect x="0" y="0" width="984" height="2" fill="#4f78b3" opacity="0.65"/>
    <text x="0" y="40" fill="#d6e5ff" font-size="20" font-family="Arial, Helvetica, sans-serif">Best for users who want research depth, guided interpretation, and current-event awareness in one destination.</text>
  </g>
</svg>
