<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Name calculator hero artwork</title>
  <desc id="desc">Stylized profile cards with connected names and gematria totals showing side-by-side comparisons.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123A67"/>
      <stop offset="0.5" stop-color="#245A8B"/>
      <stop offset="1" stop-color="#3D86BE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FCFF"/>
      <stop offset="1" stop-color="#DDEFFF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>

  <g opacity="0.25" stroke="#CBE7FF" stroke-width="2">
    <path d="M140 178H1460"/>
    <path d="M140 722H1460"/>
    <path d="M220 120V780"/>
    <path d="M800 90V810"/>
    <path d="M1380 120V780"/>
  </g>

  <g>
    <rect x="190" y="210" width="360" height="480" rx="24" fill="url(#card)"/>
    <rect x="620" y="170" width="360" height="560" rx="24" fill="url(#card)"/>
    <rect x="1050" y="230" width="360" height="450" rx="24" fill="url(#card)"/>
  </g>

  <g fill="#245A8B" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="700">
    <text x="248" y="290">NAME 1</text>
    <text x="678" y="250">NAME 2</text>
    <text x="1108" y="310">NAME 3</text>
  </g>

  <g fill="#174263" font-family="'Inter', 'Segoe UI', sans-serif" font-size="72" font-weight="800">
    <text x="280" y="420">144</text>
    <text x="710" y="400">216</text>
    <text x="1140" y="440">108</text>
  </g>

  <g stroke="#FFE5A3" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M550 420L620 400"/>
    <path d="M980 400L1050 420"/>
    <path d="M550 520L620 560"/>
    <path d="M980 560L1050 520"/>
  </g>

  <g fill="#FFE5A3">
    <circle cx="550" cy="420" r="10"/>
    <circle cx="620" cy="400" r="10"/>
    <circle cx="980" cy="400" r="10"/>
    <circle cx="1050" cy="420" r="10"/>
    <circle cx="550" cy="520" r="10"/>
    <circle cx="620" cy="560" r="10"/>
    <circle cx="980" cy="560" r="10"/>
    <circle cx="1050" cy="520" r="10"/>
  </g>

  <rect x="140" y="110" width="1320" height="680" rx="34" stroke="#D6EEFF" stroke-opacity="0.45" stroke-width="3"/>
</svg>
