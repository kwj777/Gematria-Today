<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">World news hero artwork</title>
  <desc id="desc">A broadcast-style world news scene with a globe, connected world map, skyline, landmarks, crisis imagery, and market graphics.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0b2d67"/>
      <stop offset="60%" stop-color="#2d79bf"/>
      <stop offset="100%" stop-color="#b6d8ff"/>
    </linearGradient>
    <linearGradient id="bannerRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#df0000"/>
      <stop offset="100%" stop-color="#7d0008"/>
    </linearGradient>
    <linearGradient id="bannerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#132f66"/>
      <stop offset="100%" stop-color="#061b45"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#88d9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#56a2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

