<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Origen to Augustine — Why the West Moved Away from Chiliasm</title>
  <desc id="desc">A 16 by 9 theological timeline hero image with warm glow and manuscript motif, tracing the move from Origen to Augustine and away from chiliasm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="42%" r="54%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g transform="translate(0,28)">
    <text x="84" y="94" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.8">AMILLENIALISM SERIES</text>
    <text x="84" y="178" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Origen to Augustine</text>
    <text x="84" y="252" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">in the Latin West</text>
    <text x="84" y="318" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="500">Why Western theology moved away from chiliasm</text>
  </g>

  <g opacity="0.2" stroke="#f8fafc" stroke-width="2" fill="none">
    <path d="M120 730 C360 610, 540 600, 760 620 C980 640, 1180 600, 1420 470"/>
    <path d="M120 770 C360 650, 550 640, 770 660 C990 680, 1200 640, 1440 520"/>
  </g>

  <g fill="#f8fafc" opacity="0.94">
    <circle cx="300" cy="646" r="14"/>
    <circle cx="820" cy="622" r="14"/>
    <circle cx="1320" cy="498" r="14"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#e2e8f0">
    <text x="234" y="696" font-size="34" font-weight="700">Origen</text>
    <text x="710" y="672" font-size="34" font-weight="700">4th-century shift</text>
    <text x="1214" y="548" font-size="34" font-weight="700">Augustine</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#cbd5e1">
    <text x="164" y="744" font-size="24">Allegorical trajectory gains momentum</text>
    <text x="700" y="710" font-size="24">Literal millennium expectation recedes</text>
    <text x="1108" y="586" font-size="24">Amillennial framing consolidates</text>
  </g>

  <g opacity="0.4" filter="url(#soft)">
    <rect x="1160" y="120" width="260" height="360" rx="16" fill="#f8fafc"/>
  </g>
  <g opacity="0.78">
    <rect x="1180" y="140" width="220" height="320" rx="12" fill="#f8fafc"/>
    <line x1="1210" y1="200" x2="1370" y2="200" stroke="#64748b" stroke-width="6"/>
    <line x1="1210" y1="245" x2="1370" y2="245" stroke="#94a3b8" stroke-width="4"/>
    <line x1="1210" y1="285" x2="1370" y2="285" stroke="#94a3b8" stroke-width="4"/>
    <line x1="1210" y1="325" x2="1335" y2="325" stroke="#94a3b8" stroke-width="4"/>
  </g>
</svg>
