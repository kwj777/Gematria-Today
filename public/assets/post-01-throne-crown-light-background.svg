      <path d="M0 0 L610 -185 L598 -132 Z"/>
      <path d="M0 0 L640 -65 L635 -15 Z"/>
      <path d="M0 0 L670 85 L630 114 Z"/>
      <path d="M0 0 L566 252 L526 272 Z"/>
      <path d="M0 0 L408 396 L373 408 Z"/>
      <path d="M0 0 L222 475 L190 482 Z"/>
      <path d="M0 0 L0 520 L42 476 Z"/>
      <path d="M0 0 L-222 475 L-190 482 Z"/>
      <path d="M0 0 L-408 396 L-373 408 Z"/>
      <path d="M0 0 L-566 252 L-526 272 Z"/>
      <path d="M0 0 L-670 85 L-630 114 Z"/>
    </g>
    <ellipse cx="800" cy="340" rx="500" ry="260" fill="url(#beamFade)" filter="url(#blurWide)"/>
  </g>

  <g opacity="0.34" filter="url(#blurSoft)">
    <g transform="translate(150 120)">
      <rect x="30" y="0" width="56" height="510" rx="16" fill="#efe1c4"/>
      <rect x="18" y="0" width="80" height="40" rx="16" fill="#ead7b1"/>
      <rect x="18" y="470" width="80" height="44" rx="16" fill="#e4d2ac"/>
      <path d="M42 42V470 M58 42V470 M74 42V470" stroke="#d9c59e" stroke-width="4" opacity="0.7"/>
    </g>
    <g transform="translate(1330 120)">
      <rect x="30" y="0" width="56" height="510" rx="16" fill="#efe1c4"/>
      <rect x="18" y="0" width="80" height="40" rx="16" fill="#ead7b1"/>
      <rect x="18" y="470" width="80" height="44" rx="16" fill="#e4d2ac"/>
      <path d="M42 42V470 M58 42V470 M74 42V470" stroke="#d9c59e" stroke-width="4" opacity="0.7"/>
    </g>
  </g>

  <ellipse cx="800" cy="735" rx="580" ry="100" fill="#fff6dd" opacity="0.6" filter="url(#blurWide)"/>

  <g filter="url(#shadow)">
    <path d="M530 640 H1070 L1036 685 H564 Z" fill="url(#step)"/>
    <path d="M598 585 H1002 L974 637 H626 Z" fill="url(#step)"/>
    <path d="M658 540 H942 L922 587 H678 Z" fill="url(#step)"/>
  </g>

  <g transform="translate(800 255)" filter="url(#shadow)">
    <ellipse cx="0" cy="40" rx="180" ry="200" fill="#fff3ce" opacity="0.35" filter="url(#blurWide)"/>

    <rect x="-122" y="-15" width="32" height="244" rx="10" fill="url(#goldDark)"/>
    <rect x="90" y="-15" width="32" height="244" rx="10" fill="url(#goldDark)"/>
    <rect x="-130" y="-30" width="48" height="24" rx="8" fill="url(#gold)"/>
    <rect x="82" y="-30" width="48" height="24" rx="8" fill="url(#gold)"/>

    <path d="M-56 -44 C-38 -68,-24 -74,0 -78 C24 -74,38 -68,56 -44 L34 -44 C23 -56,12 -61,0 -62 C-12 -61,-23 -56,-34 -44 Z" fill="url(#gold)"/>
    <circle cx="0" cy="-79" r="9" fill="#f9e8a0"/>
    <circle cx="-40" cy="-49" r="6" fill="#f5d676"/>
    <circle cx="40" cy="-49" r="6" fill="#f5d676"/>

    <path d="M-92 -6 Q-92 -48 -64 -48 H64 Q92 -48 92 -6 V167 H-92 Z" fill="url(#gold)"/>
    <path d="M-68 -18 Q-68 -34 -52 -34 H52 Q68 -34 68 -18 V132 Q68 148 52 148 H-52 Q-68 148 -68 132 Z" fill="url(#fabric)"/>

    <path d="M-145 88 Q-145 64 -122 64 H-92 V132 H-145 Z" fill="url(#gold)"/>
    <path d="M145 88 Q145 64 122 64 H92 V132 H145 Z" fill="url(#gold)"/>

    <rect x="-144" y="132" width="52" height="97" rx="8" fill="url(#gold)"/>
    <rect x="92" y="132" width="52" height="97" rx="8" fill="url(#gold)"/>

    <rect x="-86" y="132" width="172" height="58" rx="24" fill="url(#fabric)"/>
    <rect x="-100" y="180" width="200" height="48" rx="12" fill="url(#gold)"/>

    <g opacity="0.34" stroke="#fff1bf" stroke-width="3" fill="none">
      <path d="M-113 0 V220"/>
      <path d="M113 0 V220"/>
      <path d="M-48 -12 H48"/>
      <path d="M-138 152 H-98"/>
      <path d="M98 152 H138"/>
      <path d="M-64 204 H64"/>
    </g>
  </g>

  <g transform="translate(410 720)" filter="url(#shadow)">
    <ellipse cx="0" cy="38" rx="155" ry="34" fill="#ecd39d" opacity="0.3" filter="url(#blurSoft)"/>
    <path d="M-142 16 Q-116 -6 -94 12 Q-72 -18 -42 8 Q-10 -30 22 6 Q54 -18 86 12 Q112 -4 142 18 L124 66 Q66 84 0 84 Q-66 84 -124 66 Z" fill="url(#gold)" stroke="#d8ab4b" stroke-width="5"/>
    <path d="M-126 54 Q-62 68 0 68 Q62 68 126 54" fill="none" stroke="#b37f2e" stroke-width="4"/>
    <circle cx="-93" cy="12" r="8" fill="#ffeaa8"/>
    <circle cx="-42" cy="6" r="8" fill="#ffeaa8"/>
    <circle cx="22" cy="4" r="9" fill="#fff2c0"/>
    <circle cx="86" cy="12" r="8" fill="#ffeaa8"/>
    <circle cx="126" cy="18" r="7" fill="#ffeaa8"/>
    <g opacity="0.35" fill="none" stroke="#fff6d0" stroke-width="3">
      <path d="M-116 46 Q-58 58 0 58 Q58 58 116 46"/>
      <path d="M-104 28 Q-56 40 0 40 Q56 40 104 28"/>
