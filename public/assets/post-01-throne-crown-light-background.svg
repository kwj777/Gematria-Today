<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Post 01 background image in SVG</title>
  <desc id="desc">A soft, light background illustration with a throne, crown, and radiant beams for the first article in the Amillennialism series.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f3ea"/>
      <stop offset="55%" stop-color="#f7e8cf"/>
      <stop offset="100%" stop-color="#f4e2c2"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#fffef8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fff6dc" stop-opacity="0.98"/>
      <stop offset="72%" stop-color="#f6ddb1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4ede4" stop-opacity="0.95"/>
    </radialGradient>

    <radialGradient id="beamFade" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4c1"/>
      <stop offset="28%" stop-color="#f7db85"/>
      <stop offset="60%" stop-color="#d8a94d"/>
      <stop offset="100%" stop-color="#f2cb68"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be8530"/>
      <stop offset="100%" stop-color="#8d6122"/>
    </linearGradient>

    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b36a4c"/>
      <stop offset="100%" stop-color="#8d4f39"/>
    </linearGradient>

    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe6d8"/>
      <stop offset="100%" stop-color="#d8c7af"/>
    </linearGradient>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="blurWide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#9a6f2d" flood-opacity="0.22"/>
    </filter>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <ellipse cx="800" cy="360" rx="520" ry="250" fill="url(#centerGlow)" filter="url(#blurWide)"/>

  <g opacity="0.58">
    <g transform="translate(800 330)" fill="#fff8e6">
      <path d="M0 0 L-640 -65 L-635 -15 Z"/>
      <path d="M0 0 L-610 -185 L-598 -132 Z"/>
      <path d="M0 0 L-520 -310 L-500 -262 Z"/>
      <path d="M0 0 L-360 -390 L-326 -352 Z"/>
