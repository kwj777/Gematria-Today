<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Exploring Three-Based Words and Repeating Number Patterns</title>
  <desc id="desc">A 16 by 9 social image with repeating numbers 222, 333, and 666, geometric accents, and explanatory text about gematria patterns.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#111C44"/>
      <stop offset="1" stop-color="#2A1550"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 220) rotate(130) scale(440 340)">
      <stop stop-color="#6EE7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6EE7FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 760) rotate(40) scale(460 320)">
      <stop stop-color="#C084FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <g opacity="0.45" stroke="#8B5CF6" stroke-opacity="0.6" fill="none">
    <circle cx="1340" cy="640" r="210"/>
    <circle cx="1340" cy="640" r="150"/>
    <circle cx="1340" cy="640" r="90"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="84" y="86" width="948" height="728" rx="30" fill="url(#panel)" stroke="#E2E8F0" stroke-opacity="0.26"/>
    <rect x="104" y="106" width="908" height="688" rx="24" fill="#0B122C" fill-opacity="0.56"/>
  </g>

  <text x="134" y="178" fill="#A5B4FC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2.4">GEMATRIA PATTERN STUDY</text>

  <text x="134" y="250" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="56" font-weight="800">Exploring &#8220;Three-Based&#8221;</text>
  <text x="134" y="314" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="56" font-weight="800">Words &amp; Repeating</text>
  <text x="134" y="378" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="56" font-weight="800">Number Patterns</text>

  <text x="134" y="442" fill="#BFDBFE" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="500">Three-based words reveal repeating numerical</text>
  <text x="134" y="476" fill="#BFDBFE" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="500">symmetry across gematria systems.</text>

  <g transform="translate(132 520)">
    <rect width="420" height="240" rx="24" fill="#0B132E" fill-opacity="0.62" stroke="#7DD3FC" stroke-opacity="0.5"/>
    <text x="28" y="62" fill="#7DD3FC" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="30" font-weight="700">base 2  &#8594;  222</text>
    <text x="28" y="126" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="30" font-weight="700">base 3  &#8594;  333</text>
    <text x="28" y="190" fill="#FCA5A5" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="30" font-weight="700">base 6  &#8594;  666</text>
  </g>

  <g transform="translate(572 520)">
    <rect width="420" height="240" rx="24" fill="#111827" fill-opacity="0.62" stroke="#C084FC" stroke-opacity="0.48"/>
    <text x="24" y="56" fill="#E9D5FF" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="700">Digital Root Echo</text>
    <text x="24" y="108" fill="#D1D5DB" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="24" font-weight="500">222 &#8594; 2+2+2 = 6</text>
    <text x="24" y="152" fill="#D1D5DB" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="24" font-weight="500">333 &#8594; 3+3+3 = 9</text>
    <text x="24" y="196" fill="#D1D5DB" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="24" font-weight="500">666 &#8594; 6+6+6 = 18 &#8594; 9</text>
  </g>

  <text x="1080" y="172" fill="#7DD3FC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">INSIGHTS</text>

  <g transform="translate(1080 200)">
    <rect width="460" height="112" rx="18" fill="#0B132E" fill-opacity="0.55" stroke="#7DD3FC" stroke-opacity="0.45"/>
    <text x="24" y="50" fill="#E0F2FE" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="700">Different base</text>
    <text x="24" y="86" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="500">&#8594; different digital root</text>
  </g>

  <g transform="translate(1080 330)">
    <rect width="460" height="112" rx="18" fill="#0B132E" fill-opacity="0.55" stroke="#C084FC" stroke-opacity="0.45"/>
    <text x="24" y="50" fill="#F5D0FE" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="700">Same structure</text>
    <text x="24" y="86" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="500">&#8594; the digit repeats &#215;3</text>
  </g>

  <text x="1080" y="790" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">endtimes.today</text>
</svg>
