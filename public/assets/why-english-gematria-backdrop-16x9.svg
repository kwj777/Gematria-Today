    <path d="M170 520 L460 460 L760 540 L1110 460 L1450 560" fill="none"/>
    <path d="M230 760 L540 700 L860 760 L1180 680 L1480 760" fill="none"/>
  </g>

  <g fill="#cfeaff" fill-opacity="0.65">
    <circle cx="520" cy="220" r="5"/>
    <circle cx="810" cy="140" r="4"/>
    <circle cx="1180" cy="240" r="6"/>
    <circle cx="760" cy="540" r="5"/>
    <circle cx="1110" cy="460" r="4"/>
    <circle cx="540" cy="700" r="5"/>
