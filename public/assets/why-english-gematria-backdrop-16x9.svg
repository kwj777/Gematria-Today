<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why English Gematria backdrop image</title>
  <desc id="desc">Abstract geometric backdrop with gradients, rings, and connecting lines, without any wording.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102a67"/>
      <stop offset="55%" stop-color="#1f2c7c"/>
      <stop offset="100%" stop-color="#0c1a4f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#4cb7ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4cb7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="20%" r="36%">
      <stop offset="0%" stop-color="#8b7cff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <g stroke="#88c9ff" stroke-opacity="0.24" fill="none">
