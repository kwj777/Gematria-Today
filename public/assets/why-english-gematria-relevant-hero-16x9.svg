<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why is English gematria relevant hero image</title>
  <desc id="desc">A modern 16 by 9 hero image showing the English alphabet mapped to numbers, highlighting how gematria pattern-seeking is applied to modern language.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060A1C"/>
      <stop offset="0.55" stop-color="#112750"/>
      <stop offset="1" stop-color="#472268"/>
    </linearGradient>

    <radialGradient id="focusGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 470) rotate(145) scale(620 430)">
      <stop stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 780) rotate(25) scale(520 360)">
      <stop stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#A5B4FC" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <filter id="panelShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#focusGlow)"/>
  <rect width="1600" height="900" fill="url(#violetGlow)"/>

  <g opacity="0.35" stroke="#38BDF8" stroke-width="2">
    <circle cx="1220" cy="260" r="120"/>
    <circle cx="1220" cy="260" r="190"/>
    <circle cx="1220" cy="260" r="260"/>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="84" y="82" width="980" height="734" rx="32" fill="url(#panel)" stroke="#E2E8F0" stroke-opacity="0.26"/>
    <rect x="106" y="104" width="936" height="690" rx="24" fill="#08122F" fill-opacity="0.68"/>
  </g>

  <text x="138" y="184" fill="#A5B4FC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="2.4">MODERN LANGUAGE • CLASSICAL FRAMEWORK</text>
  <text x="138" y="275" fill="#F8FAFC" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="68" font-weight="800">Why is English gematria relevant?</text>

  <text x="138" y="350" fill="#BFDBFE" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="32" font-weight="500">English gematria applies numbers to explore patterns in modern language.</text>

  <g transform="translate(138 404)">
    <rect width="516" height="324" rx="24" fill="#0B173A" fill-opacity="0.72" stroke="#7DD3FC" stroke-opacity="0.52"/>
    <text x="28" y="56" fill="#7DD3FC" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="28" font-weight="700">A=6   B=12   C=18   D=24</text>
    <text x="28" y="106" fill="#93C5FD" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="28" font-weight="700">E=30  F=36   G=42   H=48</text>
    <text x="28" y="156" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="28" font-weight="700">… consistent numeric mapping …</text>

    <text x="28" y="224" fill="#E2E8F0" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">Not about original design intent.</text>
    <text x="28" y="266" fill="#E2E8F0" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">About a repeatable pattern-seeking system.</text>
  </g>

  <g transform="translate(698 404)">
    <rect width="326" height="324" rx="24" fill="#111827" fill-opacity="0.68" stroke="#C084FC" stroke-opacity="0.52"/>
    <text x="26" y="56" fill="#E9D5FF" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="28" font-weight="700">Why it matters</text>
    <text x="26" y="108" fill="#D1D5DB" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">• Uses today’s global language</text>
    <text x="26" y="152" fill="#D1D5DB" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">• Keeps gematria accessible</text>
    <text x="26" y="196" fill="#D1D5DB" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">• Supports modern analysis</text>
    <text x="26" y="240" fill="#D1D5DB" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="500">• Explores symbolic links</text>
  </g>

  <g opacity="0.82" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-weight="700">
    <text x="1120" y="490" fill="#FDE68A" font-size="78">E N G L I S H</text>
    <text x="1120" y="568" fill="#7DD3FC" font-size="62">→ numbers → patterns</text>
    <text x="1120" y="646" fill="#C4B5FD" font-size="52">→ interpretation</text>
  </g>

  <text x="1120" y="782" fill="#CBD5E1" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="26" font-weight="500">endtimes.today</text>
</svg>
