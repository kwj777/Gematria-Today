<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Why is English gematria relevant hero image</title>
  <desc id="desc">A two-panel hero illustration. The left panel shows the English alphabet mapped to its gematria values (A=6, B=12, C=18 through Z=156). The right panel highlights three reasons English gematria is relevant today: it uses a dominant modern language, supports repeatable analysis, and reveals cross-term patterns.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1480" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1027"/>
      <stop offset="0.55" stop-color="#141B42"/>
      <stop offset="1" stop-color="#22154F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 470) rotate(90) scale(360)">
      <stop stop-color="#8EE7FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8EE7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelLeft" x1="80" y1="260" x2="780" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2A61" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#101736" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="panelRight" x1="820" y1="260" x2="1520" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241A55" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#13103A" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="divider" x1="800" y1="240" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EE7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8EE7FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8EE7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowRibbon" x1="80" y1="0" x2="1520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="470" r="380" fill="url(#halo)"/>

  <g opacity="0.16" stroke="#9CC8FF">
    <path d="M0 150H1600"/>
    <path d="M0 300H1600"/>
    <path d="M0 450H1600"/>
    <path d="M0 600H1600"/>
    <path d="M0 750H1600"/>
    <path d="M200 0V900"/>
    <path d="M400 0V900"/>
    <path d="M600 0V900"/>
    <path d="M800 0V900"/>
    <path d="M1000 0V900"/>
    <path d="M1200 0V900"/>
    <path d="M1400 0V900"/>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="108" font-size="22" font-weight="700" fill="#9FD5FF" letter-spacing="6">MODERN LANGUAGE · CLASSICAL FRAMEWORK</text>
    <text x="800" y="178" font-size="60" font-weight="800" fill="#F4F8FF">Why is English gematria relevant?</text>
  </g>

  <rect x="80" y="240" width="700" height="560" rx="28" fill="url(#panelLeft)" stroke="#6FA9FF" stroke-opacity="0.55"/>
  <rect x="820" y="240" width="700" height="560" rx="28" fill="url(#panelRight)" stroke="#B79CFF" stroke-opacity="0.55"/>
  <rect x="797" y="240" width="6" height="560" fill="url(#divider)"/>

  <g font-family="'Inter', 'Segoe UI', sans-serif">
    <text x="430" y="298" text-anchor="middle" font-size="32" font-weight="700" fill="#C8ECFF">A consistent numeric mapping</text>
    <text x="430" y="332" text-anchor="middle" font-size="18" font-weight="500" fill="#9FD5FF" letter-spacing="2">EVERY LETTER, ONE RULE</text>
  </g>

  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="middle" font-size="26" font-weight="700">
    <text x="160" y="408" fill="#DDF6FF">A=6</text>
    <text x="295" y="408" fill="#DDF6FF">B=12</text>
    <text x="430" y="408" fill="#DDF6FF">C=18</text>
    <text x="565" y="408" fill="#DDF6FF">D=24</text>
    <text x="700" y="408" fill="#DDF6FF">E=30</text>

    <text x="160" y="466" fill="#BFE4FF">F=36</text>
    <text x="295" y="466" fill="#BFE4FF">G=42</text>
    <text x="430" y="466" fill="#BFE4FF">H=48</text>
    <text x="565" y="466" fill="#BFE4FF">I=54</text>
    <text x="700" y="466" fill="#BFE4FF">J=60</text>

    <text x="160" y="524" fill="#A6D5FF">K=66</text>
    <text x="295" y="524" fill="#A6D5FF">L=72</text>
    <text x="430" y="524" fill="#A6D5FF">M=78</text>
    <text x="565" y="524" fill="#A6D5FF">N=84</text>
    <text x="700" y="524" fill="#A6D5FF">O=90</text>

    <text x="160" y="582" fill="#8FC4FF">P=96</text>
    <text x="295" y="582" fill="#8FC4FF">Q=102</text>
    <text x="430" y="582" fill="#8FC4FF">R=108</text>
    <text x="565" y="582" fill="#8FC4FF">S=114</text>
    <text x="700" y="582" fill="#8FC4FF">T=120</text>

    <text x="160" y="640" fill="#78B2FF">U=126</text>
    <text x="295" y="640" fill="#78B2FF">V=132</text>
    <text x="430" y="640" fill="#78B2FF">W=138</text>
    <text x="565" y="640" fill="#78B2FF">X=144</text>
    <text x="700" y="640" fill="#78B2FF">Y=150</text>
  </g>

  <g font-family="'JetBrains Mono', 'Consolas', monospace" text-anchor="middle">
    <text x="430" y="704" font-size="32" font-weight="700" fill="#FDE68A">Z = 156</text>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="430" y="758" font-size="18" font-weight="500" fill="#9FD5FF" opacity="0.85">Same input → same number. Always.</text>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif">
    <text x="1170" y="298" text-anchor="middle" font-size="32" font-weight="700" fill="#E9D5FF">Why it matters today</text>
    <text x="1170" y="332" text-anchor="middle" font-size="18" font-weight="500" fill="#BFA9FF" letter-spacing="2">THREE REASONS</text>
  </g>

  <g font-family="'Inter', 'Segoe UI', sans-serif">
    <circle cx="888" cy="406" r="22" fill="#7DD3FC" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.7" stroke-width="2"/>
    <text x="888" y="414" text-anchor="middle" font-size="22" font-weight="800" fill="#7DD3FC">1</text>
    <text x="930" y="400" font-size="26" font-weight="700" fill="#E9F4FF">Dominant modern language</text>
    <text x="930" y="430" font-size="18" font-weight="500" fill="#BFE4FF">Headlines, policy, finance, search — the</text>
    <text x="930" y="454" font-size="18" font-weight="500" fill="#BFE4FF">surface where contemporary patterns appear.</text>

    <circle cx="888" cy="528" r="22" fill="#C084FC" fill-opacity="0.18" stroke="#C084FC" stroke-opacity="0.7" stroke-width="2"/>
    <text x="888" y="536" text-anchor="middle" font-size="22" font-weight="800" fill="#C084FC">2</text>
    <text x="930" y="522" font-size="26" font-weight="700" fill="#F4EBFF">Repeatable and auditable</text>
    <text x="930" y="552" font-size="18" font-weight="500" fill="#D6BBFC">One rule, every letter. Anyone can</text>
    <text x="930" y="576" font-size="18" font-weight="500" fill="#D6BBFC">recompute and challenge a result.</text>

    <circle cx="888" cy="650" r="22" fill="#FDE68A" fill-opacity="0.18" stroke="#FDE68A" stroke-opacity="0.7" stroke-width="2"/>
    <text x="888" y="658" text-anchor="middle" font-size="22" font-weight="800" fill="#FDE68A">3</text>
    <text x="930" y="644" font-size="26" font-weight="700" fill="#FFF5D5">Reveals cross-term patterns</text>
    <text x="930" y="674" font-size="18" font-weight="500" fill="#FBE49A">Full totals, digital roots, base-rooted</text>
    <text x="930" y="698" font-size="18" font-weight="500" fill="#FBE49A">words — three layers, one workflow.</text>
  </g>

  <rect x="80" y="828" width="1440" height="2" fill="url(#flowRibbon)"/>

  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="22" font-weight="700">
    <text x="160" y="864" fill="#7DD3FC">English text</text>
    <text x="445" y="864" fill="#9FD5FF" opacity="0.85">→</text>
    <text x="500" y="864" fill="#BFE4FF">numeric values</text>
    <text x="810" y="864" fill="#9FD5FF" opacity="0.85">→</text>
    <text x="865" y="864" fill="#E9D5FF">repeated relationships</text>
    <text x="1290" y="864" fill="#C084FC" opacity="0.85">→</text>
    <text x="1345" y="864" fill="#FDE68A">interpretation</text>
  </g>
</svg>
