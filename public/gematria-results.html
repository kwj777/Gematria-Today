<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gematria Matches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/index2.html">EndTimes.Today</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="siteNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/index2.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/calculator.html">Calculator</a></li>
            <li class="nav-item"><a class="nav-link" href="/nameCalculator.html">Name Lookup</a></li>
            <li class="nav-item"><a class="nav-link" href="/index3.html">Database</a></li>
            <li class="nav-item"><a class="nav-link" href="/faq.html">FAQ</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="py-5">
      <div class="container"><section class="content-panel p-4 p-lg-5"><a class="btn btn-outline-secondary btn-sm mb-3" href="/nameCalculator.html">← Back to Name Calculator</a><h1 id="page-title" class="mb-2">Gematria matches</h1><p id="page-meta" class="text-muted"></p><div class="card border-0 shadow-sm mb-4"><div class="card-body p-4"><label for="word-search" class="form-label fw-semibold">Search these words</label><input id="word-search" class="form-control form-control-lg" type="search" placeholder="Type to filter matching words" /></div></div><p id="status" class="text-muted">Loading words…</p><ul id="word-list" class="list-group result-list" hidden></ul><p id="empty" class="text-muted" hidden>No matching words found.</p></section></div>
      <script>
const titleNode = document.querySelector('#page-title');
      const metaNode = document.querySelector('#page-meta');
      const statusNode = document.querySelector('#status');
      const searchNode = document.querySelector('#word-search');
      const listNode = document.querySelector('#word-list');
      const emptyNode = document.querySelector('#empty');
      const params = new URLSearchParams(window.location.search);
      const gematria = String(params.get('gematria') || '').trim();
      let allWords = [];

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      async function requestWordsByGematria(total) {
        const response = await fetch(`/.netlify/functions/searchByGematria?gematria=${encodeURIComponent(total)}`);
        const rawBody = await response.text();
        let payload;

        try {
          payload = JSON.parse(rawBody);
        } catch {
          payload = { error: rawBody || 'Non-JSON response from server.' };
        }

        if (!response.ok) {
          throw new Error(payload.error || payload.message || `HTTP ${response.status}`);
        }

        return payload;
      }

      function createWordItem(entry) {
        const item = document.createElement('li');
        item.className = 'word-item';
        item.innerHTML = `
          <a class="word-link" href="/calculator.html?query=${encodeURIComponent(entry.word)}" target="_blank" rel="noopener noreferrer">${escapeHtml(entry.word)}</a>
          <div class="word-actions">
            <span>Root ${escapeHtml(String(entry.gematria.digitalRoot))}</span>
            <a class="definition-link" href="/definition?word=${encodeURIComponent(entry.word)}" target="_blank" rel="noopener noreferrer">(definition)</a>
          </div>
        `;
        return item;
      }

      function renderList(words) {
        listNode.innerHTML = '';

        if (!words.length) {
          listNode.hidden = true;
          emptyNode.hidden = false;
          statusNode.textContent = allWords.length ? 'No words match your search.' : '';
          return;
        }

        emptyNode.hidden = true;
        listNode.hidden = false;
        statusNode.textContent = `${words.length} word${words.length === 1 ? '' : 's'} shown`;
        words.forEach((entry) => listNode.appendChild(createWordItem(entry)));
      }

      function applySearch() {
        const query = searchNode.value.trim().toLowerCase();
        const filtered = !query
          ? allWords
          : allWords.filter((entry) => entry.word.toLowerCase().includes(query));
        renderList(filtered);
      }

      async function init() {
        if (!gematria) {
          titleNode.textContent = 'Gematria matches';
          statusNode.textContent = 'Missing gematria value in the page URL.';
          searchNode.disabled = true;
          return;
        }

        titleNode.textContent = `Gematria ${gematria} matches`;
        document.title = `Gematria ${gematria} Matches`;

        try {
          const payload = await requestWordsByGematria(gematria);
          allWords = Array.isArray(payload.words) ? payload.words : [];
          metaNode.textContent = `${payload.count || allWords.length} total word${(payload.count || allWords.length) === 1 ? '' : 's'} with gematria ${gematria}.`;
          statusNode.textContent = '';
          applySearch();
        } catch (error) {
          statusNode.textContent = error.message || 'Unable to load matching words.';
          searchNode.disabled = true;
        }
      }

      searchNode.addEventListener('input', applySearch);
      window.addEventListener('DOMContentLoaded', init);
      </script>
    </main>
    <footer class="site-footer py-4 mt-5">
      <div class="container d-flex flex-column flex-lg-row justify-content-between gap-2 small text-muted">
        <span>EndTimes.Today — a Bootstrap-powered research workspace.</span>
        <span>Shared UI theme applied across every page in this project.</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
