<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Gematria (Base-6)</title>
    <style>
      body {
        font-family: Helvetica, Arial, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
        line-height: 1.5;
      }

      h2 {
        margin-top: 2rem;
      }

      form {
        display: grid;
        gap: 0.75rem;
        margin: 1rem 0;
      }

      .field-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .field {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.35rem;
        min-width: 200px;
      }

      input,
      button {
        font: inherit;
        padding: 0.55rem 0.7rem;
      }

      button {
        width: fit-content;
        cursor: pointer;
      }

      .panel {
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 1rem;
        margin-top: 1.25rem;
        background: #fafbfc;
      }

      .status {
        min-height: 1.5rem;
        margin: 0.5rem 0 0;
      }

      .muted {
        color: #57606a;
      }

      ul {
        padding-left: 1.25rem;
      }

      li + li {
        margin-top: 0.75rem;
      }

      .result-meta {
        margin-bottom: 0.75rem;
      }

      .related-word {
        font-weight: 700;
      }

      .matching-word {
        display: inline-block;
        padding: 0.1rem 0.35rem;
        border-radius: 999px;
        background: #fff8c5;
        color: #7a4e00;
      }

      .gematria-detail {
        margin-top: 0.2rem;
        color: #57606a;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <h1>English Gematria Calculator (Base-6)</h1>

    <section class="panel">
      <h2>Gematria Lookup + Related Words</h2>
      <form id="lookup-form">
        <div class="field-row">
          <label class="field" for="lookup-input">
            <span>Enter a word or phrase</span>
            <input id="lookup-input" name="query" type="text" required />
          </label>

          <label class="field" for="related-limit-input">
            <span>Synonym limit</span>
            <input id="related-limit-input" name="limit" type="number" min="1" step="1" value="10" required />
          </label>
        </div>
        <button type="submit">Calculate and Find Related Words</button>
      </form>

      <p id="lookup-status" class="status muted"></p>
      <p id="gematria-result" class="status"></p>
      <div id="related-words-result"></div>
    </section>

    <script>
      const lookupForm = document.querySelector('#lookup-form');
      const lookupInput = document.querySelector('#lookup-input');
      const relatedLimitInput = document.querySelector('#related-limit-input');
      const lookupStatus = document.querySelector('#lookup-status');
      const gematriaResult = document.querySelector('#gematria-result');
      const relatedWordsResult = document.querySelector('#related-words-result');

      async function requestJson(endpoint, searchParams) {
        const response = await fetch(`${endpoint}?${searchParams.toString()}`);
        const rawBody = await response.text();

        let payload = null;
        try {
          payload = JSON.parse(rawBody);
        } catch {
          payload = { error: rawBody || 'Non-JSON response from server.' };
        }

        if (!response.ok) {
          const message = payload.error || payload.message || payload.errorMessage || `HTTP ${response.status}`;
          throw new Error(message);
        }

        return payload;
      }

      async function requestGematria(word) {
        const searchParams = new URLSearchParams({ word });
        return requestJson('/.netlify/functions/englishGematria', searchParams);
      }

      async function requestRelatedWords(term, limit) {
        const searchParams = new URLSearchParams({ word: term, limit: String(limit) });
        return requestJson('/.netlify/functions/wordnikRelatedWords', searchParams);
      }

      async function enrichRelationshipWords(relationships) {
        return Promise.all(
          relationships.map(async (relationship) => {
            const words = Array.isArray(relationship.words) ? relationship.words : [];

            const wordsWithGematria = await Promise.all(
              words.map(async (word) => {
                try {
                  const gematria = await requestGematria(word);
                  return { word, gematria };
                } catch (error) {
                  return { word, gematriaError: error.message || 'Unable to calculate gematria.' };
                }
              })
            );

            return {
              relationshipType: relationship.relationshipType || 'Related words',
              words: wordsWithGematria,
            };
          })
        );
      }

      function createWordListItem(wordResult, searchTotal) {
        const item = document.createElement('li');
        const wordLabel = document.createElement('div');
        const hasMatchingGematria = Boolean(wordResult.gematria) && wordResult.gematria.gematria.total === searchTotal;
        wordLabel.className = hasMatchingGematria ? 'related-word matching-word' : 'related-word';
        wordLabel.textContent = wordResult.word;
        item.appendChild(wordLabel);

        const gematriaDetail = document.createElement('div');
        gematriaDetail.className = 'gematria-detail';

        if (wordResult.gematria) {
          const payload = wordResult.gematria;
          const matchPrefix = hasMatchingGematria ? 'Gematria match! ' : '';
          gematriaDetail.textContent = `${matchPrefix}Gematria: ${payload.gematria.total} | Digital Root: ${payload.gematria.digitalRoot} | Base Root: ${payload.isBaseRoot} | Searches: ${payload.searchCount}`;
        } else {
          gematriaDetail.textContent = wordResult.gematriaError || 'Unable to calculate gematria.';
        }

        item.appendChild(gematriaDetail);
        return item;
      }

      function renderRelatedWords(payload, relationships, searchGematria) {
        relatedWordsResult.innerHTML = '';

        const meta = document.createElement('div');
        meta.className = 'result-meta';
        meta.innerHTML = `
          <strong>Results for:</strong> ${payload.query}<br />
          <strong>Limit used:</strong> ${payload.limit}<br />
          <strong>Search gematria:</strong> ${searchGematria.gematria.total}
        `;
        relatedWordsResult.appendChild(meta);

        if (relationships.length === 0) {
          const emptyState = document.createElement('p');
          emptyState.textContent = 'No related words were returned.';
          relatedWordsResult.appendChild(emptyState);
          return;
        }

        relationships.forEach((relationship) => {
          const section = document.createElement('section');
          const heading = document.createElement('h3');
          heading.textContent = relationship.relationshipType;
          section.appendChild(heading);

          if (relationship.words.length === 0) {
            const emptyWords = document.createElement('p');
            emptyWords.textContent = 'No words returned for this relationship.';
            section.appendChild(emptyWords);
          } else {
            const list = document.createElement('ul');
            relationship.words.forEach((wordResult) => {
              list.appendChild(createWordListItem(wordResult, searchGematria.gematria.total));
            });
            section.appendChild(list);
          }

          relatedWordsResult.appendChild(section);
        });
      }

      lookupForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const term = lookupInput.value.trim();
        const limit = relatedLimitInput.value.trim();

        if (!term) {
          lookupStatus.textContent = 'Please enter a word or phrase.';
          gematriaResult.textContent = '';
          relatedWordsResult.innerHTML = '';
          return;
        }

        if (!limit || Number(limit) <= 0 || !Number.isInteger(Number(limit))) {
          lookupStatus.textContent = 'Please enter a positive whole number for the limit.';
          gematriaResult.textContent = '';
          relatedWordsResult.innerHTML = '';
          return;
        }

        lookupStatus.textContent = 'Searching for gematria and related words...';
        gematriaResult.textContent = '';
        relatedWordsResult.innerHTML = '';

        try {
          const searchGematria = await requestGematria(term);
          gematriaResult.textContent = `Base-6 English Gematria for "${searchGematria.word}": ${searchGematria.gematria.total} (Digital Root: ${searchGematria.gematria.digitalRoot}) | Base Root: ${searchGematria.isBaseRoot} | Searches: ${searchGematria.searchCount}`;

          const relatedWordsPayload = await requestRelatedWords(term, limit);
          const relationships = Array.isArray(relatedWordsPayload.data) ? relatedWordsPayload.data : [];
          const enrichedRelationships = await enrichRelationshipWords(relationships);
          lookupStatus.textContent = '';
          renderRelatedWords(relatedWordsPayload, enrichedRelationships, searchGematria);
        } catch (error) {
          lookupStatus.textContent = error.message || 'Unable to load gematria and related words.';
          gematriaResult.textContent = '';
          relatedWordsResult.innerHTML = '';
        }
      });
    </script>
  </body>
</html>
