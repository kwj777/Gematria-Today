<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Calculator</title>
    <style>
      :root {
        color-scheme: light;
        --border: #d0d7de;
        --bg: #f6f8fa;
        --card: #ffffff;
        --text: #1f2328;
        --muted: #57606a;
        --accent: #0969da;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Helvetica, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #ffffff 0%, #f6f8fa 100%);
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      h1,
      h2,
      h3,
      p { margin-top: 0; }

      .intro,
      .results-shell {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 18px 50px rgba(31, 35, 40, 0.08);
      }

      .intro {
        padding: 1.5rem;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .field {
        display: grid;
        gap: 0.45rem;
      }

      label {
        font-weight: 700;
      }

      input,
      button {
        font: inherit;
      }

      input {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      button {
        width: fit-content;
        padding: 0.8rem 1.15rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover { filter: brightness(0.96); }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .secondary-button {
        background: #dbeafe;
        color: var(--accent);
      }

      .status {
        min-height: 1.5rem;
        color: var(--muted);
      }

      .results-shell {
        margin-top: 1.5rem;
        padding: 1.25rem;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .result-card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg);
        padding: 1rem;
      }

      .result-card h3 {
        word-break: break-word;
        margin-bottom: 0.5rem;
      }

      .meta {
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      .section + .section {
        margin-top: 1rem;
      }

      .inline-button,
      .word-button {
        border: 0;
        padding: 0;
        color: var(--accent);
        background: transparent;
        text-decoration: underline;
        cursor: pointer;
      }

      .word-list {
        margin: 0;
        padding-left: 1.15rem;
      }

      .word-list li + li {
        margin-top: 0.6rem;
      }

      .word-list small {
        color: var(--muted);
      }

      .empty,
      .error {
        color: var(--muted);
      }

      .error { color: #b42318; }

      .mobile-note {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .field-grid,
        .results-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>Name Calculator</h1>
        <p>Enter up to three personal names. On larger screens, each name appears in its own results column. On mobile devices, the results stack into a single column below.</p>

        <form id="name-form">
          <div class="field-grid">
            <div class="field">
              <label for="name-1">Name 1</label>
              <input id="name-1" name="name1" type="text" placeholder="First name" />
            </div>
            <div class="field">
              <label for="name-2">Name 2</label>
              <input id="name-2" name="name2" type="text" placeholder="Second name" />
            </div>
            <div class="field">
              <label for="name-3">Name 3</label>
              <input id="name-3" name="name3" type="text" placeholder="Third name" />
            </div>
          </div>
          <div class="button-row">
            <button type="submit">Calculate</button>
            <button type="button" id="clear-names" class="secondary-button">Clear Names</button>
          </div>
        </form>

        <p id="status" class="status"></p>
        <p id="mobile-note" class="mobile-note"></p>
      </section>

      <section id="results-shell" class="results-shell" hidden>
        <h2>Results</h2>
        <div id="results-grid" class="results-grid"></div>
      </section>
    </main>

    <script>
      const form = document.querySelector('#name-form');
      const statusNode = document.querySelector('#status');
      const mobileNoteNode = document.querySelector('#mobile-note');
      const resultsShell = document.querySelector('#results-shell');
      const resultsGrid = document.querySelector('#results-grid');
      const clearNamesButton = document.querySelector('#clear-names');
      const MOBILE_QUERY = '(max-width: 820px), (pointer: coarse)';
      const DISPLAY_RELATED_WORD_LIMIT = 10;
      const FULL_RELATED_WORD_LIMIT = 1000;

      function isMobileDevice() {
        return window.matchMedia(MOBILE_QUERY).matches;
      }

      function getNamesFromForm() {
        const formData = new FormData(form);
        return ['name1', 'name2', 'name3']
          .map((key) => String(formData.get(key) || '').trim())
          .filter(Boolean);
      }

      async function requestJson(endpoint, searchParams) {
        const response = await fetch(`${endpoint}?${searchParams.toString()}`);
        const rawBody = await response.text();

        let payload;
        try {
          payload = JSON.parse(rawBody);
        } catch {
          payload = { error: rawBody || 'Non-JSON response from server.' };
        }

        if (!response.ok) {
          throw new Error(payload.error || payload.message || `HTTP ${response.status}`);
        }

        return payload;
      }

      function requestGematria(word) {
        return requestJson('/.netlify/functions/englishGematria', new URLSearchParams({ word }));
      }

      function requestRelatedWords(word, limit = FULL_RELATED_WORD_LIMIT) {
        return requestJson('/.netlify/functions/wordnikRelatedWords', new URLSearchParams({ word, limit: String(limit) }));
      }

      function requestWordsByGematria(total) {
        return requestJson('/.netlify/functions/searchByGematria', new URLSearchParams({ gematria: String(total) }));
      }

      function createTextNode(text) {
        return document.createTextNode(text);
      }

      function getDefaultMobileNote() {
        return isMobileDevice()
          ? 'Mobile mode is active: results will appear below in a single column.'
          : 'Desktop mode is active: results will appear below in three columns.';
      }

      function resetResultsView() {
        resultsGrid.innerHTML = '';
        resultsShell.hidden = true;
      }

      async function showSingleNameResult(name) {
        const singleName = String(name || '').trim();
        if (!singleName) {
          return;
        }

        mobileNoteNode.textContent = `Showing single-name results for ${singleName}.`;
        await renderResults([singleName]);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('\"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function createGematriaButton(total) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'inline-button';
        button.textContent = String(total);
        button.addEventListener('click', async () => {
          button.disabled = true;
          const originalText = button.textContent;
          button.textContent = `${originalText}…`;
          try {
            const payload = await requestWordsByGematria(total);
            const words = (payload.words || []).slice(0, 20).map((entry) => entry.word).join(', ');
            const suffix = payload.count > 20 ? '…' : '';
            window.alert(words ? `Words with gematria ${total}: ${words}${suffix}` : `No words found with gematria ${total}.`);
          } catch (error) {
            window.alert(error.message || 'Unable to load matching gematria words.');
          } finally {
            button.disabled = false;
            button.textContent = originalText;
          }
        });
        return button;
      }

      function createRelatedWordButton(word) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'word-button';
        button.textContent = word;
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            await showSingleNameResult(word);
          } finally {
            button.disabled = false;
          }
        });
        return button;
      }

      function dedupeRelatedWords(name, relationships) {
        const seen = new Set();
        return relationships
          .map((entry) => ({
            relationshipType: entry.relationshipType || 'Related words',
            words: (Array.isArray(entry.words) ? entry.words : []).filter((word) => {
              const normalized = String(word || '').trim().toLowerCase();
              if (!normalized || normalized === name.toLowerCase() || seen.has(normalized)) {
                return false;
              }
              seen.add(normalized);
              return true;
            }),
          }))
          .filter((entry) => entry.words.length > 0);
      }

      function getEnglishGematriaSearchUrl(word) {
        return `/calculator.html?query=${encodeURIComponent(String(word || '').trim())}`;
      }

      function openFullRelatedWordsWindow(name, result, relationships) {
        const popup = window.open('', '_blank');
        if (!popup) {
          return;
        }

        const sections = relationships.map((entry) => `
          <section>
            <h2>${escapeHtml(entry.relationshipType)}</h2>
            <ul>${entry.words.map((word) => `<li><a href="${escapeHtml(getEnglishGematriaSearchUrl(word))}">${escapeHtml(word)}</a></li>`).join('')}</ul>
          </section>
        `).join('');

        popup.document.write(`<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full related words for ${escapeHtml(name)}</title>
    <style>
      body { font-family: Helvetica, Arial, sans-serif; margin: 0; padding: 2rem; color: #1f2328; background: #f6f8fa; }
      main { max-width: 900px; margin: 0 auto; background: #fff; border: 1px solid #d0d7de; border-radius: 16px; padding: 1.5rem; }
      h1, h2, p { margin-top: 0; }
      .meta { color: #57606a; margin-bottom: 1.5rem; }
      section + section { margin-top: 1.5rem; }
      ul { padding-left: 1.2rem; }
      li + li { margin-top: 0.35rem; }
      a { color: #0969da; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>${escapeHtml(name)}</h1>
      <p class="meta">Original word: ${escapeHtml(result.related?.query || name)} | Gematria: ${escapeHtml(String(result.gematria.gematria.total))} | Digital Root: ${escapeHtml(String(result.gematria.gematria.digitalRoot))} | Base Root: ${escapeHtml(result.gematria.isBaseRoot ? 'Yes' : 'No')} | Searches: ${escapeHtml(String(result.gematria.searchCount))}</p>
      <p class="meta">Click any related word below to open an English Gematria search for that word.</p>
      ${sections || '<p>No related words found.</p>'}
    </main>
  </body>
</html>`);
        popup.document.close();
        popup.focus();
      }

      function createResultCard(name, result) {
        const article = document.createElement('article');
        article.className = 'result-card';

        const title = document.createElement('h3');
        title.textContent = name;
        article.appendChild(title);

        if (result.error) {
          const error = document.createElement('p');
          error.className = 'error';
          error.textContent = result.error;
          article.appendChild(error);
          return article;
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.append(
          createTextNode('Original word: '),
          createTextNode(result.related?.query || name),
          createTextNode(' | Gematria: '),
          createGematriaButton(result.gematria.gematria.total),
          createTextNode(` | Digital Root: ${result.gematria.gematria.digitalRoot} | Base Root: ${result.gematria.isBaseRoot ? 'Yes' : 'No'} | Searches: ${result.gematria.searchCount}`)
        );
        article.appendChild(meta);

        const relationships = dedupeRelatedWords(name, Array.isArray(result.related?.data) ? result.related.data : []);
        const relatedSection = document.createElement('section');
        relatedSection.className = 'section';
        const relatedHeading = document.createElement('h4');
        relatedHeading.textContent = 'Related words';
        relatedSection.appendChild(relatedHeading);

        if (!relationships.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No related words found.';
          relatedSection.appendChild(empty);
        } else {
          relationships.forEach((entry) => {
            const relationshipHeading = document.createElement('h5');
            relationshipHeading.textContent = entry.relationshipType;
            relatedSection.appendChild(relationshipHeading);

            const list = document.createElement('ul');
            list.className = 'word-list';
            entry.words.slice(0, DISPLAY_RELATED_WORD_LIMIT).forEach((word) => {
              const item = document.createElement('li');
              item.appendChild(createRelatedWordButton(word));
              list.appendChild(item);
            });
            relatedSection.appendChild(list);

            relatedSection.appendChild(document.createElement('br'));

            const fullListLink = document.createElement('a');
            fullListLink.href = '#';
            fullListLink.textContent = 'See Full List in a New Window';
            fullListLink.addEventListener('click', (event) => {
              event.preventDefault();
              openFullRelatedWordsWindow(name, result, relationships);
            });
            relatedSection.appendChild(fullListLink);
          });
        }

        article.appendChild(relatedSection);
        return article;
      }

      async function fetchNameResult(name) {
        try {
          const gematria = await requestGematria(name);

          try {
            const related = await requestRelatedWords(name.toLowerCase(), FULL_RELATED_WORD_LIMIT);
            return { gematria, related };
          } catch (error) {
            return {
              gematria,
              related: { data: [] },
            };
          }
        } catch (error) {
          return { error: error.message || 'Unable to load this name.' };
        }
      }

      async function renderResults(names) {
        statusNode.textContent = 'Calculating names...';
        resultsShell.hidden = false;
        resultsGrid.innerHTML = '';

        const results = await Promise.all(names.map((name) => fetchNameResult(name)));
        results.forEach((result, index) => {
          resultsGrid.appendChild(createResultCard(names[index], result));
        });

        statusNode.textContent = '';
      }

      async function maybeRenderSingleResultFromQuery() {
        const searchParams = new URLSearchParams(window.location.search);
        const singleName = String(searchParams.get('single') || '').trim();
        if (!singleName) {
          return false;
        }

        document.title = `${singleName} | Name Calculator`;
        await showSingleNameResult(singleName);
        return true;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        mobileNoteNode.textContent = '';

        const names = getNamesFromForm();
        if (!names.length) {
          statusNode.textContent = 'Please enter at least one name.';
          resetResultsView();
          return;
        }

        await renderResults(names);
      });

      clearNamesButton.addEventListener('click', () => {
        form.reset();
        statusNode.textContent = '';
        mobileNoteNode.textContent = getDefaultMobileNote();
        document.title = 'Name Calculator';
        resetResultsView();
      });

      window.addEventListener('DOMContentLoaded', async () => {
        const renderedSingle = await maybeRenderSingleResultFromQuery();
        if (!renderedSingle) {
          mobileNoteNode.textContent = getDefaultMobileNote();
        }
      });
    </script>
  </body>
</html>
